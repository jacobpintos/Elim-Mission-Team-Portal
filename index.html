function hasUnseenPost(){
  if(!S.user||!S.postsConfig) return false;
  var uid=String(S.user.id||S.user.uid||'');
  var lastSeen=S.lastSeenPosts||{};
  return (S.postsConfig.pages||[]).some(function(pg){
    var posts=pg.posts||[];
    if(!posts.length) return false;
    var latest=posts[posts.length-1];
    return (latest.ts||0)>(lastSeen[uid+'_'+pg.id]||0);
  });
}

function hasUnseenPostForPage(pgId){
  if(!S.user||!S.postsConfig) return false;
  var uid=String(S.user.id||S.user.uid||'');
  var pg=(S.postsConfig.pages||[]).find(function(p){return p.id===pgId;});
  if(!pg||!pg.posts||!pg.posts.length) return false;
  var latest=pg.posts[pg.posts.length-1];
  return (latest.ts||0)>((S.lastSeenPosts||{})[uid+'_'+pgId]||0);
}

function markPageSeen(pgId){
  if(!S.user) return;
  var uid=String(S.user.id||S.user.uid||'');
  if(!S.lastSeenPosts) S.lastSeenPosts={};
  S.lastSeenPosts[uid+'_'+pgId]=Date.now();
  save();
}

function postsView(){
  var u=S.user;
  var isAdm=isAdmin(u);
  var adminMode=isAdm&&S._postsAdminMode;
  if(!S.postsConfig) S.postsConfig={pages:[]};
  var pages=S.postsConfig.pages||[];
  var w=D({});

  if(isAdm){
    var bar=D({style:{display:'flex',justifyContent:'flex-end',marginBottom:'12px',gap:'8px'}});
    bar.appendChild(BTN({cls:'btn '+(adminMode?'br':'bo')+' bsm',click:safe(function(){S._postsAdminMode=!S._postsAdminMode;render();})},adminMode?'Exit Build Mode':'Build Mode'));
    w.appendChild(bar);
  }

  if(isAdm&&adminMode) return buildPostsAdminMode(w,pages);

  w.appendChild(P({style:{fontSize:'22px',fontWeight:'700',color:'#e8624a',marginBottom:'4px',textAlign:'center'}},'Posts'));
  w.appendChild(P({style:{fontSize:'13px',color:'#b0adc4',marginBottom:'1.5rem',textAlign:'center'}},'Updates from our community'));

  // Horizontal page selector
  var activePageId=S._postsActivePage||(pages.length?pages[0].id:'');
  var selectorRow=D({style:{display:'flex',gap:'12px',marginBottom:'1.5rem',overflowX:'auto',paddingBottom:'4px'}});
  pages.forEach(function(pg){
    var unseen=hasUnseenPostForPage(pg.id);
    var isActive=activePageId===pg.id;
    var btnWrap=D({style:{flex:'1',minWidth:'120px',maxWidth:'220px'}});
    var btn=document.createElement('button');
    btn.style.cssText='width:100%;border-radius:12px;overflow:hidden;border:2px solid '+(isActive?'#e8624a':'rgba(232,98,74,.2)')+';background:transparent;cursor:pointer;padding:0;position:relative;display:block;';
    var bgDiv=D({style:{height:'100px',backgroundImage:pg.bgImage?'url('+pg.bgImage+')':'none',backgroundSize:'cover',backgroundPosition:'center center',background:pg.bgImage?'':'rgba(232,98,74,.08)',display:'flex',alignItems:'center',justifyContent:'center'}});
    if(!pg.bgImage) bgDiv.appendChild(SP({style:{fontSize:'28px',color:'rgba(232,98,74,.3)'}},'\uD83D\uDCDD'));
    btn.appendChild(bgDiv);
    var labelBar=D({style:{padding:'8px 10px',background:isActive?'rgba(232,98,74,.9)':'rgba(20,20,30,.85)',textAlign:'center'}});
    labelBar.appendChild(SP({style:{fontSize:'12px',fontWeight:'600',color:'#fff',display:'block'}},pg.label));
    btn.appendChild(labelBar);
    if(unseen){
      var dot=D({style:{position:'absolute',top:'6px',right:'6px',width:'9px',height:'9px',borderRadius:'50%',background:'#e8624a',border:'2px solid #fff',zIndex:'1'}});
      btn.appendChild(dot);
    }
    (function(id){btn.addEventListener('click',safe(function(){S._postsActivePage=id;S._postsDateIdx=0;markPageSeen(id);render();}));})(pg.id);
    btnWrap.appendChild(btn);
    if(pg.desc) btnWrap.appendChild(P({style:{fontSize:'11px',color:'#b0adc4',marginTop:'6px',textAlign:'center',lineHeight:'1.4',padding:'0 4px'}},pg.desc));
    selectorRow.appendChild(btnWrap);
  });
  w.appendChild(selectorRow);

  var activePage=pages.find(function(p){return p.id===activePageId;});
  if(!activePage){ w.appendChild(D({cls:'empty'},'No pages configured yet.')); return w; }
  markPageSeen(activePage.id);

  var posts=(activePage.posts||[]).slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  var activeIdx=S._postsDateIdx||0;
  activeIdx=Math.max(0,Math.min(activeIdx,Math.max(0,posts.length-1)));

  if(!posts.length){
    var emptyCard=D({cls:'card',style:{textAlign:'center',padding:'2rem'}});
    emptyCard.appendChild(P({style:{color:'#b0adc4',marginBottom:'12px'}},'No posts yet.'));
    if(activePage.fbUrl){
      var fbA=document.createElement('a');fbA.href=activePage.fbUrl;fbA.target='_blank';fbA.rel='noopener';
      fbA.textContent='Visit on Facebook';fbA.style.cssText='color:#e8624a;font-size:13px;';
      emptyCard.appendChild(fbA);
    }
    w.appendChild(emptyCard);
    return w;
  }

  var currentPost=posts[activeIdx];

  // Date nav
  var navRow=D({style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}});
  var prevBtn=BTN({cls:'btn bo bsm'});prevBtn.textContent='\u2190 Newer';prevBtn.disabled=activeIdx===0;
  (function(i){prevBtn.addEventListener('click',safe(function(){S._postsDateIdx=i-1;render();}));})(activeIdx);
  var nextBtn=BTN({cls:'btn bo bsm'});nextBtn.textContent='Older \u2192';nextBtn.disabled=activeIdx>=posts.length-1;
  (function(i){nextBtn.addEventListener('click',safe(function(){S._postsDateIdx=i+1;render();}));})(activeIdx);
  navRow.appendChild(prevBtn);
  navRow.appendChild(SP({style:{fontSize:'13px',color:'#b0adc4',textAlign:'center'}},FD(currentPost.date)+(activeIdx===0?' \u00b7 Latest':'')));
  navRow.appendChild(nextBtn);
  w.appendChild(navRow);

  // Post card (placeholder until oEmbed approved)
  w.appendChild(buildPostCard(currentPost,activePage));

  // Archive
  if(posts.length>1){
    var archBtn=BTN({cls:'btn bo bsm',style:{width:'100%',marginTop:'12px',fontSize:'12px'}});
    archBtn.textContent='Browse Archive ('+posts.length+' posts)';
    var archWrap=D({style:{display:'none',marginTop:'8px'}});
    archBtn.addEventListener('click',function(){
      var open=archWrap.style.display==='none';
      archWrap.style.display=open?'block':'none';
      archBtn.textContent=open?'Hide Archive':'Browse Archive ('+posts.length+' posts)';
    });
    posts.forEach(function(post,i){
      var row=D({style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid rgba(232,98,74,.08)',cursor:'pointer'}});
      row.appendChild(SP({style:{fontSize:'13px',color:i===activeIdx?'#e8624a':'inherit'}},FD(post.date)+(post.title?' \u00b7 '+post.title:'')));
      row.appendChild(SP({style:{fontSize:'11px',color:'#b0adc4'}},'View \u2192'));
      (function(idx){row.addEventListener('click',safe(function(){S._postsDateIdx=idx;render();}));})(i);
      archWrap.appendChild(row);
    });
    w.appendChild(archBtn);
    w.appendChild(archWrap);
  }

  return w;
}

function buildPostCard(post,page){
  var card=D({cls:'card',style:{padding:'1.25rem'}});
  // Header with avatar and page name
  var hdr=D({style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}});
  var av=D({style:{width:'40px',height:'40px',borderRadius:'50%',flexShrink:'0',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'14px',fontWeight:'700',color:'#fff',overflow:'hidden'}});
  if(page.bgImage){
    av.style.backgroundImage='url('+page.bgImage+')';
    av.style.backgroundSize='cover';
    av.style.backgroundPosition='center';
  } else {
    av.style.background='#e8624a';
    av.textContent=(page.label||'').charAt(0).toUpperCase();
  }
  hdr.appendChild(av);
  var meta=D({});
  meta.appendChild(P({style:{fontWeight:'600',fontSize:'13px',marginBottom:'1px'}},page.label));
  meta.appendChild(P({cls:'cs',style:{fontSize:'11px'}},FD(post.date)));
  hdr.appendChild(meta);
  card.appendChild(hdr);
  if(post.title) card.appendChild(P({style:{fontWeight:'600',fontSize:'14px',marginBottom:'6px'}},post.title));
  if(post.note) card.appendChild(P({style:{fontSize:'13px',color:'#b0adc4',lineHeight:'1.6',marginBottom:'12px'}},post.note));
  // View on Facebook button
  var fbRow=D({style:{display:'flex',alignItems:'center',gap:'8px',paddingTop:'10px',borderTop:'1px solid rgba(232,98,74,.1)'}});
  var fbLink=document.createElement('a');
  fbLink.href=post.url;fbLink.target='_blank';fbLink.rel='noopener';
  fbLink.textContent='View on Facebook';
  fbLink.style.cssText='display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:13px;font-weight:500;';
  fbRow.appendChild(fbLink);
  fbRow.appendChild(SP({style:{fontSize:'11px',color:'#5a5a7a',fontStyle:'italic'}},'Full post with likes and comments on Facebook'));
  card.appendChild(fbRow);
  return card;
}

function buildPostsAdminMode(w,pages){
  w.appendChild(P({style:{fontSize:'15px',fontWeight:'600',color:'#e8624a',marginBottom:'12px'}},'Posts \u2014 Build Mode'));

  pages.forEach(function(pg,pgIdx){
    var sec=D({cls:'card',style:{marginBottom:'1rem'}});
    sec.appendChild(P({style:{fontWeight:'600',fontSize:'14px',color:'#e8624a',marginBottom:'10px'}},pg.label));

    sec.appendChild(FLD('Background Image URL',INP({type:'url',value:pg.bgImage||'',placeholder:'https://...',input:function(e){pg.bgImage=e.target.value;}})));
    sec.appendChild(FLD('Description (shown below button)',INP({type:'text',value:pg.desc||'',placeholder:'What is this page about?',input:function(e){pg.desc=e.target.value;}})));
    sec.appendChild(FLD('Facebook Page URL',INP({type:'url',value:pg.fbUrl||'',placeholder:'https://facebook.com/yourpage',input:function(e){pg.fbUrl=e.target.value;}})));

    var saveBtn=BTN({cls:'btn bg bsm',style:{marginBottom:'12px'}});
    saveBtn.textContent='Save Page Settings';
    (function(p){saveBtn.addEventListener('click',safe(function(){save();showToast('Saved!','success');}));})(pg);
    sec.appendChild(saveBtn);

    // Posts list
    var posts=(pg.posts||[]).slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
    sec.appendChild(P({style:{fontSize:'12px',fontWeight:'600',color:'#b0adc4',marginBottom:'6px',textTransform:'uppercase',letterSpacing:'.05em'}},'Posts ('+posts.length+')'));

    var postList=D({});
    function rebuildPostList(){
      postList.innerHTML='';
      var sorted=(pg.posts||[]).slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
      sorted.forEach(function(post,i){
        var row=D({style:{display:'flex',alignItems:'center',gap:'8px',padding:'6px 0',borderBottom:'1px solid rgba(232,98,74,.08)'}});
        row.appendChild(SP({style:{fontSize:'12px',color:'#b0adc4',flexShrink:'0',minWidth:'80px'}},FD(post.date)));
        row.appendChild(SP({style:{fontSize:'12px',flex:'1',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},post.title||post.url));
        (function(p){row.appendChild(BTN({cls:'btn br bsm',click:safe(function(){
          pg.posts=(pg.posts||[]).filter(function(x){return x.id!==p.id;});
          save();rebuildPostList();
        })},'x'));})(post);
        postList.appendChild(row);
      });
      if(!posts.length) postList.appendChild(P({cls:'cs',style:{fontSize:'12px'}},'No posts yet.'));
    }
    rebuildPostList();
    sec.appendChild(postList);

    // Add post form
    var addWrap=D({style:{marginTop:'10px',background:'rgba(255,255,255,.03)',borderRadius:'8px',padding:'10px'}});
    addWrap.appendChild(P({style:{fontSize:'12px',fontWeight:'600',marginBottom:'8px'}},'Add Post'));
    var newPost={date:TODAY(),url:'',title:''};
    addWrap.appendChild(FLD('Date',INP({type:'date',value:newPost.date,input:function(e){newPost.date=e.target.value;}})));
    addWrap.appendChild(FLD('Facebook Post URL *',INP({type:'url',value:'',placeholder:'https://facebook.com/...',input:function(e){newPost.url=e.target.value;}})));
    addWrap.appendChild(FLD('Title (optional)',INP({type:'text',value:'',placeholder:'Brief description',input:function(e){newPost.title=e.target.value;}})));
    addWrap.appendChild(FLD('Note (optional)',INP({type:'text',value:'',placeholder:'Extra context shown in card',input:function(e){newPost.note=e.target.value;}})));
    (function(p,aw,rbl){
      aw.appendChild(BTN({cls:'btn bg bsm',click:safe(function(){
        if(!p.url.trim()){showToast('Post URL required.','error');return;}
        if(!pg.posts) pg.posts=[];
        pg.posts.push({id:Date.now(),date:p.date,url:p.url.trim(),title:p.title.trim(),note:p.note||'',ts:Date.now()});
        p.date=TODAY();p.url='';p.title='';p.note='';
        save();rbl();showToast('Post added!','success');
      })},'Add Post'));
    })(newPost,addWrap,rebuildPostList);
    sec.appendChild(addWrap);
    w.appendChild(sec);
  });

  return w;
}


function notifyNearbyUsers(ev){
    // Remove when navigating away
    var _removeBg=function(){document.body.removeChild(bgWrap);};
    var _origNavTo=navTo;
    w.addEventListener('DOMNodeRemovedFromDocument',_removeBg,{once:true});
    // Fallback: use MutationObserver to clean up when w is removed
    (function(){
      var obs=new MutationObserver(function(){if(!document.body.contains(w)){_removeBg();obs.disconnect();}});
      obs.observe(document.body,{childList:true,subtree:true});
    })();
  }

  if(!viewBlks.length){
    if(isAdm){
      w.appendChild(D({cls:'empty'},'Click Build Mode to start building this page.'));
    } else {
      w.appendChild(D({cls:'empty'},pageTitle+' page coming soon.'));
    }
    return w;
  }
  viewBlks.forEach(function(block){w.appendChild(renderBlock(block));});
  return w;
}


function buildBlockEditor(block,onSave){
  var c=D({});
  var d=block.data||{};
  function inp(label,key,ph,type){
    var el=INP({type:type||'text',value:d[key]||'',placeholder:ph||'',input:function(e){d[key]=e.target.value;block.data=d;onSave();}});
    c.appendChild(FLD(label,el));
  }
  function ta(label,key,rows){
    var el=TA({value:d[key]||'',rows:rows||3,input:function(e){d[key]=e.target.value;block.data=d;onSave();}});
    c.appendChild(FLD(label,el));
  }
  if(block.type==='hero'){
    inp('Heading','heading','Welcome to...');
    inp('Subheading','subheading','Tagline or subtitle');
    inp('Background Image URL','bgImage','https://...');
    var parallaxRow=D({cls:'toggle-row'});
    var pChk=INP({type:'checkbox',checked:!!d.parallax,change:function(e){d.parallax=e.target.checked;block.data=d;onSave();}});
    parallaxRow.appendChild(pChk);parallaxRow.appendChild(SP({},'Parallax scroll effect'));
    c.appendChild(parallaxRow);
    inp('Overlay Color (rgba)','overlayColor','rgba(0,0,0,0.4)');
    inp('Text Color','textColor','#ffffff');
  } else if(block.type==='text'){
    inp('Heading (optional)','heading','');
    ta('Content','content',5);
  } else if(block.type==='image'){
    inp('Image URL','src','https://...');
    inp('Caption (optional)','caption','');
    var alignSel=SEL({change:function(e){d.align=e.target.value;block.data=d;onSave();}},
      ['center','left','right'].map(function(a){return OPT({value:a,selected:(d.align||'center')===a},a.charAt(0).toUpperCase()+a.slice(1));}));
    c.appendChild(FLD('Alignment',alignSel));
  } else if(block.type==='twocol'){
    inp('Left Heading','leftHead','');
    ta('Left Content','leftContent',3);
    inp('Right Image URL','rightImage','https://... (or leave blank)');
    ta('Right Content','rightContent',3);
  } else if(block.type==='timeline'){
    if(!d.entries) d.entries=[];
    var entryList=D({});
    function rebuildEntries(){
      entryList.innerHTML='';
      (d.entries||[]).forEach(function(entry,ei){
        var row=D({style:{background:'rgba(255,255,255,.03)',borderRadius:'8px',padding:'8px',marginBottom:'6px'}});
        row.appendChild(FLD('Year/Label',INP({type:'text',value:entry.year||'',input:function(e){entry.year=e.target.value;block.data=d;onSave();}})));
        row.appendChild(FLD('Title',INP({type:'text',value:entry.title||'',input:function(e){entry.title=e.target.value;block.data=d;onSave();}})));
        row.appendChild(FLD('Description',TA({value:entry.desc||'',rows:2,input:function(e){entry.desc=e.target.value;block.data=d;onSave();}})));
        (function(i){row.appendChild(BTN({cls:'btn br bsm',click:safe(function(){d.entries.splice(i,1);block.data=d;onSave();rebuildEntries();})},'-Remove'));})(ei);
        entryList.appendChild(row);
      });
    }
    rebuildEntries();
    c.appendChild(entryList);
    c.appendChild(BTN({cls:'btn bg bsm',style:{marginTop:'4px'},click:safe(function(){if(!d.entries)d.entries=[];d.entries.push({year:'',title:'',desc:''});block.data=d;onSave();rebuildEntries();})},'+ Add Entry'));
  } else if(block.type==='button'){
    inp('Button Text','label','Click here');
    inp('URL','url','https://...');
    var btnAlignSel=SEL({change:function(e){d.align=e.target.value;block.data=d;onSave();}},
      ['center','left','right'].map(function(a){return OPT({value:a,selected:(d.align||'center')===a},a.charAt(0).toUpperCase()+a.slice(1));}));
    c.appendChild(FLD('Alignment',btnAlignSel));
  } else if(block.type==='meeting'){
    inp('Heading (optional)','heading','e.g. Meet with Our Team');
    ta('Intro Text (optional)','intro',2);
  }
  var d=block.data||{};
  if(block.type==='hero'){
    var section=document.createElement('section');
    section.style.cssText='position:relative;min-height:320px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 -1rem 1.5rem;padding:3rem 1.5rem;text-align:center;';
    if(d.bgImage){
      section.style.backgroundImage='url('+d.bgImage+')';
      section.style.backgroundSize='cover';
      section.style.backgroundPosition='center';
      if(d.parallax) section.style.backgroundAttachment='fixed';
      var overlay=D({style:{position:'absolute',inset:'0',background:d.overlayColor||'rgba(0,0,0,.4)'}});
      section.appendChild(overlay);
    }
    var inner=D({style:{position:'relative',zIndex:'1',maxWidth:'700px',width:'100%',margin:'0 auto'}});
    if(d.heading) inner.appendChild(P({style:{fontSize:'28px',fontWeight:'700',color:d.textColor||'#fff',marginBottom:'8px',lineHeight:'1.2'}},d.heading));
    if(d.subheading) inner.appendChild(P({style:{fontSize:'16px',color:d.textColor||'rgba(255,255,255,.85)',lineHeight:'1.5'}},d.subheading));
    section.appendChild(inner);
    return section;
  } else if(block.type==='text'){
    var tc=D({style:{marginBottom:'1.5rem'}});
    if(d.heading) tc.appendChild(P({style:{fontSize:'20px',fontWeight:'700',color:'#e8624a',marginBottom:'8px'}},d.heading));
    if(d.content){
      d.content.split('\n').forEach(function(line){tc.appendChild(P({style:{fontSize:'14px',lineHeight:'1.7',marginBottom:'6px'}},line));});
    }
    return tc;
  } else if(block.type==='image'){
    var ic=D({style:{marginBottom:'1.5rem',textAlign:d.align||'center'}});
    if(d.src){var img=document.createElement('img');img.src=d.src;img.style.cssText='max-width:100%;border-radius:10px;';ic.appendChild(img);}
    if(d.caption) ic.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginTop:'6px',fontStyle:'italic'}},d.caption));
    return ic;
  } else if(block.type==='twocol'){
    var tcol=D({style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:'24px',marginBottom:'1.5rem'}});
    var left=D({});
    if(d.leftHead) left.appendChild(P({style:{fontSize:'18px',fontWeight:'700',color:'#e8624a',marginBottom:'8px'}},d.leftHead));
    if(d.leftContent) d.leftContent.split('\n').forEach(function(l){left.appendChild(P({style:{fontSize:'14px',lineHeight:'1.7',marginBottom:'4px'}},l));});
    tcol.appendChild(left);
    var right=D({});
    if(d.rightImage){var ri=document.createElement('img');ri.src=d.rightImage;ri.style.cssText='width:100%;border-radius:10px;';right.appendChild(ri);}
    if(d.rightContent) d.rightContent.split('\n').forEach(function(l){right.appendChild(P({style:{fontSize:'14px',lineHeight:'1.7',marginBottom:'4px'}},l));});
    tcol.appendChild(right);
    return tcol;
  } else if(block.type==='timeline'){
    var tlWrap=D({style:{marginBottom:'1.5rem'}});
    (d.entries||[]).forEach(function(entry,ei){
      var row=D({style:{display:'flex',gap:'16px',marginBottom:'24px',alignItems:'flex-start'}});
      var leftTl=D({style:{flexShrink:'0',textAlign:'center',minWidth:'60px'}});
      leftTl.appendChild(SP({style:{fontSize:'13px',fontWeight:'700',color:'#e8624a',display:'block'}},entry.year||''));
      var dot=D({style:{width:'12px',height:'12px',borderRadius:'50%',background:'#e8624a',margin:'6px auto 0'}});
      leftTl.appendChild(dot);
      row.appendChild(leftTl);
      var rightTl=D({style:{flex:'1',paddingTop:'2px',borderLeft:'2px solid rgba(232,98,74,.2)',paddingLeft:'16px'}});
      if(entry.title) rightTl.appendChild(P({style:{fontWeight:'600',fontSize:'14px',marginBottom:'4px'}},entry.title));
      if(entry.desc) rightTl.appendChild(P({style:{fontSize:'13px',color:'#b0adc4',lineHeight:'1.6'}},entry.desc));
      row.appendChild(rightTl);
      tlWrap.appendChild(row);
    });
    return tlWrap;
  } else if(block.type==='button'){
    var bw=D({style:{marginBottom:'1.5rem',textAlign:d.align||'center'}});
    if(d.url&&d.label){
      var a=document.createElement('a');
      a.href=d.url;a.target='_blank';a.rel='noopener';a.textContent=d.label;
      a.style.cssText='display:inline-block;padding:10px 24px;background:#e8624a;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px;';
      bw.appendChild(a);
    }
    return bw;
  } else if(block.type==='meeting'){
    return renderMeetingBlock(block.data||{});
  } else if(block.type==='divider'){
    var dv=document.createElement('hr');
    dv.style.cssText='border:none;border-top:1px solid rgba(232,98,74,.2);margin:1.5rem 0;';
    return dv;
  }
  return D({});
}

function haversine(lat1,lon1,lat2,lon2){
  var R=3958.8; // miles
  var dLat=(lat2-lat1)*Math.PI/180;
  var dLon=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function geocodeCity(city,state,callback){
  if(!city) return callback(null,null,'No city');
  var q=encodeURIComponent(city+(state?', '+state+', USA':', USA'));
  fetch('https://nominatim.openstreetmap.org/search?q='+q+'&format=json&limit=1',{
    headers:{'User-Agent':'TheWellIowaMissionPortal/1.0'}
  })
  .then(function(r){return r.json();})
  .then(function(data){
    if(data&&data.length>0){
      callback(parseFloat(data[0].lat),parseFloat(data[0].lon),null);
    } else {
      callback(null,null,'Not found');
    }
  })
  .catch(function(e){callback(null,null,e.message);});
}

function buildSectionHealth(tmpl,evTasks){
  var td=TODAY();
  return TASK_SECTIONS.map(function(sec){
    var tpl=S.taskTemplates.find(function(tt){return String(tt.id)===String(tmpl.taskTemplateId);});
    if(!tpl) return null;
    var secTasks=evTasks.filter(function(t){return (tpl.items||[]).some(function(i){return i.title===t.title&&i.section===sec.id;});});
    if(!secTasks.length) return null;
    var total=secTasks.length,done=secTasks.filter(function(t){return t.status==='done';}).length;
    var overdue=secTasks.filter(function(t){return isOverdue(t);}).length;
    var behind=secTasks.filter(function(t){return t.status==='behind';}).length;
    var exp=secTasks.filter(function(t){return t.dueDate&&t.dueDate<td;}).length;
    var expPct=total?Math.round(exp/total*100):0;
    var actPct=total?Math.round(done/total*100):0;
    return {sec:sec,total:total,done:done,overdue:overdue,behind:behind,expectedPct:expPct,actualPct:actPct,isLagging:actPct<expPct||overdue>0,tasks:secTasks};
  }).filter(Boolean);
}

function renderMiniHealthBars(container,tmpl,evTasks,td){
  var sh=buildSectionHealth(tmpl,evTasks);
  sh.forEach(function(s){
    var row=D({style:{marginBottom:'5px'}});
    var lrow=D({style:{display:'flex',justifyContent:'space-between',marginBottom:'2px'}});
    lrow.appendChild(SP({style:{fontSize:'10px',color:s.sec.color,fontWeight:'600'}},s.sec.label));
    lrow.appendChild(SP({style:{fontSize:'10px',color:'#b0adc4'}},s.done+'/'+s.total));
    row.appendChild(lrow);
    var track=D({style:{height:'6px',background:'rgba(255,255,255,.08)',borderRadius:'3px',position:'relative'}});
    if(s.expectedPct>0&&s.expectedPct<100){
      var mk=D({style:{position:'absolute',left:s.expectedPct+'%',top:'-2px',width:'2px',height:'10px',background:'rgba(255,255,255,.25)',borderRadius:'1px',zIndex:'1'}});
      track.appendChild(mk);
    }
    track.appendChild(D({style:{height:'100%',width:s.actualPct+'%',background:s.isLagging?'#e74c3c':s.sec.color,borderRadius:'3px',minWidth:s.actualPct>0?'3px':'0'}}));
    row.appendChild(track);
    container.appendChild(row);
  });
}

    card.appendChild(P({style:{fontSize:'22px',color:'#e8624a',textAlign:'center',letterSpacing:'2px',fontWeight:'600',marginBottom:'.2rem'}},'THE WELL OF IOWA'));
    card.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',textAlign:'center',letterSpacing:'2px',marginBottom:'1.5rem'}},'MISSION TEAM PORTAL'));
    card.appendChild(FLD('Email',ei));
    card.appendChild(FLD('Password',pi));
    card.appendChild(err);
    card.appendChild(loading);
    card.appendChild(BTN({cls:'btn bg bfw',style:{marginTop:'.5rem'},click:doLogin},'Sign In'));
    card.appendChild(BTN({cls:'btn bo bfw',style:{marginTop:'.5rem'},click:function(){showForgot();}},'Forgot Password'));
    card.appendChild(BTN({cls:'btn bo bfw',style:{marginTop:'.25rem',fontSize:'12px'},click:function(){showSignUp();}},'Create a Public Account'));
  }

  function showForgot(){
    card.innerHTML='';
    var fe='';
    var err=P({cls:'err',style:{textAlign:'center'}});
    var ok=P({cls:'ok',style:{textAlign:'center',display:'none'}},'Password reset email sent! Check your inbox.');
    card.appendChild(P({style:{fontSize:'18px',color:'#e8624a',marginBottom:'1rem',textAlign:'center',fontWeight:'600'}},'Reset Password'));
    card.appendChild(P({style:{fontSize:'13px',color:'#b0adc4',marginBottom:'1rem',textAlign:'center'}},'Enter your email and we\'ll send a reset link.'));
    card.appendChild(FLD('Email Address',INP({type:'email',placeholder:'your@email.com',input:function(e){fe=e.target.value.trim();}})));
    card.appendChild(err);
    card.appendChild(ok);
    card.appendChild(BTN({cls:'btn bg bfw',click:function(){
      if(!fe){err.textContent='Please enter your email.';return;}
      auth.sendPasswordResetEmail(fe,{url:window.location.origin+window.location.pathname})
        .then(function(){err.textContent='';ok.style.display='block';})
        .catch(function(e){
          if(e.code==='auth/user-not-found') err.textContent='No account found with that email.';
          else if(e.code==='auth/invalid-email') err.textContent='Invalid email address.';
          else err.textContent='Error: '+e.message;
        });
    }},'Send Reset Email'));
    card.appendChild(BTN({cls:'btn bo bfw',style:{marginTop:'.5rem'},click:function(){showLogin();}},'Back to Login'));
  }

  function showSignUp(){
    card.innerHTML='';
    var fd={fname:'',lname:'',email:'',pw:'',pw2:''};
    var err=P({cls:'err',style:{textAlign:'center'}});
    var loading=P({style:{textAlign:'center',color:'#b0adc4',fontSize:'13px',display:'none'}},'Creating account...');
    card.appendChild(P({style:{fontSize:'18px',color:'#e8624a',marginBottom:'.25rem',textAlign:'center',fontWeight:'600'}},'Create Account'));
    card.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'1.2rem',textAlign:'center'}},'Join The Well of Iowa community'));
    card.appendChild(FLD('First Name',INP({type:'text',placeholder:'First name',input:function(e){fd.fname=e.target.value.trim();}})));
    card.appendChild(FLD('Last Name',INP({type:'text',placeholder:'Last name',input:function(e){fd.lname=e.target.value.trim();}})));
    card.appendChild(FLD('Email',INP({type:'email',placeholder:'your@email.com',input:function(e){fd.email=e.target.value.trim();}})));
    card.appendChild(FLD('Password',INP({type:'password',placeholder:'Min 6 characters',input:function(e){fd.pw=e.target.value;}})));
    card.appendChild(FLD('Confirm Password',INP({type:'password',placeholder:'Re-enter password',input:function(e){fd.pw2=e.target.value;}})));
    card.appendChild(err);
    card.appendChild(loading);
    card.appendChild(BTN({cls:'btn bg bfw',style:{marginTop:'.5rem'},click:function(){
      if(!fd.fname||!fd.lname){err.textContent='Please enter your first and last name.';return;}
      if(!fd.email){err.textContent='Please enter your email address.';return;}
      if(fd.pw.length<6){err.textContent='Password must be at least 6 characters.';return;}
      if(fd.pw!==fd.pw2){err.textContent='Passwords do not match.';return;}
      err.textContent=''; loading.style.display='block';
      auth.createUserWithEmailAndPassword(fd.email,fd.pw)
        .then(function(cred){
          return cred.user.updateProfile({displayName:fd.fname+' '+fd.lname})
            .then(function(){return cred.user.sendEmailVerification();})
            .then(function(){loading.style.display='none';showVerifyPending(fd.fname);});
        })
        .catch(function(e){
          loading.style.display='none';
          if(e.code==='auth/email-already-in-use') err.textContent='An account with this email already exists.';
          else if(e.code==='auth/invalid-email') err.textContent='Invalid email address.';
          else if(e.code==='auth/weak-password') err.textContent='Password is too weak.';
          else err.textContent='Error: '+e.message;
        });
    }},'Create Account'));
    card.appendChild(BTN({cls:'btn bo bfw',style:{marginTop:'.5rem'},click:function(){showLogin();}},'Back to Sign In'));
  }

  function showVerifyPending(fname){
    card.innerHTML='';
    card.appendChild(P({style:{fontSize:'18px',color:'#e8624a',marginBottom:'.5rem',textAlign:'center',fontWeight:'600'}},'Check Your Email'));
    card.appendChild(P({style:{fontSize:'13px',color:'#b0adc4',marginBottom:'1.2rem',textAlign:'center',lineHeight:'1.6'}},'Hi '+fname+'! We sent a verification link to your email address. Click the link to activate your account, then sign in here.'));
    card.appendChild(BTN({cls:'btn bg bfw',click:function(){showLogin();}},'Back to Sign In'));
  }

  showLogin();
  return page;
}

function buildSideMenu(){
  var u=S.user;
  var menu=D({id:'side-menu'});
  var mhdr=D({cls:'menu-header'});
  mhdr.appendChild(D({style:{lineHeight:'1.2'}},[
    SP({style:{fontSize:'13px',color:'#e8624a',letterSpacing:'1px',fontWeight:'500',display:'block'}},'THE WELL OF IOWA'),
    SP({style:{fontSize:'10px',color:'#b0adc4',fontStyle:'italic'}},'Together for Jesus')
  ]));
  var closeBtn=BTN({cls:'btn bo bsm',click:function(){closeMenu();}},'\u00D7');
  mhdr.appendChild(closeBtn);
  menu.appendChild(mhdr);
  var subContainer=D({style:{position:'relative',flex:'1',overflow:'hidden',display:'flex',flexDirection:'column'}});
  var mainPanel=D({style:{flex:'1',overflowY:'auto',display:'flex',flexDirection:'column'}});

  function mBtn(lbl,tabId,badge){
    var active=S.tab===tabId;
    var btn=D({cls:'mitem'+(active?' on':'')});
    btn.appendChild(SP({},lbl));
    if(badge){var bdg=D({cls:'mitem-badge'});bdg.textContent=String(badge);btn.appendChild(bdg);}
    btn.addEventListener('click',function(){navTo(tabId);});
    return btn;
  }
  function mArrow(lbl,onOpen,badge){
    var btn=D({cls:'mitem'});
    btn.appendChild(SP({},lbl));
    var rr=D({style:{display:'flex',alignItems:'center',gap:'6px'}});
    if(badge){var bdg=D({cls:'mitem-badge'});bdg.textContent=String(badge);rr.appendChild(bdg);}
    rr.appendChild(SP({cls:'mitem-arrow'},'\u203A'));
    btn.appendChild(rr);
    btn.addEventListener('click',onOpen);
    return btn;
  }
  function mSection(items,label){
    if(!items.length) return null;
    var sec=D({cls:'menu-section'});
    if(label) sec.appendChild(D({cls:'menu-section-label'},label));
    items.forEach(function(item){sec.appendChild(item);});
    return sec;
  }

  // Public user nav (limited)
  if(isPublicUser(u)){
    var pubPrimary=[
      mBtn('Home','pubhome'),
      mBtn('Events','events'),
      mBtn('Music & Pods','music'),
      mBtn('Our Story','ourstory'),
      mBtn('Connect','connect'),
      mBtn('Giving','giving'),
      mBtn('Posts','posts',hasUnseenPost()?'\u2022':null)
    ];
    var pubSec=mSection(pubPrimary,null);if(pubSec) mainPanel.appendChild(pubSec);
  } else {
  // Primary

  if(isAdmin(u)) primary.push(mBtn('Dashboard','dashboard'));
  else primary.push(mBtn('Home','home'));
  var evBadge=null;try{evBadge=pendingAvailEvents().length>0?'!':null;}catch(e){}
  primary.push(mBtn('Events','events',evBadge));
  primary.push(mBtn('My Tasks','assignments'));
  if(canSeeSecurity(u)) primary.push(mBtn('Security','security',S.reports.filter(function(r){return !r.ack;}).length||null));
  var ps=mSection(primary,null);if(ps) mainPanel.appendChild(ps);
  // Communication
  var comm=[mBtn('Announcements','announce'),mBtn('Messages','messages')];
  var cs=mSection(comm,'Communication');if(cs) mainPanel.appendChild(cs);
  // Improve/Ops
  var issueCount=(S.issues||[]).filter(function(x){return x.status!=='closed';}).length;
  var ops=[mBtn('Operations','issues',issueCount||null)];
  var os=mSection(ops,'Improve');if(os) mainPanel.appendChild(os);
  // Role-based
  var roleItems=[];
  if(canSeeMerch(u)&&!isAdmin(u)) roleItems.push(mBtn('Inventory','inventory'));
  if(canSeeWorship(u)&&!isAdmin(u)) roleItems.push(mBtn('Worship','worship'));
  if(roleItems.length===1){var rs=D({cls:'menu-section'});rs.appendChild(roleItems[0]);mainPanel.appendChild(rs);}
  else if(roleItems.length>1){var rs2=mSection(roleItems,'My Roles');if(rs2) mainPanel.appendChild(rs2);}

  } // end else (non-public nav)

  // Admin sub-panel
  if(isAdmin(u)){
    var adminPanel=D({cls:'sub-panel'});
    var backBtn=document.createElement('button');
    backBtn.className='sub-back';backBtn.innerHTML='\u2190 Back';
    backBtn.addEventListener('click',function(){adminPanel.classList.remove('open');});
    adminPanel.appendChild(backBtn);
    var adminScroll=D({style:{overflowY:'auto',flex:'1',padding:'8px 0'}});
    adminScroll.appendChild(D({cls:'menu-section-label',style:{padding:'8px 16px 4px'}},'Admin Panel'));
    [['User Management','users'],['Groups','groups'],['Common Teams','teams'],['Task Templates','taskTpl'],['Leadership Team','leadership'],['Audit Trail','audit']].forEach(function(pair){
      var btn=D({cls:'mitem'});btn.appendChild(SP({},pair[0]));
      (function(sub){btn.addEventListener('click',function(){S.tab='admin';S._adminSubTab=sub;closeMenu();adminPanel.classList.remove('open');render();});})(pair[1]);
      adminScroll.appendChild(btn);
    });
    adminScroll.appendChild(D({cls:'menu-section-label',style:{padding:'10px 16px 4px'}},'Role Views'));
    [['Inventory','inventory'],['Worship','worship']].forEach(function(pair){
      var btn=D({cls:'mitem'});btn.appendChild(SP({},pair[0]));
      (function(tab){btn.addEventListener('click',function(){navTo(tab);adminPanel.classList.remove('open');});})(pair[1]);
      adminScroll.appendChild(btn);
    });
    adminPanel.appendChild(adminScroll);
    subContainer.appendChild(adminPanel);
    var adPend=S.pendingDel.length||null;
    var adminSec=mSection([mArrow('Admin Panel',function(){adminPanel.classList.add('open');},adPend)],'Admin');
    if(adminSec) mainPanel.appendChild(adminSec);
    var pubSec=mSection([mBtn('Music & Pods','music'),mBtn('Our Story','ourstory'),mBtn('Connect','connect'),mBtn('Giving','giving'),mBtn('Posts','posts',hasUnseenPost()?'\u2022':null)],'Public Facing');
    if(pubSec) mainPanel.appendChild(pubSec);
  }

  // Bottom
  mainPanel.appendChild(D({cls:'menu-spacer'}));
  var bot=D({cls:'menu-section',style:{marginTop:'auto'}});
  var pwBtn=D({cls:'mitem'});pwBtn.appendChild(SP({},'Change Password'));
  pwBtn.addEventListener('click',function(){S.modal='changePW';closeMenu();render();});
  bot.appendChild(pwBtn);
  var emBtn=D({cls:'mitem'});emBtn.appendChild(SP({},'Change Email'));
  emBtn.addEventListener('click',function(){S.modal='changeEmail';closeMenu();render();});
  bot.appendChild(emBtn);
  var soBtn=D({cls:'mitem'});soBtn.appendChild(SP({style:{color:'#e74c3c'}},'Sign Out'));
  soBtn.addEventListener('click',function(){if(unsubscribe)unsubscribe();auth.signOut().then(function(){S.user=null;USERS=[];render();});});
  bot.appendChild(soBtn);
  mainPanel.appendChild(bot);
  subContainer.appendChild(mainPanel);
  menu.appendChild(subContainer);
  return menu;
}


function navBar(){

    {id:'dashboard',label:'Dashboard',adminOnly:true},
    {id:'home',label:'Home',nonAdminOnly:true},

  return nav;

function calWidget(){
  var y=S.calY, m=S.calM;
  var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var wrap=D({cls:'cal-wrap'});
  var hdr=D({cls:'cal-month-hdr'});
  hdr.appendChild(BTN({cls:'btn bo bsm',click:safe(function(){var nm=m-1,ny=y;if(nm<0){nm=11;ny--;}S.calM=nm;S.calY=ny;render();})},'<-'));
  hdr.appendChild(D({style:{textAlign:'center'}},[
    SP({style:{color:'#e8624a',fontWeight:'500',fontSize:'16px',display:'block'}},MN[m]+' '+y)
  ]));
  hdr.appendChild(BTN({cls:'btn bo bsm',click:safe(function(){var nm=m+1,ny=y;if(nm>11){nm=0;ny++;}S.calM=nm;S.calY=ny;render();})},'->'));
  wrap.appendChild(hdr);
  var grid=D({cls:'cal-grid'});
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function(n){grid.appendChild(D({cls:'cdn'},n));});
  var first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), now=new Date();
  var fromDs=y+'-'+pad2(m+1)+'-01';
  var toDs=y+'-'+pad2(m+1)+'-'+pad2(days);
  var insts=allInstances(fromDs,toDs);
  // leading empty cells
  for(var i=0;i<first;i++){
    var em=D({cls:'cd om'});
    // show prev month day numbers faintly
    var prevDays=new Date(y,m,0).getDate();
    em.appendChild(SP({cls:'cnum'},prevDays-first+1+i));
    grid.appendChild(em);
  }
  for(var day=1;day<=days;day++){
    var ds=y+'-'+pad2(m+1)+'-'+pad2(day);
    var isT=now.getFullYear()===y&&now.getMonth()===m&&now.getDate()===day;
    var de=D({cls:'cd'+(isT?' tod':'')});
    de.appendChild(SP({cls:'cnum'},day));
    var dayEvs=insts.filter(function(e){return e.date===ds;});
    dayEvs.forEach(function(ev){
      var myCalId=String(S.user.id||S.user.uid||'');
      if(isAdmin(S.user)||(ev.users||[]).some(function(x){return sameAvailId(x,myCalId);})){
        var isOv=ev.instanceKey&&!!S.overrides[ev.instanceKey];
        var ee=D({cls:'cev'+(isOv?' mod':'')+(ev.isVirtual?' virtual':'')},ev.title+(ev.isRec?' (r)':''));
        (function(ev2){ee.addEventListener('click',function(e){e.stopPropagation();S.availFocusKey=ev2.instanceKey||(ev2.id+'_'+ev2.date);S.modal={type:'detail',ev:ev2};render();});})(ev);
        de.appendChild(ee);
      }
    });
    grid.appendChild(de);
    // Admin: click empty area of day cell to create event on that date
    if(isAdmin(S.user)){
      (function(dateStr){de.addEventListener('click',function(){
        S.modal={type:'createEvent', prefillDate:dateStr}; render();
      });})(ds);
    }
  } // end for day loop
  var total=first+days;
  var trailing=(7-total%7)%7;
  for(var tr=1;tr<=trailing;tr++){
    var tc=D({cls:'cd om'});
    tc.appendChild(SP({cls:'cnum'},tr));
    grid.appendChild(tc);
  }
  wrap.appendChild(grid);
  if(isAdmin(S.user)) wrap.appendChild(P({cls:'hint',style:{padding:'6px 12px',fontSize:'11px'}},'Gold = standard instance  .  Dark = modified instance'));
  return wrap;
}

function evList(){
  var td=TODAY(), to=new Date(); to.setDate(to.getDate()+30);
  var toDs=to.toISOString().split('T')[0];
  var myListId=String(S.user.id||S.user.uid||''); var insts=allInstances(td,toDs).filter(function(e){return isAdmin(S.user)||(e.users||[]).some(function(x){return sameAvailId(x,myListId);});});

// -- ASSIGNMENTS VIEW -------------------------------------------------------
function assignView(){
  var u=S.user, w=D({});
  var td=TODAY();
  // Auto-clear tasks linked to events whose date has passed
  var beforeLen=S.tasks.length;
  S.tasks=S.tasks.filter(function(t){
    if(!t.evTemplateId) return true; // keep free tasks
    var evDate=t.evDate||null;
    if(!evDate) return true; // no date, keep
    return evDate>=td; // keep if event hasn't passed yet
  });
  if(S.tasks.length!==beforeLen) save();
  // Check for overdue tasks and send notifications
  S.tasks.forEach(function(t){
    if(isOverdue(t)&&!t.overdueNotified){
      taskAssignees(t).forEach(function(uid){addNotif(uid,'Overdue task: "'+t.title+'" was due '+FD(t.dueDate));});
      if(t.by) addNotif(t.by,'Overdue: "'+t.title+'" assigned to '+taskAssignees(t).map(UN).join(', '));
      t.overdueNotified=true;
    }
  });
  w.appendChild(D({cls:'rh'},[
    P({cls:'sec-t'},'My Tasks'),
    canAssignTasks(S.user)?BTN({cls:'btn bg bsm',click:function(){S.modal='addTask';render();}},'+ Add Task'):D({})
  ]));

  // Sort helper
  function sortTasks(arr){
    return arr.slice().sort(function(a,b){
      // Featured first (overdue and behind)
      var aFeat=isOverdue(a)||(a.status==='behind');
      var bFeat=isOverdue(b)||(b.status==='behind');
      if(aFeat&&!bFeat) return -1; if(!aFeat&&bFeat) return 1;
      // Then event date closest to today
      var aEv=a.evDate||'9999', bEv=b.evDate||'9999';
      if(aEv!==bEv) return aEv.localeCompare(bEv);
      // Then task due date
      var aD=a.dueDate||'9999', bD=b.dueDate||'9999';
      return aD.localeCompare(bD);
    });
  }

  if(!isAdmin(u)){
    // Non-admin: just show their tasks
    w.appendChild(myTasksPanel(u, sortTasks));
    return w;
  }

  // Admin: tabs for My Tasks / All Tasks / Event Health
  if(!S.assignTab) S.assignTab='mine';
  var st=D({cls:'stabs'}), ct=D({});
  [{id:'mine',label:'My Tasks'},{id:'all',label:'All Tasks'},{id:'health',label:'Event Health'}].forEach(function(tab){
    var b=BTN({cls:'stab'+(S.assignTab===tab.id?' on':'')}, tab.label);
    b.setAttribute('data-id', tab.id);
    b.addEventListener('click', function(){ S.assignTab=tab.id; render(); });
    st.appendChild(b);
  });
  w.appendChild(st); w.appendChild(ct);
  if(S.assignTab==='mine'){
    ct.appendChild(myTasksPanel(u, sortTasks));
  } else if(S.assignTab==='health'){
    ct.appendChild(eventHealthView());
  } else {
    ct.appendChild(allTasksPanel(u, sortTasks));
  }
  return w;
}

function buildTaskSearch(onSearch){
  var inp=document.createElement('input');
  inp.type='text'; inp.placeholder='Search tasks by title, event, or location...';
  inp.className='task-search';
  inp.addEventListener('input',function(){onSearch(inp.value.toLowerCase().trim());});
  return inp;
}

function taskMatchesSearch(t,q){
  if(!q) return true;
  if((t.title||'').toLowerCase().includes(q)) return true;
  if(t.evTemplateId){
    var ev=S.templates.find(function(e){return String(e.id)===String(t.evTemplateId);});
    if(ev&&(ev.title||'').toLowerCase().includes(q)) return true;
    if(ev&&(ev.location||'').toLowerCase().includes(q)) return true;
  }
  return false;
}

function overdueSection(tasks,isAdmin){
  var overdueTasks=tasks.filter(function(t){return isOverdue(t);});
  var behindTasks=tasks.filter(function(t){return !isOverdue(t)&&t.status==='behind';});
  if(!overdueTasks.length&&!behindTasks.length) return null;
  var box=D({cls:'overdue-banner'});
  function renderGrouped(taskList,titleEl){
    box.appendChild(titleEl);
    var groups={}, plain=[];
    taskList.forEach(function(t){
      if(t.kaizenId){ var kk='k_'+String(t.kaizenId); if(!groups[kk])groups[kk]=[]; groups[kk].push(t); }
      else if(t.issueId){ var ik='i_'+String(t.issueId); if(!groups[ik])groups[ik]=[]; groups[ik].push(t); }
      else if(t.evTemplateId){ var ek=String(t.evTemplateId); if(!groups[ek])groups[ek]=[]; groups[ek].push(t); }
      else { plain.push(t); }
    });
    plain.forEach(function(t){try{var tc=taskCard(t,isAdmin);if(tc instanceof Node)box.appendChild(tc);}catch(e){console.warn(e);}});
    Object.keys(groups).forEach(function(gid){
      var isKz=gid.slice(0,2)==='k_', isIss=gid.slice(0,2)==='i_';
      var rawId=(isKz||isIss)?gid.slice(2):gid;
      var evTmpl=(!isKz&&!isIss)?S.templates.find(function(e){return String(e.id)===gid;}):null;
      var kzItem=isKz?(S.kaizen||[]).find(function(k){return String(k.id)===rawId;}):null;
      var issItem=isIss?(S.issues||[]).find(function(x){return String(x.id)===rawId;}):null;
      var grpTitle=isKz?('Kaizen: '+(kzItem?kzItem.title:'Improvement')):isIss?('Issue CA: '+(issItem?issItem.title:'Issue')):evTmpl?evTmpl.title:'Event';
      var grpSub=(!isKz&&!isIss&&evTmpl)?(evTmpl.location+(evTmpl.date?' \u00B7 '+FD(evTmpl.date):'')):'';
      var borderColor=isKz?'rgba(41,128,185,.4)':isIss?'rgba(192,57,43,.4)':'rgba(232,98,74,.4)';
      var titleColor=isKz?'#3498db':isIss?'#e74c3c':'#e8624a';
      var grpBox=D({cls:'card',style:{borderColor:borderColor,marginBottom:'.5rem'}});
      grpBox.appendChild(P({style:{fontWeight:'600',fontSize:'13px',color:titleColor,marginBottom:'2px'}},grpTitle));
      if(grpSub) grpBox.appendChild(P({cls:'cs',style:{marginBottom:'6px'}},grpSub));
      groups[gid].forEach(function(t){try{var tc=taskCard(t,isAdmin);if(tc instanceof Node)grpBox.appendChild(tc);}catch(e){console.warn(e);}});
      box.appendChild(grpBox);
    });
  }
  if(overdueTasks.length){
    var t1=D({cls:'overdue-banner-title'});
    t1.textContent='\u26A0 '+overdueTasks.length+' Overdue Task'+(overdueTasks.length===1?'':'s');
    renderGrouped(overdueTasks,t1);
  }
  if(behindTasks.length){
    var t2=D({cls:'overdue-banner-title'});
    t2.style.color='#e67e22';
    t2.style.marginTop=overdueTasks.length?'10px':'0';
    t2.textContent='\u23F0 '+behindTasks.length+' Running Behind';
    renderGrouped(behindTasks,t2);
  }
  return box;
}

function renderTaskGroups(tasks,isAdmin,w,q){
  var filtered=tasks.filter(function(t){return !isOverdue(t)&&t.status!=='behind'&&taskMatchesSearch(t,q);});
  var evTaskGroups={}, plainTasks=[];
  filtered.forEach(function(t){
    if(t.kaizenId){ var kk='k_'+String(t.kaizenId); if(!evTaskGroups[kk])evTaskGroups[kk]=[]; evTaskGroups[kk].push(t); }
    else if(t.issueId){ var ik='i_'+String(t.issueId); if(!evTaskGroups[ik])evTaskGroups[ik]=[]; evTaskGroups[ik].push(t); }
    else if(t.evTemplateId){var k=String(t.evTemplateId);if(!evTaskGroups[k])evTaskGroups[k]=[];evTaskGroups[k].push(t);}
    else{plainTasks.push(t);}
  });
  if(plainTasks.length){
    w.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'.4rem'}},isAdmin&&tasks[0]&&tasks[0].evTemplateId===undefined?'Unlinked Tasks':'Tasks'));
    plainTasks.forEach(function(t){try{var tc=taskCard(t,isAdmin);if(tc instanceof Node)w.appendChild(tc);}catch(e){console.warn(e);}});
  }
  Object.keys(evTaskGroups).forEach(function(tid){
    var isKz=tid.slice(0,2)==='k_';
    var isIss=tid.slice(0,2)==='i_';
    var rawId=tid.slice(2);
    var evTmpl=(!isKz&&!isIss)?S.templates.find(function(e){return String(e.id)===tid;}):null;
    var kzItem=isKz?(S.kaizen||[]).find(function(k){return String(k.id)===rawId;}):null;
    var issItem=isIss?(S.issues||[]).find(function(x){return String(x.id)===rawId;}):null;
    var grpTitle=isKz?('\uD83C\uDF31 Kaizen: '+(kzItem?kzItem.title:'Improvement')):isIss?('\u26A0 Issue CA: '+(issItem?issItem.title:'Issue')):evTmpl?evTmpl.title:'Event';
    var grpSub=(!isKz&&!isIss&&evTmpl)?(evTmpl.location+(evTmpl.date?' \u00b7 '+FD(evTmpl.date):'')):'';
    var borderColor=isKz?'rgba(41,128,185,.4)':isIss?'rgba(192,57,43,.4)':'rgba(232,98,74,.4)';
    var titleColor=isKz?'#3498db':isIss?'#e74c3c':'#e8624a';
    if(q&&!taskMatchesSearch({title:grpTitle,evDate:null},q)&&!evTaskGroups[tid].some(function(t){return taskMatchesSearch(t,q);})) return;
    var grpBox=D({cls:'card',style:{borderColor:borderColor,marginBottom:'.75rem'}});
    grpBox.appendChild(P({style:{fontWeight:'600',fontSize:'14px',color:titleColor,marginBottom:'2px'}},grpTitle));
    if(grpSub) grpBox.appendChild(P({cls:'cs',style:{marginBottom:'10px'}},grpSub));
    evTaskGroups[tid].forEach(function(t){try{var tc=taskCard(t,isAdmin);if(tc instanceof Node)grpBox.appendChild(tc);}catch(e){console.warn(e);}});
    w.appendChild(grpBox);
  });
}

function allTasksPanel(u,sortTasks){

function renderAllGroups(allTasks,w,q){
  w.innerHTML='';
  var nonOverdue=allTasks.filter(function(t){return !isOverdue(t)&&t.status!=='behind';});
  // Event groups
  var evGroups={}, unlinked=[];
  nonOverdue.forEach(function(t){
    if(t.evTemplateId){var k=String(t.evTemplateId);if(!evGroups[k])evGroups[k]=[];evGroups[k].push(t);}
    else{unlinked.push(t);}
  });
  Object.keys(evGroups).forEach(function(tid){
    var evTmpl=S.templates.find(function(e){return String(e.id)===tid;});
    var evTitle=evTmpl?evTmpl.title:'Event';
    var evLoc=evTmpl?evTmpl.location:'';
    var evDate=evTmpl?FD(evTmpl.date):'';
    var filtered=evGroups[tid].filter(function(t){return taskMatchesSearch(t,q);});
    if(!filtered.length) return;
    var grpBox=D({cls:'card',style:{borderColor:'rgba(232,98,74,.4)',marginBottom:'.75rem'}});
    grpBox.appendChild(P({style:{fontWeight:'600',fontSize:'14px',color:'#e8624a',marginBottom:'2px'}},evTitle));
    grpBox.appendChild(P({cls:'cs',style:{marginBottom:'10px'}},evLoc+(evDate?' \u00B7 '+evDate:'')));
    filtered.forEach(function(t){try{var tc=taskCard(t,true);if(tc instanceof Node)grpBox.appendChild(tc);}catch(e){console.warn(e);}});
    w.appendChild(grpBox);
  });
  // Unlinked by person
  if(unlinked.length){
    var byPerson={};
    unlinked.filter(function(t){return taskMatchesSearch(t,q);}).forEach(function(t){
      var aid=String((taskAssignees(t)||[])[0]||'unknown');
      if(!byPerson[aid])byPerson[aid]=[];
      byPerson[aid].push(t);
    });
    Object.keys(byPerson).sort(function(a,b){return (UN(a)||'').localeCompare(UN(b)||'');}).forEach(function(aid){
      var personBox=D({cls:'card',style:{marginBottom:'.65rem'}});
      personBox.appendChild(P({style:{fontWeight:'600',fontSize:'13px',color:'#f0ece4',marginBottom:'8px'}},UN(aid)));
      byPerson[aid].forEach(function(t){try{var tc=taskCard(t,true);if(tc instanceof Node)personBox.appendChild(tc);}catch(e){console.warn(e);}});
      w.appendChild(personBox);
    });
  }
  if(!w.children.length) w.appendChild(D({cls:'empty'},'No tasks match your search.'));
}


function taskCard(t,isAdminView){
  var u=S.user, c=D({cls:'card'});
  if(!t||!t.title) return c;
  var over=isOverdue(t);
  if(over) c.style.borderColor='rgba(192,57,43,0.6)';
  var assigneeList=taskAssignees(t);
  var isLead=isTaskLead(t,u.id);
  var status=t.status||'pending';
  var titleRow=D({cls:'ch'},[
    D({style:{display:'flex',alignItems:'center',gap:'8px'}},(over?[SP({style:{background:'#c0392b',color:'#fff',fontSize:'10px',padding:'2px 7px',borderRadius:'10px',flexShrink:'0'}},'OVERDUE')]:[]). concat([SP({cls:'ct'},t.title)])),
    (function(s){
    var statusLabels={pending:'Not Started',in_progress:'In Progress',behind:'Running Behind',done:'Completed'};
    var statusColors={pending:'#b0adc4',in_progress:'#2980b9',behind:'#e67e22',done:'#27ae60'};
    var lbl=statusLabels[s]||s;
    var col=statusColors[s]||'#b0adc4';
    return D({},[SP({style:{width:'8px',height:'8px',borderRadius:'50%',background:col,display:'inline-block',marginRight:'4px',flexShrink:'0'}}),SP({style:{color:col,fontSize:'12px'}},lbl)]);
  })(status)
  ]);
  c.appendChild(titleRow);
  if(isAdminView||assigneeList.length>1){
    var assignedTo=D({style:{display:'flex',flexWrap:'wrap',gap:'3px',marginTop:'4px'}});
    assigneeList.forEach(function(id){
      var isL=(t.lead===id||assigneeList.length===1);
      assignedTo.appendChild(SP({cls:'tag '+(isL?'tagl':'tagp')},(isL?'\u2605 ':'')+UN(id)));
    });
    c.appendChild(assignedTo);
  }
  if(t.dueDate) c.appendChild(P({style:{fontSize:'12px',color:over?'#e74c3c':'#b0adc4',marginTop:'3px'}},'Due: '+FD(t.dueDate)));
  if(t.projectedDate) c.appendChild(P({style:{fontSize:'12px',color:'#e67e22',marginTop:'2px'}},'Projected: '+FD(t.projectedDate)));
  if(assigneeList.some(function(x){return sameId(x,u.id);})||isAdminView){
    var btns=D({style:{display:'flex',gap:'6px',marginTop:'8px',flexWrap:'wrap'}});
    var statuses=[
      {id:'pending',label:'Not Started',color:'#b0adc4'},
      {id:'in_progress',label:'In Progress',color:'#2980b9'},
      {id:'behind',label:'Running Behind',color:'#e67e22'},
      {id:'done',label:'Completed',color:'#27ae60'}
    ];
    statuses.forEach(function(st){
      var isCur=(t.status||'pending')===st.id;
      var b=BTN({cls:'btn bsm'},st.label);
      b.style.cssText='background:'+(isCur?st.color:'transparent')+';color:'+(isCur?'#fff':st.color)+';border:1px solid '+st.color+';font-size:11px;padding:4px 10px';
      (function(sid){b.addEventListener('click',safe(function(){
        if(sid==='done'){
          audit('Task Completed',t.title);
          // Notify the person who assigned the task
          if(t.by&&!sameId(t.by,S.user.id)){
            addNotif(t.by,S.user.name+' completed: "'+t.title+'"');
          }
          S.tasks=S.tasks.filter(function(x){return x.id!==t.id;});
          save();render();
        } else {
          t.status=sid; t.overdueNotified=false;
          if(sid!=='behind') t.projectedDate=null;
          audit('Task Status: '+sid,t.title);
          save();render();
        }
      }));})(st.id);
      btns.appendChild(b);
    });
    c.appendChild(btns);
    // Running Behind: projected completion date
    if((t.status||'pending')==='behind'){
      var projRow=D({style:{display:'flex',alignItems:'center',gap:'8px',marginTop:'6px'}});
      projRow.appendChild(SP({style:{fontSize:'12px',color:'#e67e22'}},'Projected completion:'));
      var projInp=INP({type:'date',value:t.projectedDate||''});
      projInp.style.cssText='font-size:12px;background:#fff;border:1px solid #e67e22;border-radius:5px;padding:3px 8px;color:#1a1a1a';
      (function(task){projInp.addEventListener('change',function(e){task.projectedDate=e.target.value||null;save();render();});})(t);
      projRow.appendChild(projInp);
      c.appendChild(projRow);
    }
  }
  if(isAdminView){
    var adminRow=D({style:{display:'flex',gap:'7px',marginTop:'8px',flexWrap:'wrap',alignItems:'center'}});
    adminRow.appendChild(BTN({cls:'btn br bsm',click:safe(function(){S.tasks=S.tasks.filter(function(x){return x.id!==t.id;});save();render();})},'Delete'));
    var ddLabel=SP({style:{fontSize:'12px',color:'#b0adc4',marginLeft:'4px'}},'Due:');
    var ddInp=INP({type:'date',value:t.dueDate||''});
    ddInp.style.cssText='font-size:12px;background:#fff;border:1px solid #ccc;border-radius:5px;padding:3px 6px;color:#1a1a1a;width:140px';
    (function(task){ddInp.addEventListener('change',function(e){task.dueDate=e.target.value||null;task.overdueNotified=false;save();render();});})(t);
    adminRow.append(ddLabel,ddInp);
    c.appendChild(adminRow);
  }
  return c;
}

            if(S.pendingDel.find(function(d){return d.userId===uu.id;})){alert('Deletion already pending.');return;}
            var allAdmins=USERS.filter(function(a){return isAdmin(a);});
            var others=allAdmins.filter(function(a){return !sameId(a.id,S.user.id);});
            if(others.length===0){ execDelete(uu.id); }
            else {
              S.pendingDel.push({userId:uu.id,requestedBy:S.user.id,approvals:[String(S.user.id)]});
              others.forEach(function(a){addNotif(a.id,'Approval needed: Delete admin account for '+uu.name+'.');});
            }
          } else {
            // Regular, security, merch users can be deleted immediately by admin
            execDelete(uu.id);
          }
          save();render();
        }},'Delete'));
      })(u);
      c.appendChild(btns);
    }
    w.appendChild(c);
  });
  return w;
}

function execDelete(uid){
  var suid=String(uid);
  USERS=USERS.filter(function(u){return !sameId(u.id,suid);});
  S.pendingDel=S.pendingDel.filter(function(d){return !sameId(d.userId,suid);});
  S.templates.forEach(function(t){
    t.users=(t.users||[]).filter(function(id){return !sameId(id,suid);});
    (t.teams||[]).forEach(function(tm){
      tm.members=tm.members.filter(function(id){return !sameId(id,suid);});
      tm.leaders=tm.leaders.filter(function(id){return !sameId(id,suid);});
    });
  });
  S.groups.forEach(function(g){g.members=g.members.filter(function(id){return id!==uid;});});
  S.rooms.forEach(function(r){r.members=r.members.filter(function(id){return id!==uid;});});
  saveUsers();
  save();
}

function reorderView(){
  var w=D({});
  if(!S.reorderItems) S.reorderItems=[];
  var items=S.reorderItems;
  var searchVal='';

  // -- Add new item row -------------------------------------------------------
  var addRow=D({style:{display:'flex',gap:'8px',marginBottom:'1rem',flexWrap:'wrap'}});
  var newName=INP({type:'text',placeholder:'Item name...'});
  var newLink=INP({type:'url',placeholder:'Reorder URL (https://...)'});
  newName.style.cssText='flex:1;min-width:140px;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
  newLink.style.cssText='flex:2;min-width:180px;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
  var addErr=SP({style:{fontSize:'12px',color:'#e74c3c',display:'none'}});
  var addBtn=BTN({cls:'btn bg bsm',click:function(){
    var name=newName.value.trim(), link=newLink.value.trim();
    if(!name){addErr.textContent='Item name required.';addErr.style.display='block';return;}
    if(!link){addErr.textContent='Reorder link required.';addErr.style.display='block';return;}
    if(!/^https?:\/\//i.test(link)){addErr.textContent='Link must start with http:// or https://';addErr.style.display='block';return;}
    // Duplicate check
    if(items.find(function(it){return it.name.toLowerCase()===name.toLowerCase();})){
      addErr.textContent='"'+name+'" already exists.';addErr.style.display='block';return;
    }
    addErr.style.display='none';
    items.push({id:Date.now(),name:name,link:link});
    newName.value=''; newLink.value='';
    audit('Reorder Item Added',name);
    save(); renderTable();
  }},'+  Add Item');
  addRow.append(newName,newLink,addBtn);
  w.appendChild(addRow);
  w.appendChild(addErr);

  // -- Search -----------------------------------------------------------------
  var searchInp=INP({type:'text',placeholder:'Search items...'});
  searchInp.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none;margin-bottom:1rem';
  searchInp.addEventListener('input',function(e){searchVal=e.target.value.toLowerCase();renderTable();});
  w.appendChild(searchInp);

  // -- Table ------------------------------------------------------------------
  var tableWrap=D({});
  w.appendChild(tableWrap);

  function renderTable(){
    tableWrap.innerHTML='';
    var filtered=items.filter(function(it){
      return !searchVal||it.name.toLowerCase().indexOf(searchVal)>=0||it.link.toLowerCase().indexOf(searchVal)>=0;
    });
    if(!filtered.length){
      tableWrap.appendChild(D({cls:'empty'},items.length?'No items match your search.':'No reorder items yet. Add one above.'));
      return;
    }
    // Header
    var hdr=D({style:{display:'grid',gridTemplateColumns:'1fr 2fr auto',gap:'8px',padding:'6px 12px',fontSize:'11px',color:'#b0adc4',textTransform:'uppercase',letterSpacing:'.5px',borderBottom:'1px solid rgba(232,98,74,.15)',marginBottom:'4px'}});
    hdr.appendChild(SP({},'Item'));
    hdr.appendChild(SP({},'Reorder Link'));
    hdr.appendChild(SP({},''));
    tableWrap.appendChild(hdr);

    filtered.forEach(function(it){
      var row=D({style:{display:'grid',gridTemplateColumns:'1fr 2fr auto',gap:'8px',alignItems:'center',padding:'8px 12px',background:'rgba(255,255,255,.03)',borderRadius:'8px',marginBottom:'4px'}});

      // Item name -- click to edit inline
      var nameEl=SP({style:{fontSize:'13px',color:'#f0ece4',cursor:'pointer',wordBreak:'break-word'}},it.name);
      (function(item){
        nameEl.title='Click to edit';
        nameEl.addEventListener('click',function(){
          var inp=INP({type:'text',value:item.name});
          inp.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:5px;padding:4px 8px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
          inp.addEventListener('blur',function(){
            var newVal=inp.value.trim();
            if(newVal&&newVal!==item.name){
              // Check duplicate
              if(items.find(function(x){return x.id!==item.id&&x.name.toLowerCase()===newVal.toLowerCase();})){
                alert('"'+newVal+'" already exists.');
                renderTable(); return;
              }
              item.name=newVal;
              audit('Reorder Item Renamed',newVal);
              save();
            }
            renderTable();
          });
          inp.addEventListener('keydown',function(e){if(e.key==='Enter')inp.blur();if(e.key==='Escape')renderTable();});
          nameEl.parentNode.replaceChild(inp,nameEl);
          inp.focus(); inp.select();
        });
      })(it);
      row.appendChild(nameEl);

      // Reorder link -- opens in browser, click to edit
      var linkWrap=D({style:{display:'flex',alignItems:'center',gap:'6px',overflow:'hidden'}});
      var linkBtn=D({style:{fontSize:'12px',color:'#87b7e8',cursor:'pointer',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:'1'}});
      linkBtn.textContent=it.link;
      linkBtn.title='Click to open, right-click to edit';
      (function(item){
        linkBtn.addEventListener('click',function(){window.open(item.link,'_blank','noopener');});
        linkBtn.addEventListener('contextmenu',function(e){
          e.preventDefault();
          var inp=INP({type:'url',value:item.link});
          inp.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:5px;padding:4px 8px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
          inp.addEventListener('blur',function(){
            var newVal=inp.value.trim();
            if(newVal&&newVal!==item.link){
              if(!/^https?:\/\//i.test(newVal)){alert('Link must start with http:// or https://');renderTable();return;}
              item.link=newVal; save();
            }
            renderTable();
          });
          inp.addEventListener('keydown',function(e){if(e.key==='Enter')inp.blur();if(e.key==='Escape')renderTable();});
          linkBtn.parentNode.replaceChild(inp,linkBtn);
          inp.focus(); inp.select();
        });
      })(it);
      linkWrap.appendChild(linkBtn);

      // Open button
      (function(item){
        var openBtn=BTN({cls:'btn bo bsm',click:function(){window.open(item.link,'_blank','noopener');}});
        openBtn.textContent='Order \u2197';
        openBtn.style.flexShrink='0';
        linkWrap.appendChild(openBtn);
      })(it);
      row.appendChild(linkWrap);

      // Delete
      var delBtn=BTN({cls:'btn br bsm'});
      delBtn.textContent='x';
      (function(item){delBtn.addEventListener('click',function(){
        if(!confirm('Remove "'+item.name+'" from reorder list?')) return;
        S.reorderItems=S.reorderItems.filter(function(x){return x.id!==item.id;});
        audit('Reorder Item Deleted',item.name);
        save(); renderTable();
      });})(it);
      row.appendChild(delBtn);

      tableWrap.appendChild(row);
    });

    // Count
    if(searchVal){
      tableWrap.appendChild(P({style:{fontSize:'11px',color:'#b0adc4',marginTop:'8px'}},filtered.length+' of '+items.length+' items'));
    }
  }

  renderTable();
  return w;
}

function checkAvailReminders(){
  // Notify users who haven't responded to events in the next 7 days
  if(!S.user) return;
  var td=TODAY();
  var cutoff=new Date(); cutoff.setDate(cutoff.getDate()+7);
  var cutoffStr=cutoff.toISOString().split('T')[0];
  try{
    var pending=allInstances(td,cutoffStr);
    USERS.forEach(function(u){
      pending.forEach(function(ev){
        if(!(ev.users||[]).some(function(x){return sameId(x,u.id);})) return;
        var r=getAvail(ev,u.id);
        if(r&&r.status&&r.status!=='tbd') return; // already responded
        // Check if we already sent a reminder recently (within 24hrs)
        var reminderKey='avail_remind_'+String(u.id)+'_'+(ev.templateId||ev.id)+'_'+ev.date;
        var lastRemind=parseInt(localStorage.getItem(reminderKey)||'0');
        if(Date.now()-lastRemind < 24*60*60*1000) return;
        // Only send reminder if admin is running this (admins see all users)
        if(isAdmin(S.user)){
          addNotif(u.id,'Reminder: Please respond to availability for "'+ev.title+'" on '+FD(ev.date));
          localStorage.setItem(reminderKey,String(Date.now()));
        }
      });
    });
  }catch(e){ console.warn('checkAvailReminders:',e); }
}

function auditView(){
  var w=D({});
  var log=(S.auditLog||[]);
  w.appendChild(D({cls:'rh'},[
    P({style:{fontSize:'14px',fontWeight:'500',color:'#f0ece4'}},'Audit Trail ('+log.length+' entries)'),
    BTN({cls:'btn br bsm',click:function(){
      if(!confirm('Clear the entire audit log?')) return;
      S.auditLog=[];save();render();
    }},'Clear Log')
  ]));
  if(!log.length){w.appendChild(D({cls:'empty'},'No activity recorded yet.'));return w;}
  // Search
  var q='', page=0, perPage=25;
  var ct=D({});
  var pageRow=D({style:{display:'flex',alignItems:'center',gap:'8px',marginTop:'8px'}});
  function rebuild(){
    ct.innerHTML=''; pageRow.innerHTML='';
    var filtered=log.filter(function(e){
      if(!q) return true;
      return (e.action||'').toLowerCase().includes(q)||(e.detail||'').toLowerCase().includes(q)||(e.name||'').toLowerCase().includes(q);
    });
    var totalPages=Math.ceil(filtered.length/perPage)||1;
    if(page>=totalPages) page=totalPages-1;
    var slice=filtered.slice(page*perPage,(page+1)*perPage);
    if(!slice.length){ct.appendChild(D({cls:'empty'},'No matching entries.'));return;}
    slice.forEach(function(entry){
      var c=D({cls:'card',style:{marginBottom:'.5rem'}});
      c.appendChild(D({cls:'ch'},[
        SP({style:{fontWeight:'500',fontSize:'13px',color:'#f0ece4'}},entry.action),
        SP({style:{fontSize:'11px',color:'#b0adc4'}},new Date(entry.ts).toLocaleString())
      ]));
      if(entry.detail) c.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginTop:'3px'}},entry.detail));
      c.appendChild(P({style:{fontSize:'11px',color:'#9090a8',marginTop:'2px'}},'By: '+(entry.name||'System')));
      ct.appendChild(c);
    });
    // Pagination
    if(totalPages>1){
      var prevP=BTN({cls:'btn bo bsm'});prevP.textContent='\u2190';prevP.disabled=page===0;
      prevP.addEventListener('click',function(){page--;rebuild();});
      pageRow.appendChild(prevP);
      pageRow.appendChild(SP({style:{fontSize:'12px',color:'#b0adc4'}},'Page '+(page+1)+' of '+totalPages+' ('+filtered.length+' results)'));
      var nextP=BTN({cls:'btn bo bsm'});nextP.textContent='\u2192';nextP.disabled=page>=totalPages-1;
      nextP.addEventListener('click',function(){page++;rebuild();});
      pageRow.appendChild(nextP);
    }
  }
  var searchInp=document.createElement('input');
  searchInp.type='text'; searchInp.placeholder='Search by action, detail, or user...';
  searchInp.className='task-search';
  searchInp.addEventListener('input',function(){q=searchInp.value.toLowerCase().trim();page=0;rebuild();});
  w.appendChild(searchInp);
  w.appendChild(ct);
  w.appendChild(pageRow);
  rebuild();
  return w;
}

      mw.appendChild(mbEl);
      if(mine){
        // show read receipts: who in the room has read this (excluding sender)
        var readers=room.members.filter(function(mid){return !sameId(mid,u.id)&&m.readBy&&(m.readBy[mid]||m.readBy[String(mid)]);});
        if(readers.length){
          var rr=SP({style:{fontSize:'9px',color:'#b0adc4',alignSelf:'flex-end',marginTop:'1px'}},'Read by: '+readers.map(UN).join(', '));
          mw.appendChild(rr);
        }
      }
      ml.appendChild(mw);
    });
    // readBy updated in memory -- saved next time user takes an action
    w.appendChild(ml);
    var pendingAtt=null;
    var attPreviewArea=D({style:{marginBottom:'6px'}});
    var ci=D({cls:'cin'}), ti=INP({type:'text',placeholder:'Type a message...'});
    function send(){
      if(!ti.value.trim()&&!pendingAtt)return;
      room.msgs.push({uid:u.id,text:ti.value.trim(),attachment:pendingAtt||null,ts:Date.now()});
      ti.value=''; pendingAtt=null; attPreviewArea.innerHTML='';
      save();render();
    }
    ti.addEventListener('keydown',function(e){if(e.key==='Enter')send();});
    var attBtn=filePickerBtn('',function(f){
      pendingAtt=f; attPreviewArea.innerHTML='';
      var prev=renderAttachment(f);
      if(prev){attPreviewArea.appendChild(prev);attPreviewArea.appendChild(SP({style:{fontSize:'11px',color:'#b0adc4',display:'block'}},f.name));}
    });
    attBtn.title='Attach file or image';
    ci.append(ti,attBtn,BTN({cls:'btn bg',click:send},'Send'));
    w.appendChild(attPreviewArea);
    w.appendChild(ci);
    return w;
  }
  var myUid=String(u.id||u.uid||'');
  var myRooms=S.rooms.filter(function(r){
    // Reviewers can see the room even if not a member
    if((r.reviewers||[]).some(function(x){return sameId(x,u.id);})) return true;
    // Members can see their own rooms
    return (r.members||[]).some(function(x){
      if(x==null) return false;
      var sx=String(x);
      if(sx===myUid) return true;
      if(sameId(sx,u.id)||sameId(sx,u.uid)) return true;
      if(sx.length<=6){
        var legacy=USERS.find(function(lu){return String(lu.id)===sx||String(lu.uid)===sx;});
        return legacy&&(sameId(legacy.id,u.id)||sameId(legacy.uid,u.uid||u.id));
      }
      return false;
    });
  });
  var w=D({});
  w.appendChild(D({cls:'rh'},[
    P({cls:'sec-t'},'Messages'),
    BTN({cls:'btn bg bsm',click:safe(function(){S.modal='createRoom';render();})},'+ New Room')
  ]));
  if(!myRooms.length){w.appendChild(D({cls:'empty'},'Not in any chat rooms.'));return w;}
  myRooms.forEach(function(room){
    var c=D({cls:'card',style:{cursor:'pointer'}});
    (function(rm){c.addEventListener('click',function(){S.activeRoom=rm.id;render();});})(room);
    var nameSpan=SP({cls:'ct'},room.name+(room.call?' \uD83D\uDCDE':''));
    var delBtn=isAdmin(u)?BTN({cls:'btn br bsm'},'Delete'):D({});
    if(isAdmin(u))(function(rm){delBtn.addEventListener('click',function(e){e.stopPropagation();S.rooms=S.rooms.filter(function(r){return r.id!==rm.id;});save();render();});})(room);
    c.appendChild(D({cls:'ch'},[nameSpan,delBtn]));
    var last=room.msgs.filter(function(m){return m.uid!==0;}).pop();
    c.appendChild(P({cls:'cs'},last?UN(last.uid)+': '+last.text.slice(0,50):'No messages yet'));
    c.appendChild(P({cls:'cs',style:{marginTop:'3px'}},room.members.length+' members'));
    w.appendChild(c);
  });
  return w;
}

function mPlayMusic(mo,song){
  var videoId=extractYouTubeId(song.youtubeUrl||'');
  mo.appendChild(P({cls:'modal-title'},song.title));
  if(song.album) mo.appendChild(P({cls:'cs',style:{marginBottom:'12px'}},song.album+(song.year?' \u00b7 '+song.year:'')));
  if(videoId){
    var embedWrap=D({});
    var iframe=document.createElement('iframe');
    // Enable YouTube JS API so we can receive postMessage events
    iframe.src='https://www.youtube.com/embed/'+videoId+'?rel=0&enablejsapi=1';
    iframe.style.cssText='width:100%;aspect-ratio:16/9;border:none;border-radius:8px;';
    iframe.setAttribute('allowfullscreen','1');
    iframe.setAttribute('allow','accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture');
    var _opened=false;
    // Listen for YouTube postMessage -- error code 150/101 = embedding disabled
    function _onMsg(e){
      if(_opened) return;
      try{
        var d=typeof e.data==='string'?JSON.parse(e.data):e.data;
        if(d&&d.event==='onError'&&(d.info===150||d.info===101)){
          _opened=true;
          window.removeEventListener('message',_onMsg);
          closeM();
          window.open(song.youtubeUrl,'_blank','noopener');
        }
      }catch(ex){}
    }
    window.addEventListener('message',_onMsg);
    // Also clean up listener when modal closes
    mo.addEventListener('DOMNodeRemovedFromDocument',function(){window.removeEventListener('message',_onMsg);},{once:true});
    iframe.addEventListener('error',function(){if(!_opened){_opened=true;window.removeEventListener('message',_onMsg);closeM();window.open(song.youtubeUrl,'_blank','noopener');}});
    embedWrap.appendChild(iframe);
    mo.appendChild(embedWrap);
    var _ytLink=document.createElement('a');
    _ytLink.href=song.youtubeUrl;_ytLink.target='_blank';_ytLink.rel='noopener';
    _ytLink.textContent='Open in YouTube';
    _ytLink.style.cssText='display:block;text-align:center;margin-top:8px;font-size:12px;color:#87b7e8;';
    mo.appendChild(_ytLink);
  } else {
    mo.appendChild(D({cls:'empty'},'Could not load video.'));
  }
  mo.appendChild(D({cls:'mfooter'},[BTN({cls:'btn bo',click:closeM},'Close')]));
}

function extractYouTubeId(url){
  if(!url) return null;
  var m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  return m?m[1]:null;
}

function mCreateEvent(mo){
  var prefill=(S.modal&&S.modal.prefillDate)||'';
  var fs={title:'',date:prefill,isRec:false,recur:'weekly',recDay:0,recEnd:null,
    city:'',state:'',address:'',location:'',startTime:'',rtp:'',rtm:'',dcw:'',dcm:'',
    isPublic:false,isVirtual:false,signUpLink:'',
    users:[],food:false,carpool:false,foodItems:[],carpoolLoc:'',vehicles:[],teams:[],coordEnabled:false,extraDays:[],taskTemplateId:null};
  var ct=D({}), err=P({cls:'err'});
  mo.appendChild(ct); mo.appendChild(err);
  mo.appendChild(D({cls:'mfooter'},[
    BTN({cls:'btn bo',click:closeM},'Cancel'),
    BTN({cls:'btn bg',click:safe(function(){
      if(!fs.title||(!fs.isRec&&!fs.date)||(!fs.isVirtual&&!fs.city)){err.textContent='Title and date required. Add a city or mark as virtual.';return;}
      // Check if task template assignees are in the event
      var tplWarn=[];
      if(fs.taskTemplateId){
        var selTpl2=S.taskTemplates.find(function(t){return String(t.id)===String(fs.taskTemplateId);});
        if(selTpl2){
          selTpl2.items.forEach(function(item){
            var role=item.assignToRole||'';
            if(role.slice(0,5)==='user:'){
              var uid2=role.slice(5);
              if(!fs.users.some(function(x){return sameId(x,uid2);})){
                var uname=UN(uid2);
                if(uname!=='?'&&tplWarn.indexOf(uid2)<0) tplWarn.push(uid2);
              }
            }
          });
        }
      }
      if(tplWarn.length){
        var names=tplWarn.map(UN).join(', ');
        var choice=confirm('These people are assigned tasks but not added to the event:\n'+names+'\n\nClick OK to add them automatically, or Cancel to go back and edit.');
        if(!choice){err.textContent='Please add the missing people to the event attendees.';return;}
        tplWarn.forEach(function(uid2){if(!fs.users.some(function(x){return sameId(x,uid2);}))fs.users.push(uid2);});
      }
      var newId=S.nEv++;
      var tmpl=Object.assign({},fs,{id:newId,teams:fs.teams.map(function(t){return Object.assign({},t,{members:t.members.slice(),leaders:t.leaders.slice()});})});
      S.templates.push(tmpl);
      // Notify nearby public users if this is a public event
      if(fs.isPublic&&(fs.city||fs.location)) notifyNearbyUsers(tmpl);
      // Generate tasks from template
      if(fs.taskTemplateId){
        var selTpl3=S.taskTemplates.find(function(t){return String(t.id)===String(fs.taskTemplateId);});
        if(selTpl3){
          var newTasks=generateEventTasks(selTpl3,tmpl);
          newTasks.forEach(function(task){S.tasks.push(task);});
        }
      }
      fs.users.forEach(function(uid){if(uid!==S.user.id){var msg='You have been added to: '+fs.title;if(fs.coordEnabled)msg+=' -- please respond to availability request';addNotif(uid,msg,{type:'info'});}});
      audit('Event Created',fs.title+(fs.isRec?' (recurring)':''));
      showToast('Event created!', 'success');
      save(); closeM();
    })},'Create Event')
  ]));
  function rebuild(){buildCreateEventForm(ct,fs,rebuild);}
  rebuild();
}

function buildAttendeeSection(fs,rebuild){
  var w=D({cls:'f'});
  w.appendChild(LBL({},'Assign Attendees'));
  var asel=SEL({change:function(e){
    var v=e.target.value; if(!v)return;
    if(v.slice(0,2)==='g:'){
      var gid=v.slice(2);
      var g=S.groups.find(function(g){return String(g.id)===gid;});
      if(g) g.members.forEach(function(id){
        if(!fs.users.some(function(x){return sameId(x,id);})) fs.users.push(String(id));
      });
    } else {
      var id=String(v);
      if(!fs.users.some(function(x){return sameId(x,id);})) fs.users.push(id);
    }
    e.target.value=''; rebuild();
  }});
  asel.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:14px;font-family:sans-serif;outline:none';
  asel.appendChild(OPT({value:''},'Add person or group...'));
  if(S.groups.length){
    asel.appendChild(OPT({disabled:true},'-- Groups --'));
    S.groups.forEach(function(g){asel.appendChild(OPT({value:'g:'+g.id},'Group: '+g.name));});
    asel.appendChild(OPT({disabled:true},'-- Individuals --'));
  }
  USERS.filter(function(u){return u.name&&u.name!=='?';}).slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'');}).forEach(function(u){asel.appendChild(OPT({value:u.id},u.name));});
  w.appendChild(asel);
  var al=D({style:{display:'flex',flexWrap:'wrap',gap:'3px',marginTop:'5px'}});
  fs.users.forEach(function(id){
    var t=SP({cls:'tag tagp',style:{cursor:'pointer'}},UN(id)+' x');
    (function(uid){t.addEventListener('click',function(){fs.users=fs.users.filter(function(x){return !sameId(x,uid);});rebuild();});})(id);
    al.appendChild(t);
  });
  w.appendChild(al);

function mCreateAnnounce(mo){

  mo.appendChild(FLD('Title',INP({type:'text',input:function(e){fd.title=e.target.value;}})));
