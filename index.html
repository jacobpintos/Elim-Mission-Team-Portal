<script>
// -- USERS ------------------------------------------------------------------
/*
 * FIRESTORE SECURITY RULES (paste into Firebase Console > Firestore > Rules):
 *
 * rules_version = '2';
 * service cloud.firestore {
 *   match /databases/{database}/documents {

 *
 * This ensures only authenticated users can upload and view files.
 */

// -- SAFE WRAPPER -----------------------------------------------------------
// Wraps click handlers so errors show a toast instead of silently failing
function safe(fn){
  return function(){
    try { fn.apply(this, arguments); }
    catch(e){
      console.error('Handler error:', e);
      showToast('Something went wrong: '+(e.message||'unknown error'), 'error');
    }
  };
}

// -- TOAST ------------------------------------------------------------------
function showToast(msg, type, duration){
  var tc=document.getElementById('toast-container');
  if(!tc) return;
  var t=document.createElement('div');
  t.className='toast'+(type?' '+type:'');
  t.textContent=msg;
  tc.appendChild(t);
  // Trigger transition
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ t.classList.add('show'); });
  });
  setTimeout(function(){
    t.classList.remove('show');
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, duration||2800);
}

// -- SAVE INDICATOR ---------------------------------------------------------
var _saveDotTimer = null;
function saveDotSaving(){
  var d=document.getElementById('save-dot');
  if(!d) return;
  d.className='saving';
  if(_saveDotTimer) clearTimeout(_saveDotTimer);
}
function saveDotSaved(){
  var d=document.getElementById('save-dot');
  if(!d) return;
  d.className='saved';
  if(_saveDotTimer) clearTimeout(_saveDotTimer);
  _saveDotTimer=setTimeout(function(){ d.className=''; }, 1600);
}

// -- ICS / CALENDAR EXPORT --------------------------------------------------
function icsDate(dateStr, timeStr){
  // dateStr: 'YYYY-MM-DD', timeStr: '10:00 AM' or '10:00'
  var d = dateStr.replace(/-/g,'');
  if(!timeStr) return d;
  // Parse 12h or 24h time
  var m = timeStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if(!m) return d;
  var h=parseInt(m[1]), mn=parseInt(m[2]);
  var ampm=(m[3]||'').toUpperCase();
  if(ampm==='PM' && h!==12) h+=12;
  if(ampm==='AM' && h===12) h=0;
  return d+'T'+String(h).padStart(2,'0')+String(mn).padStart(2,'0')+'00';
}

function buildICS(ev){
  var dtStart = icsDate(ev.date, ev.startTime);
  // Default duration 2 hours if no end time
  var dtEnd   = dtStart; // same-day; add 2h
  if(dtStart.indexOf('T')>=0){
    var h2 = parseInt(dtStart.slice(9,11))+2;
    dtEnd = dtStart.slice(0,9)+String(h2%24).padStart(2,'0')+dtStart.slice(11);
  }
  var uid_val = 'thewell-'+ev.id+(ev.instanceKey||ev.date||'')+'-'+Date.now()+'@missionportal';
  var desc = [];
  if(ev.rtp)  desc.push('Report Time (Production): '+ev.rtp);
  if(ev.rtm)  desc.push('Report Time (Mission): '+ev.rtm);
  if(ev.dcw)  desc.push('Dress Code (Worship): '+ev.dcw);
  if(ev.dcm)  desc.push('Dress Code (Mission): '+ev.dcm);
  if((ev.teams||[]).length) desc.push('Teams: '+(ev.teams.map(function(t){return t.name;}).join(', ')));

  function esc(s){ return (s||'').replace(/[\\;,]/g, function(c){ return '\\'+c; }).replace(/\n/g,'\\n'); }

  var lines=[
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//The Well of Iowa//Mission Portal//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:'+uid_val,
    'DTSTAMP:'+icsDate(new Date().toISOString().split('T')[0]),
    'DTSTART'+(dtStart.indexOf('T')>=0?'':';VALUE=DATE')+':'+dtStart,
    'DTEND'+(dtEnd.indexOf('T')>=0?'':';VALUE=DATE')+':'+dtEnd,
    'SUMMARY:'+esc(ev.title+(ev.isRec?' (Recurring)':'')),
    'LOCATION:'+esc(ev.location||''),
    'DESCRIPTION:'+esc(desc.join('\\n')||'The Well of Iowa Mission Event'),
    'END:VEVENT',
    'END:VCALENDAR'
  ];
  return lines.join('\r\n');
}

function downloadICS(ev){
  try {
    var ics = buildICS(ev);
    var blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href   = url;
    a.download = (ev.title||'event').replace(/[^a-zA-Z0-9_\- ]/g,'_')+'_'+(ev.date||'').replace(/-/g,'')+'.ics';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
    showToast('Calendar file downloaded! Open it to add to Google/Apple Calendar.', 'success', 3500);
  } catch(e){
    showToast('Could not generate calendar file: '+e.message, 'error');
  }
}

function showOnboarding(onDone){
  var step=0;
  var dontShow=false;

  var overlay=document.createElement('div');
  overlay.className='ob-overlay';

  function render_ob(){
    overlay.innerHTML='';
    var card=document.createElement('div');
    card.className='ob-card';

    // Step dots
    var dots=document.createElement('div');
    dots.className='ob-step-dots';
    ONBOARDING_STEPS.forEach(function(_,i){
      var d=document.createElement('div');
      d.className='ob-dot'+(i===step?' on':'');
      dots.appendChild(d);
    });
    card.appendChild(dots);

    var s=ONBOARDING_STEPS[step];
    var icon=document.createElement('div');
    icon.className='ob-icon';
    icon.textContent=s.icon;
    card.appendChild(icon);

    var title=document.createElement('p');
    title.className='ob-title';
    title.textContent=s.title;
    card.appendChild(title);

    var body=document.createElement('p');
    body.className='ob-body';
    body.textContent=s.body;
    card.appendChild(body);

    var footer=document.createElement('div');
    footer.className='ob-footer';

    var skip=document.createElement('button');
    skip.className='ob-skip';
    skip.textContent='Skip';
    skip.addEventListener('click', function(){ finishOnboarding(); });
    footer.appendChild(skip);

    var nextBtn=document.createElement('button');
    nextBtn.className='btn bg';
    var isLast=(step===ONBOARDING_STEPS.length-1);
    nextBtn.textContent=isLast ? 'Get Started ->' : 'Next ->';
    nextBtn.addEventListener('click', function(){
      if(isLast){ finishOnboarding(); }
      else { step++; render_ob(); }
    });
    footer.appendChild(nextBtn);
    card.appendChild(footer);

    // Don't show again
    var dsa=document.createElement('label');
    dsa.className='ob-dsa';
    var dsaCb=document.createElement('input');
    dsaCb.type='checkbox';
    dsaCb.checked=dontShow;
    dsaCb.addEventListener('change', function(){ dontShow=dsaCb.checked; });
    dsa.appendChild(dsaCb);
    dsa.appendChild(document.createTextNode("Don't show this again"));
    card.appendChild(dsa);

    overlay.appendChild(card);
  }

  function finishOnboarding(){
    if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
    if(dontShow && S.user){
      // Save preference to Firestore per-user
      db.collection('appState').doc('onboarding_'+String(S.user.uid||S.user.id))
        .set({dismissed:true, ts:Date.now()})
        .catch(function(e){ console.warn('Onboarding pref save failed:', e); });
    }
    if(onDone) onDone();
  }

  render_ob();
  document.body.appendChild(overlay);
}

  var docId='onboarding_'+String(S.user.uid||S.user.id);
  db.collection('appState').doc(docId).get()

      if(onDone) onDone();
    });
}

var DB_SAVING = false;
var SAVE_QUEUE = false;
var STATE_LOADED = false; // guard: don't save until Firestore data is loaded

function save(){
  // Never save before data is loaded from Firestore -- prevents overwriting real data
  if(!STATE_LOADED) return;
  // Debounce - if already saving, queue one more
  if(DB_SAVING){ SAVE_QUEUE=true; return; }
  DB_SAVING = true;
  saveDotSaving();
  var uid = S.user ? S.user.uid : null;
  if(!uid){ DB_SAVING=false; return; }

  // Save the full state as a single document (simple, works well at this scale)
  var payload = {
    tab: S.tab,
    calY: S.calY,
    calM: S.calM,
    templates: S.templates,
    overrides: S.overrides,
    groups: S.groups,
    tasks: S.tasks,
    rooms: S.rooms,
    reports: S.reports,
    notifs: S.notifs,
    pendingDel: S.pendingDel,
    auditLog: S.auditLog||[],
    announcements: S.announcements||[],
    reorderItems: S.reorderItems||[],
    productionItems: S.productionItems||[],
    setlists: S.setlists||[],
    inputLists: S.inputLists||{sunday:[],event:[],wh2:[]},
    merch: S.merch,
    avail: S.avail||{},
    taskTemplates: S.taskTemplates||[],
    nEv: S.nEv,
    nTask: S.nTask,
    nGroup: S.nGroup,
    nRoom: S.nRoom,
    nReport: S.nReport,
    nNotif: S.nNotif,
    COMMON_TEAMS: COMMON_TEAMS,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  db.collection('appState').doc('main').set(payload, {merge:true})
    .then(function(){
      DB_SAVING = false;
      saveDotSaved();
      if(SAVE_QUEUE){ SAVE_QUEUE=false; save(); }
    })

      showToast('Save failed -- check your connection.', 'error');

}

var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function getInstances(tmpl,from,to){
  var list=[];
  if(!tmpl.isRec){
    if(tmpl.date>=from&&tmpl.date<=to){
      var baseKey=String(tmpl.id)+'_'+tmpl.date;
      var baseOv=S.overrides[baseKey]||{};
      if(!baseOv.deleted) list.push(Object.assign({},tmpl,baseOv,{instanceKey:baseKey,templateId:tmpl.id,_dayIndex:0,_dayLabel:'Day 1'}));
    }
    // Extra days for multi-day non-recurring events
    (tmpl.extraDays||[]).forEach(function(ed,di){
      if(ed.date>=from&&ed.date<=to){
        var edKey=String(tmpl.id)+'_'+ed.date+'_d'+(di+2);
        var edOv=S.overrides[edKey]||{};
        if(!edOv.deleted){
          list.push(Object.assign({},tmpl,{
            date:ed.date,
            startTime:ed.startTime||tmpl.startTime,
            location:ed.location||tmpl.location,
            instanceKey:edKey,
            templateId:tmpl.id,
            _dayIndex:di+1,
            _dayLabel:'Day '+(di+2),
            _isExtraDay:true
          },edOv));
        }
      }
    });
    return list;
  }
  var fDate=new Date(from+'T12:00:00'), tDate=new Date(to+'T12:00:00');
  var cap=tmpl.recEnd?new Date(tmpl.recEnd+'T12:00:00'):tDate;
  if(cap>tDate) cap=tDate;
  var cur=new Date(fDate);
  while(cur.getDay()!==tmpl.recDay) cur.setDate(cur.getDate()+1);
  var n=0;
  while(cur<=cap&&n<104){
    var ds=cur.toISOString().split('T')[0];
    var key=tmpl.id+'_'+ds;
    var ov=S.overrides[key]||{};
    if(!ov.deleted){
      var inst=Object.assign({},tmpl,ov,{date:ds,instanceKey:key,templateId:tmpl.id});
      if(!inst.teams) inst.teams=[];
      list.push(inst);
    }
    var step=tmpl.recur==='weekly'?7:tmpl.recur==='biweekly'?14:30;
    cur.setDate(cur.getDate()+step);
    n++;
  }
  return list;
}

function allInstances(from,to){
  var all=[];
  S.templates.forEach(function(t){ all=all.concat(getInstances(t,from,to)); });
  all.sort(function(a,b){return a.date.localeCompare(b.date);});
  return all;
}

function getOrCreateOverride(tmplId,date){
  var key=tmplId+'_'+date;
  if(!S.overrides[key]){
    var tmpl=S.templates.find(function(t){return t.id===tmplId;});
    if(!tmpl)return null;
    S.overrides[key]=JSON.parse(JSON.stringify(tmpl));
    S.overrides[key].date=date;
    S.overrides[key].instanceKey=key;
    S.overrides[key].templateId=tmplId;
  }
  return S.overrides[key];
}

function pad2(n){return String(n).padStart(2,'0');}
function sameAvailId(a,b){
  if(String(a)===String(b)) return true;
  // Resolve through USERS as fallback for numeric vs UID mismatches
  var ua=USERS.find(function(u){return String(u.id)===String(a)||String(u.uid)===String(a);});
  var ub=USERS.find(function(u){return String(u.id)===String(b)||String(u.uid)===String(b);});

  var rb=ub?String(ub.uid||ub.id):String(b);
  return ra===rb;
}

function pendingAvailEvents(){
  if(!S||!S.user) return [];
  try{
    var uid=String(S.user.id||S.user.uid||'');
    if(!uid) return [];
    // Use start of current month so events earlier this month still show
    var now=new Date();
    var monthStart=now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-01';
    var far=new Date(); far.setDate(far.getDate()+365);
    var all=allInstances(monthStart,far.toISOString().split('T')[0]);
    var seen={};
    var result=all.filter(function(ev){
      var assigned=(ev.users||[]).some(function(x){return sameAvailId(x,uid);});
      if(!assigned) return false;
      if(ev.coordEnabled===false) return false;
      var r=getAvail(ev,uid);
      if(r&&r.status&&r.status!=='tbd') return false;
      var tk=ev._isExtraDay ? String(ev.instanceKey) : String(ev.templateId||ev.id);
      if(seen[tk]) return false;
      seen[tk]=true;
      return true;
    });
    return result;
  }catch(e){ console.warn('pendingAvailEvents:',e); return []; }
}

// -- DOM BUILDER ------------------------------------------------------------
function mk(tag,props,kids){
  var e=document.createElement(tag);
  if(props) Object.keys(props).forEach(function(k){
    var v=props[k];
    if(k==='cls') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k==='click') e.addEventListener('click',v);
    else if(k==='change') e.addEventListener('change',v);
    else if(k==='input') e.addEventListener('input',v);
    else if(k==='keydown') e.addEventListener('keydown',v);
    else if(k==='style'&&typeof v==='object') Object.assign(e.style,v);
    else e[k]=v;
  });
  function app(x){
    if(x==null)return;
    if(Array.isArray(x)){x.forEach(app);return;}
    if(x instanceof Node){e.appendChild(x);return;}
    e.appendChild(document.createTextNode(String(x)));
  }
  app(kids);
  return e;
}
function D(p,c){return mk('div',p,c);}
function P(p,c){return mk('p',p,c);}
function SP(p,c){return mk('span',p,c);}
function BTN(p,c){return mk('button',p,c);}
function INP(p){return mk('input',p);}
function SEL(p,c){return mk('select',p,c);}
function OPT(p,c){return mk('option',p,c);}
function LBL(p,c){return mk('label',p,c);}
function TA(p,c){return mk('textarea',p,c);}
function HR(){return mk('hr',{cls:'divider'});}
function FLD(l,el){return D({cls:'f'},[LBL({},l),el]);}

// A typeable dropdown that filters as you type
function ComboBox(placeholder, options, onSelect, style) {
  var wrap = D({style:{position:'relative',marginBottom:'.5rem'}});
  var inp = INP({type:'text', placeholder:placeholder||'Search...'});
  inp.style.cssText = 'width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(232,98,74,.3);border-radius:7px;padding:8px 12px;color:#f0ece4;font-size:13px;font-family:sans-serif;outline:none;' + (style||'');
  var drop = D({style:{display:'none',position:'absolute',top:'100%',left:'0',right:'0',zIndex:'200',background:'#1f1f2e',border:'1px solid rgba(232,98,74,.3)',borderRadius:'7px',maxHeight:'200px',overflowY:'auto',boxShadow:'0 4px 16px rgba(0,0,0,.5)'}});
  wrap.appendChild(inp); wrap.appendChild(drop);

  function renderDrop(filter) {
    drop.innerHTML = '';
    var q = (filter||'').toLowerCase().trim();
    var shown = q ? options.filter(function(o){return o.label.toLowerCase().includes(q);}) : options;
    if(!shown.length) { drop.style.display='none'; return; }
    shown.forEach(function(o) {
      var item = D({style:{padding:'8px 12px',cursor:'pointer',fontSize:'13px',color: o.disabled?'#5a5a6a':'#f0ece4',borderBottom:'1px solid rgba(232,98,74,.1)'}});
      if(o.disabled) {
        item.textContent = o.label;
        item.style.color = '#e8624a';
        item.style.fontSize = '11px';
        item.style.textTransform = 'uppercase';
        item.style.letterSpacing = '.4px';
        item.style.cursor = 'default';
        item.style.background = 'rgba(232,98,74,.06)';
      } else {
        item.textContent = o.label;
        item.addEventListener('mousedown', function(e) {
          e.preventDefault();
          inp.value = '';
          drop.style.display = 'none';
          onSelect(o.value, o.label);
        });
        item.addEventListener('mouseover', function(){ item.style.background='rgba(232,98,74,.12)'; });
        item.addEventListener('mouseout', function(){ item.style.background=''; });
      }
      drop.appendChild(item);
    });
    drop.style.display = 'block';
  }

  inp.addEventListener('focus', function(){ renderDrop(inp.value); });
  inp.addEventListener('input', function(){ renderDrop(inp.value); });
  inp.addEventListener('blur', function(){ setTimeout(function(){ drop.style.display='none'; }, 150); });
  return wrap;
}

// -- GENERATE TASKS FROM TEMPLATE FOR AN EVENT --------------------------------
function generateEventTasks(tmpl, eventTemplate) {
  var tasks = [];
  var eventDate = eventTemplate.date;
  var tid = eventTemplate.id;
  (tmpl.items||[]).forEach(function(item) {
    // Compute due date
    var due = null;
    if(eventDate && item.daysBefore) {
      var d = new Date(eventDate + 'T12:00:00');
      d.setDate(d.getDate() - (item.daysBefore||0));
      due = d.toISOString().split('T')[0];
    }
    // Resolve assignees
    var assignees = [];
    var roles = item.assignToRoles||(item.assignToRole?[item.assignToRole]:[]);
    roles.forEach(function(role){
      if(role.slice(0,5)==='user:') {
        var uid3=role.slice(5); if(assignees.indexOf(uid3)<0) assignees.push(uid3);
      } else if(role==='leaders') {
        (eventTemplate.teams||[]).forEach(function(t){ (t.leaders||[]).forEach(function(id){if(assignees.indexOf(id)<0)assignees.push(id);}); });
      } else if(role==='all') {
        (eventTemplate.users||[]).forEach(function(id){if(assignees.indexOf(id)<0)assignees.push(id);});
      }
    });
    if(assignees.length) {
      tasks.push({
        id: S.nTask++,
        assignees: assignees,
        lead: assignees[0],
        by: S.user.id,
        title: item.title,
        status: 'pending',
        evId: null,
        evDate: eventDate,
        evTemplateId: tid,
        dueDate: due,
        overdueNotified: false
      });
    }
  });
  return tasks;
}

function calWidget(){

  hdr.appendChild(D({style:{textAlign:'center'}},[
    SP({style:{color:'#e8624a',fontWeight:'500',fontSize:'16px',display:'block'}},MN[m]+' '+y)
  ]));
  hdr.appendChild(BTN({cls:'btn bo bsm',click:safe(function(){var nm=m+1,ny=y;if(nm>11){nm=0;ny++;}S.calM=nm;S.calY=ny;render();})},'->'));
  wrap.appendChild(hdr);
  var grid=D({cls:'cal-grid'});
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function(n){grid.appendChild(D({cls:'cdn'},n));});
  var first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), now=new Date();
  var fromDs=y+'-'+pad2(m+1)+'-01';
  var toDs=y+'-'+pad2(m+1)+'-'+pad2(days);
  var insts=allInstances(fromDs,toDs);
  // leading empty cells
  for(var i=0;i<first;i++){
    var em=D({cls:'cd om'});

    var prevDays=new Date(y,m,0).getDate();
    em.appendChild(SP({cls:'cnum'},prevDays-first+1+i));
    grid.appendChild(em);
  }
  for(var day=1;day<=days;day++){
    var ds=y+'-'+pad2(m+1)+'-'+pad2(day);
    var isT=now.getFullYear()===y&&now.getMonth()===m&&now.getDate()===day;
    var de=D({cls:'cd'+(isT?' tod':'')});

        de.appendChild(ee);

      (function(dateStr){de.addEventListener('click',function(){
        S.modal={type:'createEvent', prefillDate:dateStr}; render();
      });})(ds);
    }
  } // end for day loop
  var total=first+days;
  var trailing=(7-total%7)%7;
  for(var tr=1;tr<=trailing;tr++){
    var tc=D({cls:'cd om'});
    tc.appendChild(SP({cls:'cnum'},tr));
    grid.appendChild(tc);

  wrap.appendChild(grid);
  if(isAdmin(S.user)) wrap.appendChild(P({cls:'hint',style:{padding:'6px 12px',fontSize:'11px'}},'Gold = standard instance  .  Dark = modified instance'));
  return wrap;

  // Sort: overdue first, then by dueDate, then no date last

    return arr.slice().sort(function(a,b){

      if(!aOver&&bOver) return 1;
      var aD=a.dueDate||a.evDate||'9999';
      var bD=b.dueDate||b.evDate||'9999';
      return aD.localeCompare(bD);
    });
  }

  if(adminTasks.length){

    sortTasks(adminTasks).forEach(function(t){w.appendChild(taskCard(t,true));});
    w.appendChild(HR());
  }
  if(myTasks.length){
    // Group event-linked tasks by event template
    var evTaskGroups={}, plainTasks=[];
    sortTasks(myTasks).forEach(function(t){
      if(t.evTemplateId){
        var k=String(t.evTemplateId);

      evTaskGroups[tid].forEach(function(t){grpBox.appendChild(taskCard(t,false));});

      assignedTo.appendChild(SP({cls:'tag '+(isL?'tagl':'tagp')},(isL?'\u2605 ':'')+UN(id)));
    });
    c.appendChild(assignedTo);
  }
  if(t.dueDate) c.appendChild(P({style:{fontSize:'12px',color:over?'#e74c3c':'#b0adc4',marginTop:'3px'}},'Due: '+FD(t.dueDate)));
  if(assigneeList.some(function(x){return sameId(x,u.id);})&&isLead){
    var btns=D({style:{display:'flex',gap:'7px',marginTop:'8px'}});

    btns.appendChild(BTN({cls:'btn bG bsm',click:safe(function(){audit('Task Completed',t.title);S.tasks=S.tasks.filter(function(x){return x.id!==t.id;});save();render();})},'Mark Done'));

    c.appendChild(P({style:{fontSize:'11px',color:'#9090a8',marginTop:'6px',fontStyle:'italic'}},'Status changes managed by task lead: '+UN(t.lead)));
  }
  if(isAdminView){
    var adminRow=D({style:{display:'flex',gap:'7px',marginTop:'8px',flexWrap:'wrap',alignItems:'center'}});
    adminRow.appendChild(BTN({cls:'btn br bsm',click:safe(function(){S.tasks=S.tasks.filter(function(x){return x.id!==t.id;});save();render();})},'Delete'));
    var ddLabel=SP({style:{fontSize:'12px',color:'#b0adc4',marginLeft:'4px'}},'Due:');

    ddInp.style.cssText='font-size:12px;background:#fff;border:1px solid #ccc;border-radius:5px;padding:3px 6px;color:#1a1a1a;width:140px';

    adminRow.append(ddLabel,ddInp);
    c.appendChild(adminRow);
  }
  return c;
}

function adminView(){

  if(S.pendingDel.length) tabs.push({id:'deletions',label:'Pending Deletions ('+S.pendingDel.length+')'});
  var active=S.adminSub;

    active=id; S.adminSub=id;

    else if(id==='taskTpl') ct.appendChild(taskTemplatesView());

    else ct.appendChild(deletionsView());
  }
  tabs.forEach(function(t){
    var b=BTN({cls:'stab'+(t.id===active?' on':'')},t.label);
    b.setAttribute('data-id',t.id);
    b.addEventListener('click',safe(function(){show(t.id);}));
    st.appendChild(b);
  });
  w.append(st,ct);
  show(active);
  return w;

function execDelete(uid){
  var suid=String(uid);
  USERS=USERS.filter(function(u){return !sameId(u.id,suid);});
  S.pendingDel=S.pendingDel.filter(function(d){return !sameId(d.userId,suid);});
  S.templates.forEach(function(t){
    t.users=(t.users||[]).filter(function(id){return !sameId(id,suid);});
    (t.teams||[]).forEach(function(tm){
      tm.members=tm.members.filter(function(id){return !sameId(id,suid);});
      tm.leaders=tm.leaders.filter(function(id){return !sameId(id,suid);});
    });
  });
  S.groups.forEach(function(g){g.members=g.members.filter(function(id){return id!==uid;});});
  S.rooms.forEach(function(r){r.members=r.members.filter(function(id){return id!==uid;});});
  saveUsers();
  save();
}

function reorderView(){
  var w=D({});
  if(!S.reorderItems) S.reorderItems=[];
  var items=S.reorderItems;
  var searchVal='';

  // -- Add new item row -------------------------------------------------------
  var addRow=D({style:{display:'flex',gap:'8px',marginBottom:'1rem',flexWrap:'wrap'}});
  var newName=INP({type:'text',placeholder:'Item name...'});
  var newLink=INP({type:'url',placeholder:'Reorder URL (https://...)'});
  newName.style.cssText='flex:1;min-width:140px;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
  newLink.style.cssText='flex:2;min-width:180px;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
  var addErr=SP({style:{fontSize:'12px',color:'#e74c3c',display:'none'}});
  var addBtn=BTN({cls:'btn bg bsm',click:function(){
    var name=newName.value.trim(), link=newLink.value.trim();
    if(!name){addErr.textContent='Item name required.';addErr.style.display='block';return;}
    if(!link){addErr.textContent='Reorder link required.';addErr.style.display='block';return;}
    if(!/^https?:\/\//i.test(link)){addErr.textContent='Link must start with http:// or https://';addErr.style.display='block';return;}
    // Duplicate check
    if(items.find(function(it){return it.name.toLowerCase()===name.toLowerCase();})){
      addErr.textContent='"'+name+'" already exists.';addErr.style.display='block';return;
    }
    addErr.style.display='none';
    items.push({id:Date.now(),name:name,link:link});
    newName.value=''; newLink.value='';
    audit('Reorder Item Added',name);
    save(); renderTable();
  }},'+  Add Item');
  addRow.append(newName,newLink,addBtn);
  w.appendChild(addRow);
  w.appendChild(addErr);

  // -- Search -----------------------------------------------------------------
  var searchInp=INP({type:'text',placeholder:'Search items...'});
  searchInp.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none;margin-bottom:1rem';
  searchInp.addEventListener('input',function(e){searchVal=e.target.value.toLowerCase();renderTable();});
  w.appendChild(searchInp);

  // -- Table ------------------------------------------------------------------
  var tableWrap=D({});
  w.appendChild(tableWrap);

  function renderTable(){
    tableWrap.innerHTML='';
    var filtered=items.filter(function(it){
      return !searchVal||it.name.toLowerCase().indexOf(searchVal)>=0||it.link.toLowerCase().indexOf(searchVal)>=0;
    });
    if(!filtered.length){
      tableWrap.appendChild(D({cls:'empty'},items.length?'No items match your search.':'No reorder items yet. Add one above.'));
      return;
    }
    // Header
    var hdr=D({style:{display:'grid',gridTemplateColumns:'1fr 2fr auto',gap:'8px',padding:'6px 12px',fontSize:'11px',color:'#b0adc4',textTransform:'uppercase',letterSpacing:'.5px',borderBottom:'1px solid rgba(232,98,74,.15)',marginBottom:'4px'}});
    hdr.appendChild(SP({},'Item'));
    hdr.appendChild(SP({},'Reorder Link'));
    hdr.appendChild(SP({},''));
    tableWrap.appendChild(hdr);

    filtered.forEach(function(it){
      var row=D({style:{display:'grid',gridTemplateColumns:'1fr 2fr auto',gap:'8px',alignItems:'center',padding:'8px 12px',background:'rgba(255,255,255,.03)',borderRadius:'8px',marginBottom:'4px'}});

      // Item name -- click to edit inline
      var nameEl=SP({style:{fontSize:'13px',color:'#f0ece4',cursor:'pointer',wordBreak:'break-word'}},it.name);
      (function(item){
        nameEl.title='Click to edit';
        nameEl.addEventListener('click',function(){
          var inp=INP({type:'text',value:item.name});
          inp.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:5px;padding:4px 8px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
          inp.addEventListener('blur',function(){
            var newVal=inp.value.trim();
            if(newVal&&newVal!==item.name){
              // Check duplicate
              if(items.find(function(x){return x.id!==item.id&&x.name.toLowerCase()===newVal.toLowerCase();})){
                alert('"'+newVal+'" already exists.');
                renderTable(); return;
              }
              item.name=newVal;
              audit('Reorder Item Renamed',newVal);
              save();
            }
            renderTable();
          });
          inp.addEventListener('keydown',function(e){if(e.key==='Enter')inp.blur();if(e.key==='Escape')renderTable();});
          nameEl.parentNode.replaceChild(inp,nameEl);
          inp.focus(); inp.select();
        });
      })(it);
      row.appendChild(nameEl);

      // Reorder link -- opens in browser, click to edit
      var linkWrap=D({style:{display:'flex',alignItems:'center',gap:'6px',overflow:'hidden'}});
      var linkBtn=D({style:{fontSize:'12px',color:'#87b7e8',cursor:'pointer',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:'1'}});
      linkBtn.textContent=it.link;
      linkBtn.title='Click to open, right-click to edit';
      (function(item){
        linkBtn.addEventListener('click',function(){window.open(item.link,'_blank','noopener');});
        linkBtn.addEventListener('contextmenu',function(e){
          e.preventDefault();
          var inp=INP({type:'url',value:item.link});
          inp.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:5px;padding:4px 8px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
          inp.addEventListener('blur',function(){
            var newVal=inp.value.trim();
            if(newVal&&newVal!==item.link){
              if(!/^https?:\/\//i.test(newVal)){alert('Link must start with http:// or https://');renderTable();return;}
              item.link=newVal; save();
            }
            renderTable();
          });
          inp.addEventListener('keydown',function(e){if(e.key==='Enter')inp.blur();if(e.key==='Escape')renderTable();});
          linkBtn.parentNode.replaceChild(inp,linkBtn);
          inp.focus(); inp.select();
        });
      })(it);
      linkWrap.appendChild(linkBtn);

      // Open button
      (function(item){
        var openBtn=BTN({cls:'btn bo bsm',click:function(){window.open(item.link,'_blank','noopener');}});
        openBtn.textContent='Order \u2197';
        openBtn.style.flexShrink='0';
        linkWrap.appendChild(openBtn);
      })(it);
      row.appendChild(linkWrap);

      // Delete
      var delBtn=BTN({cls:'btn br bsm'});
      delBtn.textContent='x';
      (function(item){delBtn.addEventListener('click',function(){
        if(!confirm('Remove "'+item.name+'" from reorder list?')) return;
        S.reorderItems=S.reorderItems.filter(function(x){return x.id!==item.id;});
        audit('Reorder Item Deleted',item.name);
        save(); renderTable();
      });})(it);
      row.appendChild(delBtn);

      tableWrap.appendChild(row);
    });

    // Count
    if(searchVal){
      tableWrap.appendChild(P({style:{fontSize:'11px',color:'#b0adc4',marginTop:'8px'}},filtered.length+' of '+items.length+' items'));
    }
  }

  renderTable();
  return w;
}

function msgsView(){
  var u=S.user;
  if(S.activeRoom!==null){
    var room=S.rooms.find(function(r){return r.id===S.activeRoom;});
    if(!room){S.activeRoom=null;return msgsView();}
    var w=D({});

    if(room.call){
      var cb=D({cls:'call-bar'});
      cb.appendChild(SP({style:{color:'#87b7e8',fontSize:'14px'}},'Conference call in progress'));
      if(isAdmin(u)) cb.appendChild(BTN({cls:'btn br bsm',click:function(){room.call=false;room.msgs.push({uid:0,text:'[Call ended]',ts:Date.now()});save();render();}},'End Call'));
      w.appendChild(cb);
    }
    if(isAdmin(u)){
      var ab=D({style:{display:'flex',gap:'8px',marginBottom:'.75rem',flexWrap:'wrap'}});
      (function(rm){
        ab.appendChild(BTN({cls:'btn bo bsm',click:function(){S.modal={type:'editRoom',room:rm};render();}},'Manage Room'));
        if(!rm.call) ab.appendChild(BTN({cls:'btn bB bsm',click:function(){rm.call=true;rm.msgs.push({uid:0,text:'[Call started by '+u.name+']',ts:Date.now()});save();render();}},'Start Conference Call'));
      })(room);
      w.appendChild(ab);
    }
    var ml=D({cls:'msg-list card'});
    if(!room.msgs.length) ml.appendChild(D({cls:'empty',style:{padding:'1rem'}},'No messages yet.'));
    room.msgs.forEach(function(m){
      if(m.uid===0){ml.appendChild(P({style:{textAlign:'center',fontSize:'11px',color:'#b0adc4',padding:'4px 0'}},m.text));return;}
      // mark as read
      if(!m.readBy) m.readBy={};
      m.readBy[u.id]=true;
      var mine=m.uid===u.id, mw=D({cls:'mbw'});
      if(!mine) mw.appendChild(SP({cls:'mbs'},UN(m.uid)));
      var mbEl=D({cls:'mb '+(mine?'mine':'theirs')});
      if(m.text) mbEl.appendChild(document.createTextNode(m.text));
      if(m.attachment){var att=renderAttachment(m.attachment);if(att)mbEl.appendChild(att);}
      mw.appendChild(mbEl);
      if(mine){
        // show read receipts: who in the room has read this (excluding sender)
        var readers=room.members.filter(function(mid){return !sameId(mid,u.id)&&m.readBy&&(m.readBy[mid]||m.readBy[String(mid)]);});
        if(readers.length){
          var rr=SP({style:{fontSize:'9px',color:'#b0adc4',alignSelf:'flex-end',marginTop:'1px'}},'Read by: '+readers.map(UN).join(', '));
          mw.appendChild(rr);
        }
      }
      ml.appendChild(mw);
    });
    // readBy updated in memory -- saved next time user takes an action
    w.appendChild(ml);
    var pendingAtt=null;
    var attPreviewArea=D({style:{marginBottom:'6px'}});
    var ci=D({cls:'cin'}), ti=INP({type:'text',placeholder:'Type a message...'});
    function send(){
      if(!ti.value.trim()&&!pendingAtt)return;
      room.msgs.push({uid:u.id,text:ti.value.trim(),attachment:pendingAtt||null,ts:Date.now()});
      ti.value=''; pendingAtt=null; attPreviewArea.innerHTML='';
      save();render();
    }
    ti.addEventListener('keydown',function(e){if(e.key==='Enter')send();});
    var attBtn=filePickerBtn('',function(f){
      pendingAtt=f; attPreviewArea.innerHTML='';
      var prev=renderAttachment(f);
      if(prev){attPreviewArea.appendChild(prev);attPreviewArea.appendChild(SP({style:{fontSize:'11px',color:'#b0adc4',display:'block'}},f.name));}
    });
    attBtn.title='Attach file or image';
    ci.append(ti,attBtn,BTN({cls:'btn bg',click:send},'Send'));
    w.appendChild(attPreviewArea);
    w.appendChild(ci);
    return w;
  }
  var myRooms=S.rooms.filter(function(r){
    if(isAdmin(u)) return true; // admins see all rooms
    return r.members.some(function(x){
      if(x==null) return false;
      var sx=String(x);
      // Match by UID, by numeric id, or fallback to checking USERS list
      if(sameId(sx,u.id)||sameId(sx,u.uid)) return true;
      // Legacy: if stored as small number, find the user and compare
      if(sx.length<=6){
        var legacy=USERS.find(function(lu){return String(lu.id)===sx||String(lu.uid)===sx;});
        return legacy&&(sameId(legacy.id,u.id)||sameId(legacy.uid,u.uid||u.id));
      }
      return false;
    });
  });
  var w=D({});
  w.appendChild(D({cls:'rh'},[
    P({cls:'sec-t'},'Messages'),
    isAdmin(u)?BTN({cls:'btn bg bsm',click:safe(function(){S.modal='createRoom';render();})},'+ New Room'):D({})
  ]));

    c.appendChild(D({cls:'ch'},[nameSpan,delBtn]));

function mCreateEvent(mo){
  var prefill=(S.modal&&S.modal.prefillDate)||'';
  var fs={title:'',date:prefill,isRec:false,recur:'weekly',recDay:0,recEnd:null,
    location:'',startTime:'',rtp:'',rtm:'',dcw:'',dcm:'',
    users:[],food:false,carpool:false,foodItems:[],carpoolLoc:'',vehicles:[],teams:[],coordEnabled:false,extraDays:[],taskTemplateId:null};
  var ct=D({}), err=P({cls:'err'});
  mo.appendChild(ct); mo.appendChild(err);
  mo.appendChild(D({cls:'mfooter'},[
    BTN({cls:'btn bo',click:closeM},'Cancel'),
    BTN({cls:'btn bg',click:safe(function(){
      if(!fs.title||(!fs.isRec&&!fs.date)||!fs.location){err.textContent='Title, location, and date/recurrence required.';return;}
      // Check if task template assignees are in the event
      var tplWarn=[];
      if(fs.taskTemplateId){
        var selTpl2=S.taskTemplates.find(function(t){return String(t.id)===String(fs.taskTemplateId);});
        if(selTpl2){
          selTpl2.items.forEach(function(item){
            var role=item.assignToRole||'';
            if(role.slice(0,5)==='user:'){
              var uid2=role.slice(5);
              if(!fs.users.some(function(x){return sameId(x,uid2);})){
                var uname=UN(uid2);
                if(uname!=='?'&&tplWarn.indexOf(uid2)<0) tplWarn.push(uid2);
              }
            }
          });
        }
      }
      if(tplWarn.length){
        var names=tplWarn.map(UN).join(', ');
        var choice=confirm('These people are assigned tasks but not added to the event:\n'+names+'\n\nClick OK to add them automatically, or Cancel to go back and edit.');
        if(!choice){err.textContent='Please add the missing people to the event attendees.';return;}
        tplWarn.forEach(function(uid2){if(!fs.users.some(function(x){return sameId(x,uid2);}))fs.users.push(uid2);});
      }
      var newId=S.nEv++;
      var tmpl=Object.assign({},fs,{id:newId,teams:fs.teams.map(function(t){return Object.assign({},t,{members:t.members.slice(),leaders:t.leaders.slice()});})});
      S.templates.push(tmpl);
      // Generate tasks from template
      if(fs.taskTemplateId){
        var selTpl3=S.taskTemplates.find(function(t){return String(t.id)===String(fs.taskTemplateId);});
        if(selTpl3){
          var newTasks=generateEventTasks(selTpl3,tmpl);
          newTasks.forEach(function(task){S.tasks.push(task);});
        }
      }
      fs.users.forEach(function(uid){if(uid!==S.user.id){var msg='You have been added to: '+fs.title;if(fs.coordEnabled)msg+=' -- please respond to availability request';addNotif(uid,msg,{type:'info'});}});
      audit('Event Created',fs.title+(fs.isRec?' (recurring)':''));
      showToast('Event created!', 'success');
      save(); closeM();
    })},'Create Event')
  ]));
  function rebuild(){buildCreateEventForm(ct,fs,rebuild);}
  rebuild();
}

function buildAttendeeSection(fs,rebuild){
  var w=D({cls:'f'});
  w.appendChild(LBL({},'Assign Attendees'));
  var asel=SEL({change:function(e){
    var v=e.target.value; if(!v)return;
    if(v.slice(0,2)==='g:'){
      var gid=v.slice(2);
      var g=S.groups.find(function(g){return String(g.id)===gid;});
      if(g) g.members.forEach(function(id){
        if(!fs.users.some(function(x){return sameId(x,id);})) fs.users.push(String(id));
      });
    } else {
      var id=String(v);
      if(!fs.users.some(function(x){return sameId(x,id);})) fs.users.push(id);
    }
    e.target.value=''; rebuild();
  }});
  asel.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:14px;font-family:sans-serif;outline:none';
  asel.appendChild(OPT({value:''},'Add person or group...'));
  if(S.groups.length){
    asel.appendChild(OPT({disabled:true},'-- Groups --'));
    S.groups.forEach(function(g){asel.appendChild(OPT({value:'g:'+g.id},'Group: '+g.name));});
    asel.appendChild(OPT({disabled:true},'-- Individuals --'));
  }
  USERS.filter(function(u){return u.name&&u.name!=='?';}).slice().sort(function(a,b){return (a.name||'').localeCompare(b.name||'');}).forEach(function(u){asel.appendChild(OPT({value:u.id},u.name));});
  w.appendChild(asel);
  var al=D({style:{display:'flex',flexWrap:'wrap',gap:'3px',marginTop:'5px'}});
  fs.users.forEach(function(id){
    var t=SP({cls:'tag tagp',style:{cursor:'pointer'}},UN(id)+' x');
    (function(uid){t.addEventListener('click',function(){fs.users=fs.users.filter(function(x){return !sameId(x,uid);});rebuild();});})(id);
    al.appendChild(t);
  });
  w.appendChild(al);
  return w;
}

    fs.users.forEach(function(u){lsel.appendChild(OPT({value:u},UN(u)));});

      var id=e.target.value; if(!id)return;

    });})(team);
    tb.appendChild(lsel);
    var ll=D({style:{display:'flex',flexWrap:'wrap',gap:'3px',marginBottom:'6px'}});
    team.leaders.forEach(function(id){
      var t=SP({cls:'tag tagl',style:{cursor:'pointer'}},'* '+UN(id)+' x');
      (function(uid,tm){t.addEventListener('click',function(){tm.leaders=tm.leaders.filter(function(x){return x!==uid;});rebuild();});})(id,team);
      ll.appendChild(t);
    });
    tb.appendChild(ll);
    tb.appendChild(LBL({style:{fontSize:'11px',color:'#b0adc4'}},'Members'));

    msel.appendChild(OPT({value:''},'Add member...'));
    fs.users.filter(function(u){return !team.members.some(function(x){return sameId(x,u);});}).forEach(function(u){
      var alreadyInOther=(fs.teams||[]).some(function(ot){return ot!==team&&ot.members.some(function(x){return sameId(x,u);});});
      var opt=OPT({value:u},UN(u)+(alreadyInOther?' (also in other team)':''));

    (function(tm){msel.addEventListener('change',function(e){
      var id=e.target.value; if(!id)return;
      var sid=String(id); if(!tm.members.some(function(x){return sameId(x,sid);})) tm.members.push(sid);
      e.target.value=''; rebuild();
    });})(team);
    tb.appendChild(msel);
    var ml=D({style:{display:'flex',flexWrap:'wrap',gap:'3px'}});
    team.members.filter(function(id){return !team.leaders.some(function(x){return sameId(x,id);});}).forEach(function(id){
      var t=SP({cls:'tag tagp',style:{cursor:'pointer'}},UN(id)+' x');
      (function(uid,tm){t.addEventListener('click',function(){tm.members=tm.members.filter(function(x){return x!==uid;});tm.leaders=tm.leaders.filter(function(x){return x!==uid;});rebuild();});})(id,team);
      ml.appendChild(t);
    });
    tb.appendChild(ml);
    w.appendChild(tb);
  });
  var addRow=D({style:{display:'flex',gap:'6px',alignItems:'center',marginTop:'4px'}});
  var cusInp=INP({type:'text',placeholder:'Custom team name...',style:{flex:'1',fontSize:'13px',background:'#fff',border:'1px solid #ccc',borderRadius:'5px',padding:'5px 9px',color:'#1a1a1a'}});
  var comSel=SEL({style:{fontSize:'12px',background:'#fff',border:'1px solid #ccc',borderRadius:'5px',padding:'5px 8px',color:'#1a1a1a'}});
  comSel.appendChild(OPT({value:''},'Common teams...'));
  COMMON_TEAMS.forEach(function(n){comSel.appendChild(OPT({value:n},n));});
  comSel.addEventListener('change',function(e){if(e.target.value){cusInp.value=e.target.value;e.target.value='';}});
  var addBtn=BTN({cls:'btn bg bsm'},'+');
  addBtn.addEventListener('click',function(){
    var name=cusInp.value.trim(); if(!name)return;
    if(!fs.teams) fs.teams=[];
    if(!fs.teams.find(function(t){return t.name===name;})){fs.teams.push({name:name,leaders:[],members:[]});cusInp.value='';rebuild();}

    ds.appendChild(OPT({value:''},'Assign driver...'));
    fs.users.forEach(function(u){ds.appendChild(OPT({value:u,selected:veh.driver===u},UN(u)));});
    (function(v){ds.addEventListener('change',function(e){v.driver=e.target.value||null;rebuild();});})(veh);
    vc.appendChild(ds);
    vc.appendChild(LBL({style:{fontSize:'11px',color:'#b0adc4'}},'Passengers'));
    var ps=SEL({style:{fontSize:'12px',background:'#fff',border:'1px solid #ccc',borderRadius:'5px',padding:'3px',color:'#1a1a1a',width:'100%'}});
    ps.appendChild(OPT({value:''},'Add passenger...'));
    fs.users.filter(function(u){return !(veh.passengers||[]).some(function(p){return p===u;});}).forEach(function(u){ps.appendChild(OPT({value:u},UN(u)));});

    vc.appendChild(ps);
    var pl=D({style:{display:'flex',flexWrap:'wrap',gap:'3px',marginTop:'4px'}});
    (veh.passengers||[]).forEach(function(id){
      var t=SP({cls:'tag tagp',style:{cursor:'pointer'}},UN(id)+' x');
      (function(uid,v){t.addEventListener('click',function(){v.passengers=v.passengers.filter(function(x){return x!==uid;});rebuild();});})(id,veh);
      pl.appendChild(t);
    });
    vc.appendChild(pl);
    var remBtn=BTN({cls:'btn br bsm',style:{marginTop:'7px'}},'Remove Vehicle');
    (function(idx){remBtn.addEventListener('click',function(){fs.vehicles.splice(idx,1);rebuild();});})(i);
    vc.appendChild(remBtn);

  var vi=INP({type:'text',placeholder:'Vehicle name...',style:{flex:'1',fontSize:'13px',background:'#fff',border:'1px solid #ccc',borderRadius:'5px',padding:'5px 9px',color:'#1a1a1a'}});

  vr.append(vi,va);
  cb.appendChild(vr);
  return cb;
}

function mEditInstance(mo,ev){
  var ov=getOrCreateOverride(ev.templateId||ev.id,ev.date);
  if(!ov){mo.appendChild(P({cls:'err'},'Template not found.'));return;}
  mo.appendChild(P({cls:'modal-title'},'Edit Instance: '+ev.title+' ('+FD(ev.date)+')'));
  mo.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'1rem'}},'Changes affect this date only. All attendees will be notified.'));
  var ct=D({});
  mo.appendChild(ct);
  function rebuild(){buildFullInstanceForm(ct,ov,rebuild);}
  rebuild();
  mo.appendChild(D({cls:'mfooter'},[
    BTN({cls:'btn bo',click:closeM},'Cancel'),
    BTN({cls:'btn bg',click:function(){
      S.overrides[ov.instanceKey]=ov;
      (ov.users||[]).forEach(function(uid){if(uid!==S.user.id)addNotif(uid,'Event updated: '+ov.title+' on '+FD(ov.date));});
      save(); closeM();
    }},'Save & Notify Attendees')
  ]));
}

function mAddTask(mo){
  var title='',assignees=[],lead=null,dueDate=null,sourceGroupIds=[];
  var err=P({cls:'err'});
  var ct=D({});
  mo.appendChild(FLD('Task Description',INP({type:'text',placeholder:'e.g. Set up chairs...',input:function(e){title=e.target.value;}})));
  // multi-assignee picker
  var assignWrap=D({});
  function rebuildAssign(){
    assignWrap.innerHTML='';
    assignWrap.appendChild(P({style:{fontSize:'11px',color:'#b0adc4',textTransform:'uppercase',letterSpacing:'.4px',marginBottom:'4px'}},'Assign To'));
    var asel=SEL({change:function(e){
      var id=e.target.value; if(!id)return;
      if(!assignees.some(function(x){return sameId(x,id);})) assignees.push(String(id));
      if(assignees.length===1) lead=assignees[0];
      e.target.value=''; rebuildAssign();
    }},[OPT({value:''},'Add person...')].concat(
      USERS.filter(function(u){return assignees.indexOf(u.id)<0;}).map(function(u){return OPT({value:u.id},u.name);})
    ));
    asel.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:14px;font-family:sans-serif;outline:none;margin-bottom:6px';
    assignWrap.appendChild(asel);
    if(assignees.length>0){
      var list=D({style:{display:'flex',flexWrap:'wrap',gap:'4px',marginBottom:'8px'}});
      assignees.forEach(function(id){
        var isLead=(lead===id);
        var chip=D({style:{display:'flex',alignItems:'center',gap:'4px',background:isLead?'rgba(39,174,96,.15)':'rgba(15,52,96,.5)',border:'1px solid '+(isLead?'rgba(39,174,96,.4)':'rgba(87,183,232,.2)'),borderRadius:'20px',padding:'3px 8px',fontSize:'12px',cursor:'pointer',color:isLead?'#2ecc71':'#87b7e8'}});
        chip.textContent=(isLead?'* ':'')+UN(id);
        (function(uid){
          chip.title=isLead?'Lead (click to remove)':'Click to make lead';
          chip.addEventListener('click',function(){
            if(lead===uid){ assignees=assignees.filter(function(x){return x!==uid;}); lead=assignees[0]||null; }
            else { lead=uid; }
            rebuildAssign();
          });
        })(id);
        var rem=SP({style:{marginLeft:'4px',fontWeight:'700',fontSize:'14px',lineHeight:'1',color:'inherit',cursor:'pointer'}},'\u00D7');
        (function(uid){rem.addEventListener('click',function(e){
          e.stopPropagation();
          assignees=assignees.filter(function(x){return x!==uid;});
          if(lead===uid) lead=assignees[0]||null;
          rebuildAssign();
        });})(id);
        chip.appendChild(rem);
        list.appendChild(chip);
      });
      if(assignees.length>1) list.appendChild(SP({style:{fontSize:'11px',color:'#b0adc4',display:'block',width:'100%',marginTop:'2px'}},'Tap a person to set as lead (*). Lead can update task status.'));
      assignWrap.appendChild(list);
    }
    // group picker
    var gsel=SEL({change:function(e){
      var gid=e.target.value; if(!gid)return;
      var g=S.groups.find(function(g){return String(g.id)===String(gid);});
      if(g){
        g.members.forEach(function(id){if(!assignees.some(function(x){return sameId(x,id);}))assignees.push(String(id));});
        if(sourceGroupIds.indexOf(String(gid))<0) sourceGroupIds.push(String(gid));
      }
      if(!lead&&assignees.length>0) lead=assignees[0];
      e.target.value=''; rebuildAssign();
    }},[OPT({value:''},'Or add a group...')].concat(S.groups.map(function(g){return OPT({value:g.id},g.name);})));
    gsel.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:14px;font-family:sans-serif;outline:none';
    assignWrap.appendChild(gsel);
  }
  rebuildAssign();

  mo.appendChild(err);
  mo.appendChild(D({cls:'mfooter'},[
    BTN({cls:'btn bo',click:closeM},'Cancel'),
    BTN({cls:'btn bg',click:safe(function(){
      if(!title||!assignees.length){err.textContent='Title and at least one assignee required.';return;}
      var finalLead=lead||assignees[0];
      var task={id:S.nTask++,assignees:assignees.slice(),lead:finalLead,by:S.user.id,title:title,status:'pending',evId:null,evDate:null,dueDate:dueDate,overdueNotified:false,sourceGroupIds:sourceGroupIds.slice()};
      S.tasks.push(task);
      assignees.forEach(function(uid){
        var msg='New task assigned: "'+title+'"'+(dueDate?' (due '+FD(dueDate)+')':'')+(uid===finalLead?' -- you are the lead':'');
        addNotif(uid,msg,{type:'task'});
      });
      audit('Task Created',title+' -> '+assignees.map(UN).join(', '));
      showToast('Task assigned!', 'success');
      save(); closeM();
    })},'Add Task')
  ]));
}

function mEditGroup(mo,g){
  var members=g.members.slice(), mc=memberPicker(members);
  mo.appendChild(mc);
  mo.appendChild(D({cls:'mfooter'},[BTN({cls:'btn bo',click:closeM},'Cancel'),BTN({cls:'btn bg',click:function(){
        var oldMembers=g.members.slice();
        var newMembers=members.slice();
        g.members=newMembers;
        var added=newMembers.filter(function(x){return !oldMembers.some(function(y){return sameId(x,y);});});
        var removed=oldMembers.filter(function(x){return !newMembers.some(function(y){return sameId(x,y);});});
        // Sync events
        S.templates.forEach(function(tmpl){
          added.forEach(function(uid){
            if(!tmpl.users.some(function(x){return sameId(x,uid);})){
              tmpl.users.push(String(uid));
              addNotif(uid,'You have been added to: '+tmpl.title);
            }
          });
          removed.forEach(function(uid){
            tmpl.users=tmpl.users.filter(function(x){return !sameId(x,uid);});
            (tmpl.teams||[]).forEach(function(t){
              t.members=t.members.filter(function(x){return !sameId(x,uid);});
              t.leaders=t.leaders.filter(function(x){return !sameId(x,uid);});
            });
          });
        });
        // Sync group-sourced free tasks
        added.forEach(function(uid){
          S.tasks.forEach(function(t){
            if(!(t.sourceGroupIds||[]).some(function(gid){return String(gid)===String(g.id);})) return;
            if(!(t.assignees||[]).some(function(x){return sameId(x,uid);})){
              t.assignees.push(String(uid));
              addNotif(uid,'You have been added to task: "'+t.title+'"');
            }
          });
        });
        removed.forEach(function(uid){
          S.tasks.forEach(function(t){
            if(!(t.sourceGroupIds||[]).some(function(gid){return String(gid)===String(g.id);})) return;
            t.assignees=t.assignees.filter(function(x){return !sameId(x,uid);});
            if(sameId(t.lead,uid)) t.lead=t.assignees[0]||null;
          });
          S.tasks=S.tasks.filter(function(t){return (t.assignees||[]).length>0;});
        });
        // Sync tasks -- generate for added members, remove for removed members
        added.forEach(function(uid){
          // Find events with task templates where this user is now assigned
          S.templates.forEach(function(tmpl){
            if(!tmpl.taskTemplateId) return;
            if(!tmpl.users.some(function(x){return sameId(x,uid);})) return;
            var tpl=S.taskTemplates.find(function(t){return String(t.id)===String(tmpl.taskTemplateId);});
            if(!tpl) return;
            // Generate only tasks for this user specifically
            (tpl.items||[]).forEach(function(item){
              var roles=item.assignToRoles||(item.assignToRole?[item.assignToRole]:[]);
              var shouldAssign=roles.some(function(r){
                if(r==='all') return true;
                if(r==='leaders') return (tmpl.teams||[]).some(function(t){return (t.leaders||[]).some(function(x){return sameId(x,uid);});});
                if(r.slice(0,5)==='user:') return sameId(r.slice(5),uid);
                return false;
              });
              if(!shouldAssign) return;
              // Don't duplicate
              var alreadyHas=S.tasks.some(function(t){return t.evTemplateId===tmpl.id&&t.title===item.title&&(t.assignees||[]).some(function(x){return sameId(x,uid);});});
              if(alreadyHas) return;
              var due=null;
              if(tmpl.date&&item.daysBefore){var d=new Date(tmpl.date+'T12:00:00');d.setDate(d.getDate()-(item.daysBefore||0));due=d.toISOString().split('T')[0];}
              S.tasks.push({id:S.nTask++,assignees:[String(uid)],lead:String(uid),by:S.user.id,title:item.title,status:'pending',evId:null,evDate:tmpl.date,evTemplateId:tmpl.id,dueDate:due,overdueNotified:false});
            });
          });
        });
        removed.forEach(function(uid){
          S.tasks.forEach(function(t){
            if(t.assignees) t.assignees=t.assignees.filter(function(x){return !sameId(x,uid);});
          });
          S.tasks=S.tasks.filter(function(t){return (t.assignees||[]).length>0;});
        });
        // Sync messages -- add to rooms that have this group's members
        S.rooms.forEach(function(room){
          var hasGroup=g.members.some(function(m){return (room.members||[]).some(function(rm){return sameId(rm,m);});});
          if(!hasGroup) return;
          added.forEach(function(uid){
            if(!(room.members||[]).some(function(x){return sameId(x,uid);})){
              room.members.push(String(uid));
            }
          });
          removed.forEach(function(uid){
            room.members=room.members.filter(function(x){return !sameId(x,uid);});
          });
        });
        save();closeM();
      }},'Save')]));
}

// -- FILE ATTACHMENT HELPER (Firebase Storage) ------------------------------
// Uploads file to Firebase Storage and returns {name, type, url} via callback.
// Falls back to base64 for sandbox/offline use.
function filePickerBtn(label, onFile){
  var btn=BTN({cls:'btn bo bsm'},label+' \uD83D\uDCCE');
  btn.addEventListener('click',function(){
    var inp=document.createElement('input');
    inp.type='file';
    inp.accept='image/*,application/pdf,.doc,.docx,.txt';
    inp.addEventListener('change',function(){
      var file=inp.files[0]; if(!file) return;
      if(file.size>10*1024*1024){alert('File is larger than 10MB. Please choose a smaller file.');return;}
      // Show uploading state
      btn.textContent='Uploading...';
      btn.disabled=true;
      // Upload to Firebase Storage
      var authUid=(auth.currentUser&&auth.currentUser.uid)||'anon';
      var path='attachments/'+authUid+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      var ref=storage.ref(path);
      var task=ref.put(file);
      task.on('state_changed',
        function(snap){
          var pct=Math.round(snap.bytesTransferred/snap.totalBytes*100);
          btn.textContent='Uploading '+pct+'%...';
        },
        function(err){
          btn.textContent=(label||'Attach')+' \uD83D\uDCCE';
          btn.disabled=false;
          alert('Upload failed: '+err.message);
        },
        function(){
          ref.getDownloadURL().then(function(url){
            btn.textContent=(label||'Attach')+' \uD83D\uDCCE';
            btn.disabled=false;
            onFile({name:file.name, type:file.type, url:url});
          });
        }
      );
    });
    inp.click();
  });
  return btn;
}

function renderAttachment(att){
  if(!att) return null;
  // Support both old base64 (att.data) and new Storage URL (att.url)
  var src=att.url||att.data;
  if(!src) return null;
  var wrap=D({style:{marginTop:'6px',display:'inline-block'}});
  if(att.type&&att.type.startsWith('image/')){
    var img=document.createElement('img');
    img.src=src; img.alt=att.name;
    img.style.cssText='max-width:100%;max-height:200px;border-radius:8px;border:1px solid rgba(232,98,74,.2);display:block;';
    wrap.appendChild(img);
  } else {
    var link=document.createElement('a');
    link.href=src; link.target='_blank'; link.rel='noopener';
    link.style.cssText='font-size:12px;color:#87b7e8;text-decoration:none;display:flex;align-items:center;gap:5px;';
    link.textContent='\uD83D\uDCC4 '+att.name;
    wrap.appendChild(link);
  }
  return wrap;
}

function inputTable(listKey, rowCount){
  // Ensure list has the right number of rows
  var list=S.inputLists[listKey];
  if(!Array.isArray(list)) list=[];
  while(list.length<rowCount) list.push({input:'',output:''});
  if(list.length>rowCount) list.length=rowCount;
  S.inputLists[listKey]=list;

  var wrap=D({style:{overflow:'auto',maxWidth:'100%'}});

  // Debounced save
  var saveTimer=null;
  function queueSave(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){save();},500);
  }

  var tbl=document.createElement('table');
  tbl.style.cssText='width:100%;border-collapse:collapse;font-size:12px;color:#f0ece4;table-layout:fixed';

  var thead=document.createElement('thead');
  var hrow=document.createElement('tr');
  hrow.style.background='rgba(0,0,0,.15)';
  function hth(text, width){
    var th=document.createElement('th');
    th.style.cssText='text-align:left;padding:4px 6px;font-size:10px;font-weight:500;color:#b0adc4;text-transform:uppercase;letter-spacing:.4px;border:1px solid rgba(232,98,74,.25);'+(width?'width:'+width+';':'');
    th.textContent=text;
    return th;
  }
  hrow.appendChild(hth('#','42px'));
  hrow.appendChild(hth('Input'));
  hrow.appendChild(hth('Output'));
  thead.appendChild(hrow);
  tbl.appendChild(thead);

  var tbody=document.createElement('tbody');
  list.forEach(function(row, i){
    var tr=document.createElement('tr');

    var numTd=document.createElement('td');
    numTd.style.cssText='padding:3px 6px;color:#b0adc4;font-size:11px;text-align:center;border:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.1);font-weight:500';
    numTd.textContent=String(i+1);
    tr.appendChild(numTd);

    function cell(field){
      var td=document.createElement('td');
      td.style.cssText='padding:0;border:1px solid rgba(255,255,255,.06);vertical-align:top';
      var ta=document.createElement('textarea');
      ta.value=row[field]||'';
      ta.rows=1;
      ta.style.cssText='width:100%;box-sizing:border-box;background:transparent;border:none;color:#f0ece4;padding:4px 6px;font-size:12px;font-family:inherit;resize:none;outline:none;overflow:hidden;min-height:22px;line-height:1.3';
      function autosize(){
        ta.style.height='auto';
        ta.style.height=Math.max(22, ta.scrollHeight)+'px';
      }
      ta.addEventListener('input',function(e){
        row[field]=e.target.value;
        autosize();
        queueSave();
      });
      ta.addEventListener('focus',function(){ta.style.background='rgba(232,98,74,.08)';});
      ta.addEventListener('blur',function(){ta.style.background='transparent'; save();});
      td.appendChild(ta);
      // autosize after append
      setTimeout(autosize,0);
      return td;
    }
    tr.appendChild(cell('input'));
    tr.appendChild(cell('output'));

    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);
  return wrap;
}

  topRow.appendChild(BTN({cls:'btn bg bsm',click:function(){
    S.productionItems.push({id:Date.now()+Math.floor(Math.random()*1000),item:'',type:'',length:'',location:'',qty:0,unitPrice:0});

    save(); renderTable();
  }},'+ Add Row'));
  var countLbl=SP({style:{fontSize:'11px',color:'#b0adc4'}},'');
  topRow.appendChild(countLbl);
  w.appendChild(topRow);

  var filterRow=D({style:{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:'6px',marginBottom:'8px'}});
  function filterInp(key, placeholder){
    var inp=INP({type:'text',placeholder:'Filter '+placeholder+'...',input:function(e){
      filters[key]=e.target.value.toLowerCase(); renderTable();
    }});
    inp.style.cssText='background:#fff;border:1px solid #ccc;border-radius:6px;padding:6px 10px;color:#1a1a1a;font-size:12px;font-family:sans-serif;outline:none;width:100%;box-sizing:border-box';
    return inp;
  }
  filterRow.appendChild(filterInp('item','Item'));
  filterRow.appendChild(filterInp('type','Type'));
  filterRow.appendChild(filterInp('length','Length'));
  var locSel=SEL({change:function(e){filters.location=e.target.value.toLowerCase(); renderTable();}},
    [OPT({value:''},'All Locations')].concat(PRODUCTION_LOCATIONS.map(function(l){return OPT({value:l},l);})));
  locSel.style.cssText='background:#fff;border:1px solid #ccc;border-radius:6px;padding:6px 10px;color:#1a1a1a;font-size:12px;font-family:sans-serif;outline:none;width:100%;box-sizing:border-box';
  filterRow.appendChild(locSel);
  w.appendChild(filterRow);

  var tblWrap=D({style:{overflow:'auto',maxWidth:'100%'}});
  w.appendChild(tblWrap);

  function filtered(){
    return S.productionItems.filter(function(r){
      if(filters.item && (r.item||'').toLowerCase().indexOf(filters.item)<0) return false;
      if(filters.type && (r.type||'').toLowerCase().indexOf(filters.type)<0) return false;
      if(filters.length && String(r.length||'').toLowerCase().indexOf(filters.length)<0) return false;
      if(filters.location && (r.location||'').toLowerCase()!==filters.location) return false;
      return true;
    });
  }

  function renderTable(){
    tblWrap.innerHTML='';
    var rows=filtered();
    countLbl.textContent=rows.length+' of '+S.productionItems.length+' rows';
    if(!S.productionItems.length){
      tblWrap.appendChild(D({cls:'empty'},'No items yet. Click "+ Add Row" to start.'));
      return;
    }

    var tbl=document.createElement('table');
    tbl.style.cssText='width:100%;border-collapse:collapse;font-size:12px;color:#f0ece4;min-width:720px';

    var thead=document.createElement('thead');
    var hrow=document.createElement('tr');
    hrow.style.background='rgba(0,0,0,.2)';
    ['Item','Qty','Type','Length (ft)','Location','Unit Price','Total Value',''].forEach(function(h){
      var th=document.createElement('th');
      th.style.cssText='text-align:left;padding:6px 8px;font-size:10px;font-weight:500;color:#b0adc4;text-transform:uppercase;letter-spacing:.4px;border:1px solid rgba(232,98,74,.25);white-space:nowrap';
      th.textContent=h;
      hrow.appendChild(th);
    });
    thead.appendChild(hrow);
    tbl.appendChild(thead);

    var tbody=document.createElement('tbody');
    var subQty=0, subTotal=0;

    rows.forEach(function(row){
      var tr=document.createElement('tr');

      function cellInput(field, type){
        var td=document.createElement('td');
        td.style.cssText='padding:0;border:1px solid rgba(255,255,255,.08);vertical-align:middle';
        var inp=document.createElement('input');
        inp.type=type||'text';
        inp.value=(row[field]===null||row[field]===undefined)?'':String(row[field]);
        if(type==='number'){ inp.step='any'; inp.min='0'; }
        inp.style.cssText='width:100%;box-sizing:border-box;background:transparent;border:none;color:#f0ece4;padding:5px 8px;font-size:12px;font-family:inherit;outline:none';
        inp.addEventListener('focus',function(){inp.style.background='rgba(232,98,74,.08)';});
        inp.addEventListener('blur',function(){inp.style.background='transparent'; save();});
        inp.addEventListener('input',function(e){
          var v=e.target.value;
          if(type==='number'){ row[field]=v===''?0:parseFloat(v)||0; }
          else { row[field]=v; }
          if(field==='qty'||field==='unitPrice'){
            var t=(row.qty||0)*(row.unitPrice||0);
            var totalCell=tr.querySelector('[data-total]');
            if(totalCell) totalCell.textContent='$'+t.toFixed(2);
          }
        });
        td.appendChild(inp);
        return td;
      }

      function cellSelect(field, opts){
        var td=document.createElement('td');
        td.style.cssText='padding:0;border:1px solid rgba(255,255,255,.08);vertical-align:middle';
        var sel=document.createElement('select');
        sel.style.cssText='width:100%;box-sizing:border-box;background:transparent;border:none;color:#f0ece4;padding:5px 8px;font-size:12px;font-family:inherit;outline:none';
        var blank=document.createElement('option'); blank.value=''; blank.textContent='--'; sel.appendChild(blank);
        opts.forEach(function(o){
          var op=document.createElement('option'); op.value=o; op.textContent=o;
          if(row[field]===o) op.selected=true;
          op.style.color='#1a1a1a'; op.style.background='#fff';
          sel.appendChild(op);
        });
        sel.addEventListener('change',function(e){ row[field]=e.target.value; save(); renderTable(); });
        td.appendChild(sel);
        return td;
      }

      tr.appendChild(cellInput('item','text'));
      tr.appendChild(cellInput('qty','number'));
      tr.appendChild(cellInput('type','text'));
      tr.appendChild(cellInput('length','text'));
      tr.appendChild(cellSelect('location',PRODUCTION_LOCATIONS));
      tr.appendChild(cellInput('unitPrice','number'));

      var totalVal=(row.qty||0)*(row.unitPrice||0);
      subQty+=(row.qty||0);
      subTotal+=totalVal;

      var totalTd=document.createElement('td');
      totalTd.setAttribute('data-total','1');
      totalTd.style.cssText='padding:5px 8px;border:1px solid rgba(255,255,255,.08);vertical-align:middle;font-weight:500;color:#2ecc71';
      totalTd.textContent='$'+totalVal.toFixed(2);
      tr.appendChild(totalTd);

      var delTd=document.createElement('td');
      delTd.style.cssText='padding:2px 4px;border:1px solid rgba(255,255,255,.08);vertical-align:middle;text-align:center';
      (function(r){
        var delBtn=BTN({cls:'btn br bsm',click:function(){
          if(!confirm('Delete this row?')) return;
          S.productionItems=S.productionItems.filter(function(x){return x.id!==r.id;});
          audit('Production Row Deleted',r.item||'(unnamed)');
          save(); renderTable();
        }},'x');
        delTd.appendChild(delBtn);
      })(row);
      tr.appendChild(delTd);

      tbody.appendChild(tr);
    });

    var subRow=document.createElement('tr');
    subRow.style.background='rgba(232,98,74,.12)';
    subRow.style.fontWeight='600';
    var subTd1=document.createElement('td');
    subTd1.style.cssText='padding:8px;border:1px solid rgba(232,98,74,.4);color:#f0ece4;font-size:11px;text-transform:uppercase;letter-spacing:.5px';
    subTd1.textContent='Subtotal';
    subRow.appendChild(subTd1);
    var subQtyTd=document.createElement('td');
    subQtyTd.style.cssText='padding:8px;border:1px solid rgba(232,98,74,.4);color:#f0ece4';
    subQtyTd.textContent=subQty.toLocaleString(undefined,{maximumFractionDigits:2});
    subRow.appendChild(subQtyTd);
    for(var i=0;i<4;i++){
      var spacer=document.createElement('td');
      spacer.style.cssText='padding:8px;border:1px solid rgba(232,98,74,.4)';
      subRow.appendChild(spacer);
    }
    var subTotalTd=document.createElement('td');
    subTotalTd.style.cssText='padding:8px;border:1px solid rgba(232,98,74,.4);color:#2ecc71;font-weight:700';
    subTotalTd.textContent='$'+subTotal.toFixed(2);
    subRow.appendChild(subTotalTd);
    var emptySub=document.createElement('td');
    emptySub.style.cssText='padding:8px;border:1px solid rgba(232,98,74,.4)';
    subRow.appendChild(emptySub);
    tbody.appendChild(subRow);

    tbl.appendChild(tbody);
    tblWrap.appendChild(tbl);
  }

  renderTable();
  return w;
}

function productionAnalysis(){
  var w=D({});
  var items=S.productionItems||[];
  if(!items.length){ w.appendChild(D({cls:'empty'},'No production inventory to analyze.')); return w; }

  function entityKey(r){ return (r.item||'--')+(r.length?(' ('+r.length+'ft)'):''); }

  var types={};
  items.forEach(function(r){
    var type=(r.type||'').trim()||'(untyped)';
    if(!types[type]) types[type]=[];
    types[type].push(r);
  });

  var typeOptions=['__all__'].concat(Object.keys(types).sort());
  if(!S.productionAnalysisType) S.productionAnalysisType='__all__';
  if(typeOptions.indexOf(S.productionAnalysisType)<0) S.productionAnalysisType='__all__';

  var selWrap=D({style:{marginBottom:'12px'}});
  selWrap.appendChild(LBL({},'View by Type'));
  var sel=SEL({change:function(e){ S.productionAnalysisType=e.target.value; redraw(); }},
    typeOptions.map(function(t){return OPT({value:t,selected:t===S.productionAnalysisType}, t==='__all__'?'Aggregate (All Types)':t);}));
  sel.style.cssText='width:100%;max-width:320px;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
  selWrap.appendChild(sel);
  w.appendChild(selWrap);

  var chartsWrap=D({});
  w.appendChild(chartsWrap);

  function barChartInline(data, prefix, decimals){
    var wrap=D({style:{background:'rgba(0,0,0,.15)',borderRadius:'8px',padding:'10px',overflow:'auto'}});
    if(!data.length){ wrap.appendChild(P({style:{fontSize:'12px',color:'#b0adc4'}},'No data.')); return wrap; }
    var max=Math.max.apply(null, data.map(function(d){return d.value;}));
    if(max<=0) max=1;
    data.forEach(function(d){
      var row=D({style:{marginBottom:'5px',display:'flex',alignItems:'center',gap:'8px'}});
      var lbl=SP({style:{fontSize:'11px',color:'#f0ece4',minWidth:'140px',maxWidth:'200px',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},d.label);
      row.appendChild(lbl);
      var barWrap=D({style:{flex:'1',background:'rgba(255,255,255,.05)',borderRadius:'3px',height:'18px',position:'relative',minWidth:'80px'}});
      var pct=Math.max(1,(d.value/max)*100);
      var bar=D({style:{width:pct+'%',height:'100%',background:'#e8624a',borderRadius:'3px'}});
      barWrap.appendChild(bar);
      row.appendChild(barWrap);
      var val=SP({style:{fontSize:'11px',color:'#b0adc4',minWidth:'70px',textAlign:'right'}},
        prefix+d.value.toFixed(decimals||0));
      row.appendChild(val);
      wrap.appendChild(row);
    });
    return wrap;
  }

  function redraw(){
    chartsWrap.innerHTML='';
    var t=S.productionAnalysisType;
    var dataRows=(t==='__all__')?items:(types[t]||[]);

    var entities={};
    dataRows.forEach(function(r){
      var k=entityKey(r);
      if(!entities[k]) entities[k]={qty:0, value:0, label:k};
      entities[k].qty+=(r.qty||0);
      entities[k].value+=(r.qty||0)*(r.unitPrice||0);
    });

    var entityList=Object.keys(entities).map(function(k){return entities[k];});
    if(!entityList.length){
      chartsWrap.appendChild(D({cls:'empty'},'No data for this type.'));
      return;
    }

    var byValue=entityList.slice().sort(function(a,b){return b.value-a.value;});
    var byQty=entityList.slice().sort(function(a,b){return b.qty-a.qty;});

    chartsWrap.appendChild(P({style:{fontSize:'13px',fontWeight:'600',color:'#f0ece4',marginBottom:'6px',marginTop:'4px'}},'Total Value by Item'));
    chartsWrap.appendChild(barChartInline(byValue.slice(0,20).map(function(e){return {label:e.label, value:e.value};}), '$', 2));

    chartsWrap.appendChild(P({style:{fontSize:'13px',fontWeight:'600',color:'#f0ece4',marginBottom:'6px',marginTop:'20px'}},'Quantity by Item'));
    chartsWrap.appendChild(barChartInline(byQty.slice(0,20).map(function(e){return {label:e.label, value:e.qty};}), '', 0));

    var totalQty=entityList.reduce(function(s,e){return s+e.qty;},0);
    var totalValue=entityList.reduce(function(s,e){return s+e.value;},0);
    var summary=D({style:{marginTop:'20px',padding:'12px',background:'rgba(255,255,255,.04)',borderRadius:'8px'}});
    summary.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'4px'}},'Total Quantity: '+totalQty.toLocaleString()));
    summary.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'4px'}},'Total Value: $'+totalValue.toFixed(2)));
    summary.appendChild(P({style:{fontSize:'12px',color:'#b0adc4'}},'Unique Items: '+entityList.length));
    chartsWrap.appendChild(summary);
  }

  redraw();
  return w;
}

}

function merchTransactions(){
  var w=D({});
  var allTxs=S.merch.transactions.slice().reverse();
  if(!allTxs.length){ w.appendChild(D({cls:'empty'},'No transactions yet.')); return w; }

  var searchVal='', filterEvent='';
  var listContainer=D({});
  var eventNames=[];
  allTxs.forEach(function(tx){
    if(tx.kind==='sale'&&tx.eventName&&eventNames.indexOf(tx.eventName)<0) eventNames.push(tx.eventName);
  });

  var controls=D({style:{display:'flex',gap:'8px',marginBottom:'1rem',flexWrap:'wrap'}});
  var searchInp=INP({type:'text',placeholder:'Search by item, event, notes...'});
  searchInp.style.cssText='flex:1;min-width:160px;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
  searchInp.addEventListener('input',function(e){searchVal=e.target.value.toLowerCase();renderList();});

  evFilter.appendChild(OPT({value:''},'All events'));
