<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Well of Iowa -- Mission Team Portal</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#e8624a;--corall:#f07d68;--coraldk:#c44a34;
  --navy:#1c1c2a;--dark:#14141e;--surf:#1f1f2e;--surf2:#272736;
  --mid:#1a1010;--muted:#9a9ab0;--bdr:rgba(232,98,74,0.25);
  --red:#c0392b;--grn:#27ae60;--blue:#2980b9;--txt:#f0ece4
}

body.light{background:#f0eff8;color:#1a1a2e !important}
body.light #app{background:#f0eff8}
body.light p{color:#1a1a2e !important}
body.light span{color:#1a1a2e !important}
body.light #main > div,body.light .card > div,body.light .modal > div{color:#1a1a2e}
body.light .card{background:#fff;border-color:rgba(232,98,74,.2)}
body.light .sec-t{color:#1a1a2e !important}
body.light .cs{color:#4a4a6a !important}
body.light .hint{color:#4a4a6a !important}
body.light .mbs{color:#4a4a6a !important}
body.light label{color:#4a4a6a !important}
body.light .f label{color:#4a4a6a !important}
body.light #navtabs{background:#fff;border-bottom-color:rgba(232,98,74,.2)}
body.light .ntab{color:#4a4a6a !important}
body.light .ntab.on{color:#e8624a !important;border-bottom-color:#e8624a}
body.light #topbar{background:#fff;border-bottom-color:rgba(232,98,74,.15)}
body.light .modal{background:#fff;border-color:rgba(232,98,74,.3)}
body.light .modal-title{color:#e8624a !important}
body.light .modal-bg{background:rgba(0,0,0,.45)}
body.light input,body.light textarea,body.light select{background:#fff;border-color:rgba(74,74,106,.25);color:#1a1a2e !important}
body.light input::placeholder,body.light textarea::placeholder{color:#8a8aaa !important}
body.light .task-search{background:#fff;border-color:rgba(74,74,106,.25);color:#1a1a2e !important}
body.light .msg-list{background:#f5f4fc}
body.light .mb.theirs{background:#e4e3f0;color:#1a1a2e !important}
body.light .mb.mine{background:#e8624a;color:#fff !important}
body.light .overdue-banner{background:rgba(192,57,43,.05);border-color:rgba(192,57,43,.2)}
body.light .overdue-banner-title{color:#c0392b !important}
body.light .empty{color:#7a7a9a !important}
body.light .tag{background:rgba(232,98,74,.1);color:#c44a34 !important;border-color:rgba(232,98,74,.25)}
body.light .tagp{background:rgba(232,98,74,.1);color:#c44a34 !important;border-color:rgba(232,98,74,.25)}
body.light .stab{color:#4a4a6a !important;border-color:rgba(74,74,106,.2);background:transparent}
body.light .stab.on{background:#e8624a;color:#fff !important;border-color:#e8624a}
body.light .btn.bo{color:#4a4a6a !important;border-color:rgba(74,74,106,.25);background:transparent}
body.light .btn.bo:hover{background:rgba(74,74,106,.08)}
body.light .btn.bg{color:#fff !important}
body.light .btn.br{color:#fff !important}
body.light .btn.bG{color:#fff !important}
body.light .btn.bB{color:#fff !important}
body.light #login-page{background:#e8e7f0}
body.light .login-card{background:#fff;border-color:rgba(232,98,74,.25);box-shadow:0 4px 24px rgba(74,74,106,.15)}
body.light .team-block{background:rgba(74,74,106,.06);border-color:rgba(74,74,106,.15)}
body.light .call-bar{background:rgba(41,128,185,.08);border-color:rgba(41,128,185,.25)}
body.light .warn-box{background:rgba(200,100,50,.06);border-color:rgba(200,100,50,.2)}
body.light .notif-item{background:rgba(200,169,110,.06);border-color:rgba(232,98,74,.2)}
body.light table td,body.light table th{color:#1a1a2e !important}
body.light{--ob-bg:#fff}
body.light .ob-card{background:#fff;box-shadow:0 8px 40px rgba(74,74,106,.2);color:#1a1a2e}
body.light .ob-body{color:#4a4a6a}
body.light .ob-step-dots .ob-dot{background:rgba(74,74,106,.2)}
body.light .ob-step-dots .ob-dot.on{background:#e8624a}
body.light .out-block{background:#f5f4fc;border-color:rgba(74,74,106,.15)}
body.light .mfooter{border-top-color:rgba(74,74,106,.15)}
/* Calendar light mode */
body.light .cal-wrap{background:#fff;border-color:rgba(232,98,74,.2)}
body.light .cal-month-hdr{background:#fff;border-bottom-color:rgba(232,98,74,.2)}
body.light .cal-month-hdr span,body.light .cal-month-hdr p,body.light .cal-month-hdr div{color:#1a1a2e !important}
body.light .cdn{background:rgba(74,74,106,.06);color:#4a4a6a !important}
body.light .cd{border-right-color:rgba(74,74,106,.08);border-bottom-color:rgba(74,74,106,.08)}
body.light .cd:hover{background:rgba(232,98,74,.06)}
body.light .cd.tod{background:rgba(232,98,74,.08)}
body.light .cnum{color:rgba(26,26,46,.4) !important}
body.light .cd.tod .cnum{color:#e8624a !important}
body.light .cd.om .cnum{color:rgba(26,26,46,.15) !important}
body.light /* Virtual event styles */
.cev.virtual{border-left:3px solid #87b7e8 !important;background:rgba(135,183,232,.15) !important}
.card.virtual-ev{border-color:rgba(135,183,232,.5) !important;border-left:3px solid #87b7e8 !important}
body.light .cev.virtual{border-left-color:#2980b9 !important;background:rgba(41,128,185,.08) !important}
body.light .card.virtual-ev{border-color:rgba(41,128,185,.4) !important;border-left-color:#2980b9 !important}
.cev{color:#fff !important}
/* Availability card light mode */
body.light .avail-card,body.light [class*="avail"]{background:#fff}

body{font-family:sans-serif;background:#14141e;color:#f0ece4;min-height:100vh}
#app{min-height:100vh;display:flex;flex-direction:column;background:#14141e}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-family:sans-serif;font-weight:500;transition:opacity .15s}
.btn:hover{opacity:.85}
.bg{background:#e8624a;color:#fff}.bo{background:transparent;border:1px solid rgba(232,98,74,0.25);color:#f0ece4}
.br{background:#c0392b;color:#fff}.bG{background:#27ae60;color:#fff}.bB{background:#2980b9;color:#fff}
.bsm{padding:5px 12px;font-size:12px}.bfw{width:100%}
.f{margin-bottom:.9rem}
.f label{display:block;font-size:11px;color:#b0adc4;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.f input,.f select,.f textarea{width:100%;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:14px;font-family:sans-serif;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:#e8624a}
.f select option{background:#fff;color:#1a1a1a}.f textarea{resize:vertical;min-height:72px}
.hint{font-size:11px;color:#b0adc4;margin-top:4px;line-height:1.6}
.err{font-size:12px;color:#e74c3c;margin-top:4px;min-height:16px}
.ok{font-size:12px;color:#27ae60;margin-top:4px}
.card{background:#1f1f2e;border:1px solid rgba(232,98,74,0.25);border-radius:12px;padding:1rem 1.1rem;margin-bottom:.65rem}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:.3rem;gap:8px;flex-wrap:wrap}
.ct{font-size:15px;font-weight:500}.cs{font-size:12px;color:#b0adc4}
.sec-t{font-size:17px;color:#e8624a;margin-bottom:.9rem;letter-spacing:.4px}
.rh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem;flex-wrap:wrap;gap:8px}
.empty{text-align:center;padding:2rem;color:#b0adc4;font-size:14px}
.divider{border:none;border-top:1px solid rgba(232,98,74,0.25);margin:.85rem 0}
.mfooter{display:flex;gap:8px;justify-content:flex-end;margin-top:1.1rem;flex-wrap:wrap}
.toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:.85rem;font-size:14px}
.toggle-row input[type=checkbox]{accent-color:#e8624a;width:15px;height:15px;cursor:pointer}
.tag{display:inline-block;background:rgba(200,169,110,.12);border:1px solid rgba(232,98,74,0.25);border-radius:20px;padding:2px 8px;font-size:11px;color:#e8624a;margin:2px}
.tagp{background:rgba(15,52,96,.6);border-color:rgba(87,183,232,.2);color:#87b7e8}
.tagl{background:rgba(39,174,96,.15);border-color:rgba(39,174,96,.3);color:#2ecc71}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:.4rem .9rem;margin-bottom:.9rem}
.dl{font-size:11px;color:#b0adc4;text-transform:uppercase;letter-spacing:.4px}
.dv{font-size:13px;margin-bottom:.35rem}
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.sdot.p{background:#e67e22}.sdot.i{background:#3498db}.sdot.d,.sdot.a{background:#27ae60}
.stabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.9rem}
.overdue-banner{background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.4);border-radius:10px;padding:12px 14px;margin-bottom:1rem}
.overdue-banner-title{font-size:12px;font-weight:600;color:#e74c3c;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.task-search{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(232,98,74,.25);border-radius:8px;padding:9px 13px;color:#f0ece4;font-size:13px;font-family:sans-serif;outline:none;margin-bottom:1rem;box-sizing:border-box}
.task-search::placeholder{color:#5a5a6a}

.stab{padding:5px 12px;border-radius:20px;border:1px solid rgba(232,98,74,0.25);background:none;color:#b0adc4;font-size:12px;cursor:pointer;font-family:sans-serif}
.stab.on{background:#e8624a;color:#fff;border-color:#e8624a;font-weight:600}
.sbox{background:rgba(255,255,255,.04);border:1px solid rgba(232,98,74,0.2);border-radius:8px;padding:10px 12px;margin-bottom:.65rem;font-size:13px}
.cal-wrap{background:#1f1f2e;border:1px solid rgba(232,98,74,0.25);border-radius:14px;overflow:hidden;margin-bottom:.75rem}
.cal-month-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#1f1f2e;border-bottom:1px solid rgba(232,98,74,0.25)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cdn{text-align:center;font-size:11px;color:#b0adc4;padding:8px 2px;font-weight:500;background:rgba(0,0,0,.15);border-bottom:1px solid rgba(232,98,74,0.25);min-width:0}
.cd{min-height:56px;padding:4px 5px;border-right:1px solid rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .1s;min-width:0;overflow:hidden}
.cd:hover{background:rgba(232,98,74,.08)}
.cd.tod{background:rgba(232,98,74,.12)}
.cd.tod .cnum{color:#e8624a;font-weight:700}
.cd.om .cnum{color:rgba(255,255,255,.15)}
.cd.om .cev{display:none}
.cnum{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:3px;display:block}
.cev{background:#e8624a;color:#fff;font-size:9px;border-radius:4px;padding:2px 5px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;display:block;font-weight:500;min-width:0;max-width:100%}
.cev.mod{background:#c44a34}
.cev:hover{opacity:.85}
.msg-list{max-height:320px;overflow-y:auto;padding:.5rem;margin-bottom:.75rem}
.mbw{display:flex;flex-direction:column;margin-bottom:6px}
.mb{max-width:72%;padding:7px 11px;border-radius:10px;font-size:13px}
.mb.mine{background:#1a1010;align-self:flex-end;border-bottom-right-radius:3px}
.mb.theirs{background:#272736;align-self:flex-start;border-bottom-left-radius:3px}
.mbs{font-size:10px;color:#b0adc4;margin-bottom:2px}
.cin{display:flex;gap:8px;margin-top:8px}
.cin input{flex:1;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none}

/* -- HAMBURGER MENU -- */
#app-wrap{display:flex;flex-direction:row;min-height:100vh}
#side-menu{position:fixed;top:0;left:0;height:100vh;width:260px;background:#1c1c2a;border-right:1px solid rgba(232,98,74,.2);z-index:5000;transform:translateX(-260px);display:flex;flex-direction:column;overflow:hidden}
#side-menu.open{transform:translateX(0)}
.menu-animated #content-wrap{transition:margin-left .25s}
.menu-animated #side-menu{transition:transform .25s}
body.menu-open #content-wrap{margin-left:260px}
body.menu-open #side-menu{transform:translateX(0)}
#menu-overlay{position:fixed;inset:0;background:transparent;z-index:4999;display:none}
body.menu-open #menu-overlay{display:block}
#content-wrap{flex:1;display:flex;flex-direction:column;min-width:0}
.hbtn{background:none;border:none;cursor:pointer;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
.hbtn span{display:block;width:20px;height:2px;background:#e8624a;border-radius:2px}
.menu-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(232,98,74,.15);flex-shrink:0}
.menu-section{padding:8px 0;border-bottom:1px solid rgba(232,98,74,.08)}
.menu-section-label{font-size:10px;color:#5a5a7a;text-transform:uppercase;letter-spacing:.08em;padding:6px 16px 2px}
.mitem{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 16px;background:none;border:none;color:#b0adc4;font-size:13px;font-family:sans-serif;cursor:pointer;text-align:left;transition:background .12s}
.mitem:hover,.mitem.on{background:rgba(232,98,74,.1);color:#f0ece4}
.mitem.on{color:#e8624a !important}
.mitem-badge{background:#e8624a;color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;min-width:16px;text-align:center;flex-shrink:0}
.mitem-arrow{font-size:14px;color:#5a5a7a;flex-shrink:0}
.sub-panel{position:absolute;top:0;left:0;width:100%;height:100%;background:#1c1c2a;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;overflow-y:auto}
.sub-panel.open{transform:translateX(0)}
.sub-back{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid rgba(232,98,74,.15);background:none;border-top:none;border-left:none;border-right:none;color:#e8624a;font-size:13px;cursor:pointer;font-family:sans-serif;width:100%;text-align:left}
.menu-spacer{flex:1;min-height:16px}
body.light #side-menu{background:#fff;border-right-color:rgba(74,74,106,.15)}
body.light .mitem{color:#4a4a6a !important}
body.light .mitem:hover,body.light .mitem.on{background:rgba(232,98,74,.08);color:#1a1a2e !important}
body.light .sub-panel,body.light .menu-header{background:#fff}
body.light .sub-back{color:#e8624a !important}
body.light .menu-section{border-bottom-color:rgba(74,74,106,.08)}
body.light .menu-section-label{color:#9090b0 !important}
#topbar{background:#1c1c2a;border-bottom:1px solid rgba(232,98,74,0.25);display:flex;align-items:center;justify-content:space-between;padding:0 1rem;height:52px;flex-shrink:0}
#navtabs{display:none}
.ntab{flex:1;min-width:70px;padding:11px 4px;border:none;background:none;color:#b0adc4;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;font-family:sans-serif;white-space:nowrap}
.ntab.on{color:#e8624a;border-bottom-color:#e8624a}
.nbadge{background:#c0392b;color:#fff;font-size:9px;border-radius:10px;padding:1px 5px;margin-left:3px;vertical-align:middle}
#main{padding:1rem;max-width:720px;margin:0 auto;width:100%;flex:1}
.modal-bg{background:rgba(0,0,0,.8);padding:1rem;display:flex;align-items:flex-start;justify-content:center}
.modal{background:#1f1f2e;border:1px solid rgba(232,98,74,0.25);border-radius:14px;width:100%;max-width:600px;padding:1.4rem;margin:0 auto;max-height:88vh;overflow-y:auto}
.modal-title{font-size:17px;color:#e8624a;margin-bottom:1.2rem}
#login-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:linear-gradient(160deg,#14141e 60%,#2a1008 100%)}
.login-card{background:#1f1f2e;border:1px solid rgba(232,98,74,0.25);border-radius:14px;padding:2rem;width:100%;max-width:400px}
.login-card .hint{color:#bbb;white-space:pre-line}
.team-block{background:rgba(255,255,255,.06);border:1px solid rgba(232,98,74,0.2);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.warn-box{background:rgba(200,100,50,.12);border:1px solid rgba(200,100,50,.3);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:12px;color:#e8a87c}
.call-bar{background:rgba(41,128,185,.12);border:1px solid rgba(41,128,185,.3);border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.notif-item{background:rgba(200,169,110,.08);border:1px solid rgba(232,98,74,0.25);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px}
@media(max-width:480px){
  .dg{grid-template-columns:1fr}
  #topbar{padding:0 .6rem;height:48px}
  #topbar .tb-name{display:none}
  #main{padding:.65rem}
  .modal{padding:1rem}
  .modal-bg{padding:.5rem;align-items:flex-end}
  .modal{border-bottom-left-radius:0;border-bottom-right-radius:0;max-height:92vh}
  .btn{font-size:12px;padding:8px 14px}
  .cal-grid{font-size:10px}
  .cd{min-height:44px;padding:2px 3px}
  .cev{font-size:8px;padding:1px 3px}
  .ntab{font-size:11px;padding:10px 3px;min-width:56px}
  .rh{gap:6px}
  .mfooter{gap:6px}
}
/* -- TOAST -- */
#toast-container{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:min(340px,90vw)}
.toast{background:#1f1f2e;border:1px solid rgba(232,98,74,.35);border-radius:10px;padding:10px 16px;font-size:13px;color:#f0ece4;box-shadow:0 4px 20px rgba(0,0,0,.5);opacity:0;transform:translateY(12px);transition:opacity .25s,transform .25s;pointer-events:none;text-align:center;max-width:100%}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{border-color:rgba(39,174,96,.4);color:#2ecc71}
.toast.error{border-color:rgba(192,57,43,.5);color:#e74c3c}
.toast.info{border-color:rgba(41,128,185,.4);color:#87b7e8}
/* -- SAVE INDICATOR -- */
#save-dot{position:fixed;top:14px;right:14px;width:8px;height:8px;border-radius:50%;background:#27ae60;opacity:0;transition:opacity .3s;z-index:8000;pointer-events:none}
#save-dot.saving{background:#e8624a;opacity:1;animation:pulse-dot 1s infinite}
#save-dot.saved{background:#27ae60;opacity:1}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
/* -- ONBOARDING OVERLAY -- */
.ob-overlay{position:fixed;inset:0;background:transparent;z-index:10000;display:flex;align-items:flex-start;justify-content:flex-end;padding:1rem;pointer-events:none}
.ob-card{background:var(--ob-bg,#1f1f2e);border:2px solid rgba(232,98,74,.6);border-radius:16px;width:100%;max-width:320px;padding:1.25rem;position:relative;pointer-events:all;box-shadow:0 8px 40px rgba(0,0,0,.5);margin-top:4rem}
.ob-step-dots{display:flex;gap:8px;justify-content:center;margin-bottom:1.5rem}
.ob-dot{width:10px;height:10px;border-radius:50%;background:rgba(232,98,74,.25);transition:background .2s}
.ob-dot.on{background:#e8624a}
.ob-icon{font-size:2.5rem;text-align:center;margin-bottom:.75rem}
.ob-title{font-size:20px;color:#e8624a;font-weight:500;text-align:center;margin-bottom:.5rem;letter-spacing:.4px}
.ob-body{font-size:13px;color:#b0adc4;text-align:center;line-height:1.75;margin-bottom:1.5rem}
.ob-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ob-skip{font-size:12px;color:#b0adc4;cursor:pointer;background:none;border:none;font-family:sans-serif;padding:4px}
.ob-skip:hover{color:#f0ece4}
.ob-dsa{display:flex;align-items:center;gap:6px;font-size:12px;color:#b0adc4;cursor:pointer;margin-top:.8rem}

// Wraps click handlers so errors show a toast instead of silently failing
function safe(fn){
  return function(){
    try { fn.apply(this, arguments); }
    catch(e){
      console.error('Handler error:', e);
      showToast('Something went wrong: '+(e.message||'unknown error'), 'error');
    }
  };
}

// -- TOAST ------------------------------------------------------------------
function showToast(msg, type, duration){
  var tc=document.getElementById('toast-container');
  if(!tc) return;
  var t=document.createElement('div');
  t.className='toast'+(type?' '+type:'');
  t.textContent=msg;
  tc.appendChild(t);
  // Trigger transition
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ t.classList.add('show'); });
  });
  setTimeout(function(){
    t.classList.remove('show');
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 300);
  }, duration||2800);
}

// -- ICS / CALENDAR EXPORT --------------------------------------------------
function icsDate(dateStr, timeStr){
  // dateStr: 'YYYY-MM-DD', timeStr: '10:00 AM' or '10:00'
  var d = dateStr.replace(/-/g,'');
  if(!timeStr) return d;
  // Parse 12h or 24h time
  var m = timeStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if(!m) return d;
  var h=parseInt(m[1]), mn=parseInt(m[2]);
  var ampm=(m[3]||'').toUpperCase();
  if(ampm==='PM' && h!==12) h+=12;
  if(ampm==='AM' && h===12) h=0;
  return d+'T'+String(h).padStart(2,'0')+String(mn).padStart(2,'0')+'00';
}

function buildICS(ev){
  var dtStart = icsDate(ev.date, ev.startTime);
  // Default duration 2 hours if no end time
  var dtEnd   = dtStart; // same-day; add 2h
  if(dtStart.indexOf('T')>=0){
    var h2 = parseInt(dtStart.slice(9,11))+2;
    dtEnd = dtStart.slice(0,9)+String(h2%24).padStart(2,'0')+dtStart.slice(11);
  }
  var uid_val = 'thewell-'+ev.id+(ev.instanceKey||ev.date||'')+'-'+Date.now()+'@missionportal';
  var desc = [];
  if(ev.rtp)  desc.push('Report Time (Production): '+ev.rtp);
  if(ev.rtm)  desc.push('Report Time (Mission): '+ev.rtm);
  if(ev.dcw)  desc.push('Dress Code (Worship): '+ev.dcw);
  if(ev.dcm)  desc.push('Dress Code (Mission): '+ev.dcm);
  if((ev.teams||[]).length) desc.push('Teams: '+(ev.teams.map(function(t){return t.name;}).join(', ')));

  function esc(s){ return (s||'').replace(/[\\;,]/g, function(c){ return '\\'+c; }).replace(/\n/g,'\\n'); }

  var lines=[
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//The Well of Iowa//Mission Portal//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:'+uid_val,
    'DTSTAMP:'+icsDate(new Date().toISOString().split('T')[0]),
    'DTSTART'+(dtStart.indexOf('T')>=0?'':';VALUE=DATE')+':'+dtStart,
    'DTEND'+(dtEnd.indexOf('T')>=0?'':';VALUE=DATE')+':'+dtEnd,
    'SUMMARY:'+esc(ev.title+(ev.isRec?' (Recurring)':'')),
    'LOCATION:'+esc(ev.location||''),
    'DESCRIPTION:'+esc(desc.join('\\n')||'The Well of Iowa Mission Event'),
    'END:VEVENT',
    'END:VCALENDAR'
  ];
  return lines.join('\r\n');
}

function downloadICS(ev){
  try {
    var ics = buildICS(ev);
    var blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href   = url;
    a.download = (ev.title||'event').replace(/[^a-zA-Z0-9_\- ]/g,'_')+'_'+(ev.date||'').replace(/-/g,'')+'.ics';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
    showToast('Calendar file downloaded! Open it to add to Google/Apple Calendar.', 'success', 3500);
  } catch(e){
    showToast('Could not generate calendar file: '+e.message, 'error');
  }
}

function showOnboarding(onDone){
  var step=0;
  var dontShow=false;

  var overlay=document.createElement('div');
  overlay.className='ob-overlay';

  function render_ob(){
    overlay.innerHTML='';
    var card=document.createElement('div');
    card.className='ob-card';

    // Step dots
    var dots=document.createElement('div');
    dots.className='ob-step-dots';
    ONBOARDING_STEPS.forEach(function(_,i){
      var d=document.createElement('div');
      d.className='ob-dot'+(i===step?' on':'');
      dots.appendChild(d);
    });
    card.appendChild(dots);

    var s=ONBOARDING_STEPS[step];
    var icon=document.createElement('div');
    icon.className='ob-icon';
    icon.textContent=s.icon;
    card.appendChild(icon);

    var title=document.createElement('p');
    title.className='ob-title';
    title.textContent=s.title;
    card.appendChild(title);

    var body=document.createElement('p');
    body.className='ob-body';
    body.textContent=s.body;
    card.appendChild(body);

    var footer=document.createElement('div');
    footer.className='ob-footer';

    var skip=document.createElement('button');
    skip.className='ob-skip';
    skip.textContent='Skip';
    skip.addEventListener('click', function(){ finishOnboarding(); });
    footer.appendChild(skip);

    var nextBtn=document.createElement('button');
    nextBtn.className='btn bg';
    var isLast=(step===ONBOARDING_STEPS.length-1);
    nextBtn.textContent=isLast ? 'Get Started ->' : 'Next ->';
    nextBtn.addEventListener('click', function(){
      if(isLast){ finishOnboarding(); }
      else { step++; var ns=ONBOARDING_STEPS[step]; if(ns&&ns.tab&&S.user){S.tab=ns.tab;if(ns.tab==='issues'){if(ns.title.toLowerCase().indexOf('kaizen')>=0)S.improveTab='kaizen';else if(ns.title.toLowerCase().indexOf('planning')>=0)S.improveTab='planning';else S.improveTab='issues';}render();} render_ob(); }
    });
    footer.appendChild(nextBtn);
    card.appendChild(footer);

    // Don't show again
    var dsa=document.createElement('label');
    dsa.className='ob-dsa';
    var dsaCb=document.createElement('input');
    dsaCb.type='checkbox';
    dsaCb.checked=dontShow;
    dsaCb.addEventListener('change', function(){ dontShow=dsaCb.checked; });
    dsa.appendChild(dsaCb);
    dsa.appendChild(document.createTextNode("Don't show this again"));
    card.appendChild(dsa);

    overlay.appendChild(card);
  }

  function finishOnboarding(){
    if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
    if(dontShow && S.user){
      // Save preference to Firestore per-user
      db.collection('appState').doc('onboarding_'+String(S.user.uid||S.user.id))
        .set({dismissed:true, ts:Date.now()})
        .catch(function(e){ console.warn('Onboarding pref save failed:', e); });
    }
    if(onDone) onDone();
  }

  render_ob();
  document.body.appendChild(overlay);
}

function checkAndShowOnboarding(onDone){
  if(!S.user){ if(onDone) onDone(); return; }
  if(isPublicUser(S.user)||(S.user.roles||[]).indexOf('unverified')>=0){ if(onDone) onDone(); return; }
  var docId='onboarding_'+String(S.user.uid||S.user.id);
  db.collection('appState').doc(docId).get()
    .then(function(doc){
      if(doc.exists && doc.data().dismissed){
        if(onDone) onDone();
      } else {
        showOnboarding(onDone);
      }
    })
    .catch(function(){
      // If Firestore fails, just skip onboarding gracefully
      if(onDone) onDone();
    });
}

var DB_SAVING = false;
var SAVE_QUEUE = false;
var STATE_LOADED = false;

function applyTheme(t){THEME=t;localStorage.setItem('mtp_theme',t);document.body.classList.toggle('light',t==='light');} // guard: don't save until Firestore data is loaded

var _saveTimer=null;
var _realSave=null;
function save(){
  if(!STATE_LOADED) return;
  if(_saveTimer){ clearTimeout(_saveTimer); }
  _saveTimer=setTimeout(function(){ _saveTimer=null; _doSave(); }, 250);
}
function _doSave(){
  // Never save before data is loaded from Firestore -- prevents overwriting real data
  // Strip null/empty IDs from task assignees and group members before saving
  (S.tasks||[]).forEach(function(t){
    t.assignees=(t.assignees||[]).filter(function(x){return x!=null&&x!==''&&String(x)!=='null'&&String(x)!=='undefined';});
    if(!t.lead||String(t.lead)==='null') t.lead=(t.assignees||[])[0]||null;
  });
  (S.groups||[]).forEach(function(g){
    g.members=(g.members||[]).filter(function(x){return x!=null&&x!==''&&String(x)!=='null'&&String(x)!=='undefined'&&UN(x)!=='?';});
  });
  // Debounce - if already saving, queue one more
  if(DB_SAVING){ SAVE_QUEUE=true; return; }
  DB_SAVING = true;
  saveDotSaving();
  var uid = S.user ? S.user.uid : null;
  if(!uid){ DB_SAVING=false; return; }

  // Save the full state as a single document (simple, works well at this scale)
  var payload = {
    // tab is session state -- not saved to Firestore
    calY: S.calY,
    calM: S.calM,
    templates: S.templates,
    overrides: S.overrides,
    groups: S.groups,
    tasks: S.tasks,
    rooms: S.rooms,
    reports: S.reports,
    notifs: S.notifs,
    pendingDel: S.pendingDel,
    auditLog: S.auditLog||[],
    announcements: S.announcements||[],
    reorderItems: S.reorderItems||[],
    productionItems: S.productionItems||[],
    setlists: S.setlists||[],
    inputLists: S.inputLists||{sunday:[],event:[],wh2:[]},
    merch: S.merch,
    avail: S.avail||{},
    taskTemplates: S.taskTemplates||[],
    issues: S.issues||[],
    kaizen: S.kaizen||[],
    planningBoards: S.planningBoards||[],
    musicDb: S.musicDb||[],
    publicPages: S.publicPages||{},
    connectConfig: S.connectConfig||{socialLinks:[],leadershipTeam:[]},
    postsConfig: S.postsConfig||{pages:[]},
    lastSeenPosts: S.lastSeenPosts||{},
    nEv: S.nEv,
    nTask: S.nTask,
    nGroup: S.nGroup,
    nRoom: S.nRoom,
    nReport: S.nReport,
    nNotif: S.nNotif,
    COMMON_TEAMS: COMMON_TEAMS,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  db.collection('appState').doc('main').set(payload, {merge:true})
    .then(function(){
      DB_SAVING = false;
      saveDotSaved();
      if(SAVE_QUEUE){ SAVE_QUEUE=false; save(); }
      // After write, the listener will fire with our own data back -- let it process

}

    db.collection('appState').doc('users').get().then(function(udoc){
      if(udoc.exists && udoc.data().list){ USERS = udoc.data().list; }

var unsubscribe = null;
function startRealtimeListener(){
  if(unsubscribe) unsubscribe();
  unsubscribe = db.collection('appState').doc('main').onSnapshot(function(doc){
    if(!doc.exists||!S.user) return;
    var d = doc.data();
    var needRender = false;
    ['templates','overrides','groups','tasks','rooms','reports','notifs','pendingDel','merch','auditLog','announcements','reorderItems','setlists','inputLists','productionItems','avail','taskTemplates','issues','kaizen','planningBoards','musicDb','publicPages','connectConfig','postsConfig','lastSeenPosts',
     'nEv','nTask','nGroup','nRoom','nReport','nNotif'].forEach(function(k){
      if(d[k]!==undefined){
        var oldStr = JSON.stringify(S[k]);
        var newStr = JSON.stringify(d[k]);
        if(oldStr!==newStr){ S[k]=d[k]; needRender=true; }
      }
    });
    // Clean null/invalid/unresolvable members from groups every time data arrives
    var groupsDirty=false;
    (S.groups||[]).forEach(function(g){
      var before=(g.members||[]).length;
      g.members=(g.members||[]).filter(function(x){
        if(x==null||x===''||String(x)==='null'||String(x)==='undefined') return false;
        // Also remove IDs that can't be resolved to a user
        return UN(x)!=='?';
      });
      if(g.members.length!==before) groupsDirty=true;
    });
    if(groupsDirty){ needRender=true; save(); } // persist cleaned data back to Firestore
    if(d.COMMON_TEAMS){ COMMON_TEAMS=d.COMMON_TEAMS; }
    if(needRender) render();
  }, function(e){ console.warn('Listener error:',e); });

  // Also listen for user list changes
  db.collection('appState').doc('users').onSnapshot(function(doc){
    if(doc.exists&&doc.data().list){
      USERS = doc.data().list;
      if(S.user) render();
    }
  });
}

var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function getInstances(tmpl,from,to){
  var list=[];
  if(!tmpl.isRec){
    if(tmpl.date>=from&&tmpl.date<=to){
      var baseKey=String(tmpl.id)+'_'+tmpl.date;
      var baseOv=S.overrides[baseKey]||{};
      if(!baseOv.deleted) list.push(Object.assign({},tmpl,baseOv,{instanceKey:baseKey,templateId:tmpl.id,_dayIndex:0,_dayLabel:'Day 1'}));
    }
    // Extra days for multi-day non-recurring events
    (tmpl.extraDays||[]).forEach(function(ed,di){
      if(ed.date>=from&&ed.date<=to){
        var edKey=String(tmpl.id)+'_'+ed.date+'_d'+(di+2);
        var edOv=S.overrides[edKey]||{};
        if(!edOv.deleted){
          list.push(Object.assign({},tmpl,{
            date:ed.date,
            startTime:ed.startTime||tmpl.startTime,
            location:ed.location||tmpl.location,
            instanceKey:edKey,
            templateId:tmpl.id,
            _dayIndex:di+1,
            _dayLabel:'Day '+(di+2),
            _isExtraDay:true
          },edOv));
        }
      }
    });
    return list;
  }
  var fDate=new Date(from+'T12:00:00'), tDate=new Date(to+'T12:00:00');
  var cap=tmpl.recEnd?new Date(tmpl.recEnd+'T12:00:00'):tDate;
  if(cap>tDate) cap=tDate;
  var cur=new Date(fDate);
  while(cur.getDay()!==tmpl.recDay) cur.setDate(cur.getDate()+1);
  var n=0;
  while(cur<=cap&&n<104){
    var ds=cur.toISOString().split('T')[0];
    var key=tmpl.id+'_'+ds;
    var ov=S.overrides[key]||{};
    if(!ov.deleted){
      var inst=Object.assign({},tmpl,ov,{date:ds,instanceKey:key,templateId:tmpl.id});
      if(!inst.teams) inst.teams=[];
      list.push(inst);
    }
    var step=tmpl.recur==='weekly'?7:tmpl.recur==='biweekly'?14:30;
    cur.setDate(cur.getDate()+step);
    n++;
  }
  return list;
}

function allInstances(from,to){
  var all=[];
  S.templates.forEach(function(t){ all=all.concat(getInstances(t,from,to)); });
  all.sort(function(a,b){return a.date.localeCompare(b.date);});
  return all;
}

function getOrCreateOverride(tmplId,date){
  var key=tmplId+'_'+date;
  if(!S.overrides[key]){
    var tmpl=S.templates.find(function(t){return t.id===tmplId;});
    if(!tmpl)return null;
    S.overrides[key]=JSON.parse(JSON.stringify(tmpl));
    S.overrides[key].date=date;
    S.overrides[key].instanceKey=key;
    S.overrides[key].templateId=tmplId;
  }
  return S.overrides[key];
}


// -- AVAILABILITY HELPERS ------------------------------------------------------
function pad2(n){return String(n).padStart(2,'0');}
function sameAvailId(a,b){
  if(String(a)===String(b)) return true;
  // Resolve through USERS as fallback for numeric vs UID mismatches
  var ua=USERS.find(function(u){return String(u.id)===String(a)||String(u.uid)===String(a);});
  var ub=USERS.find(function(u){return String(u.id)===String(b)||String(u.uid)===String(b);});
  var ra=ua?String(ua.uid||ua.id):String(a);
  var rb=ub?String(ub.uid||ub.id):String(b);
  return ra===rb;
}

function getAvail(ev,uid){
  if(!S||!S.avail||!ev) return null;
  var u=String(uid);
  var ik=(ev.instanceKey||(ev.id+'_'+ev.date))+'::'+u;
  if(S.avail[ik]) return S.avail[ik];
  var tk='template_'+String(ev.templateId||ev.id)+'::'+u;
  return S.avail[tk]||null;
}

function setAvail(ev,uid,status,note){
  if(!S.avail) S.avail={};
  var u=String(uid);
  var key=(ev.instanceKey||(ev.id+'_'+ev.date))+'::'+u;
  if(status===null){ delete S.avail[key]; }
  else{ S.avail[key]={status:status,note:note||'',uid:u,ts:Date.now()}; }
}

function isUnavailable(ev,uid){ var r=getAvail(ev,uid); return r&&r.status==='no'; }
function availColor(s){ return ({yes:'#27ae60',no:'#c0392b',partial:'#e67e22',tbd:'#2980b9'})[s]||'#b0adc4'; }
function availLabel(s){ return ({yes:'Available',no:'Not Available',partial:'Partial',tbd:'TBD'})[s]||'\u2014'; }

function availBadge(s){
  if(!s) return null;
  var icon=({yes:'\u2713',no:'\u2717',partial:'\u25d1',tbd:'?'})[s]||'?';
  return SP({style:{display:'inline-flex',alignItems:'center',justifyContent:'center',
    width:'16px',height:'16px',borderRadius:'50%',fontSize:'10px',fontWeight:'700',
    background:availColor(s),color:'#fff',flexShrink:'0',marginLeft:'4px'}},icon);
}

function pendingAvailEvents(){
  if(!S||!S.user) return [];
  try{
    var uid=String(S.user.id||S.user.uid||'');
    if(!uid) return [];
    var far=new Date(); far.setDate(far.getDate()+365);
    var all=allInstances(TODAY(),far.toISOString().split('T')[0]);
    var seen={};
    var result=all.filter(function(ev){
      var assigned=(ev.users||[]).some(function(x){return sameAvailId(x,uid);});
      if(!assigned) return false;
      if(ev.coordEnabled===false) return false;
      var r=getAvail(ev,uid);
      if(r&&r.status&&r.status!=='tbd') return false;
      var tk=ev._isExtraDay ? String(ev.instanceKey) : String(ev.templateId||ev.id);
      if(seen[tk]) return false;
      seen[tk]=true;
      return true;
    });
    return result;
  }catch(e){ console.warn('pendingAvailEvents:',e); return []; }
}

  });

  footer.appendChild(BTN({cls:'btn bo',click:closeM},'Done'));
  if(idx>0){
    var prevBtn=BTN({cls:'btn bo bsm'});prevBtn.textContent='\u2190 Prev';
    (function(i){prevBtn.addEventListener('click',safe(function(){S.modal={type:'dashAvail',events:events,idx:i-1};render();}));})(idx);

  }
  mo.appendChild(footer);
}

// -- DOM BUILDER ------------------------------------------------------------
function mk(tag,props,kids){
  var e=document.createElement(tag);
  if(props) Object.keys(props).forEach(function(k){
    var v=props[k];
    if(k==='cls') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k==='click') e.addEventListener('click',v);
    else if(k==='change') e.addEventListener('change',v);
    else if(k==='input') e.addEventListener('input',v);
    else if(k==='keydown') e.addEventListener('keydown',v);
    else if(k==='style'&&typeof v==='object') Object.assign(e.style,v);
    else e[k]=v;
  });
  function app(x){
    if(x==null)return;
    if(Array.isArray(x)){x.forEach(app);return;}
    if(x instanceof Node){e.appendChild(x);return;}
    e.appendChild(document.createTextNode(String(x)));
  }
  app(kids);
  return e;
}
function D(p,c){return mk('div',p,c);}
function P(p,c){return mk('p',p,c);}
function SP(p,c){return mk('span',p,c);}
function BTN(p,c){return mk('button',p,c);}
function INP(p){return mk('input',p);}
function SEL(p,c){return mk('select',p,c);}
function OPT(p,c){return mk('option',p,c);}
function LBL(p,c){return mk('label',p,c);}
function TA(p,c){return mk('textarea',p,c);}
function HR(){return mk('hr',{cls:'divider'});}
function FLD(l,el){return D({cls:'f'},[LBL({},l),el]);}

// A typeable dropdown that filters as you type
function ComboBox(placeholder, options, onSelect, style) {
  var wrap = D({style:{position:'relative',marginBottom:'.5rem'}});
  var inp = INP({type:'text', placeholder:placeholder||'Search...'});
  inp.style.cssText = 'width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(232,98,74,.3);border-radius:7px;padding:8px 12px;color:#f0ece4;font-size:13px;font-family:sans-serif;outline:none;' + (style||'');
  var drop = D({style:{display:'none',position:'absolute',top:'100%',left:'0',right:'0',zIndex:'200',background:'#1f1f2e',border:'1px solid rgba(232,98,74,.3)',borderRadius:'7px',maxHeight:'200px',overflowY:'auto',boxShadow:'0 4px 16px rgba(0,0,0,.5)'}});
  wrap.appendChild(inp); wrap.appendChild(drop);

  function renderDrop(filter) {
    drop.innerHTML = '';
    var q = (filter||'').toLowerCase().trim();
    var shown = q ? options.filter(function(o){return o.label.toLowerCase().includes(q);}) : options;
    if(!shown.length) { drop.style.display='none'; return; }
    shown.forEach(function(o) {
      var item = D({style:{padding:'8px 12px',cursor:'pointer',fontSize:'13px',color: o.disabled?'#5a5a6a':'#f0ece4',borderBottom:'1px solid rgba(232,98,74,.1)'}});
      if(o.disabled) {
        item.textContent = o.label;
        item.style.color = '#e8624a';
        item.style.fontSize = '11px';
        item.style.textTransform = 'uppercase';
        item.style.letterSpacing = '.4px';
        item.style.cursor = 'default';
        item.style.background = 'rgba(232,98,74,.06)';
      } else {
        item.textContent = o.label;
        item.addEventListener('mousedown', function(e) {
          e.preventDefault();
          inp.value = '';
          drop.style.display = 'none';
          onSelect(o.value, o.label);
        });
        item.addEventListener('mouseover', function(){ item.style.background='rgba(232,98,74,.12)'; });
        item.addEventListener('mouseout', function(){ item.style.background=''; });
      }
      drop.appendChild(item);
    });
    drop.style.display = 'block';
  }

  inp.addEventListener('focus', function(){ renderDrop(inp.value); });
  inp.addEventListener('input', function(){ renderDrop(inp.value); });
  inp.addEventListener('blur', function(){ setTimeout(function(){ drop.style.display='none'; }, 150); });
  return wrap;
}

// -- TASK TEMPLATES VIEW (admin panel) ----------------------------------------
function generateEventTasks(tmpl, eventTemplate) {
  var tasks = [];
  var eventDate = eventTemplate.date;
  var tid = eventTemplate.id;
  (tmpl.items||[]).forEach(function(item) {
    // Compute due date
    var due = null;
    if(eventDate && item.daysBefore) {
      var d = new Date(eventDate + 'T12:00:00');
      d.setDate(d.getDate() - (item.daysBefore||0));
      due = d.toISOString().split('T')[0];
    }
    // Resolve assignees
    var assignees = [];
    var roles = item.assignToRoles||(item.assignToRole?[item.assignToRole]:[]);
    roles.forEach(function(role){
      if(role.slice(0,6)==='group:'){
        var gid=role.slice(6);
        var grp=(S.groups||[]).find(function(g){return String(g.id)===gid;});
        if(grp)(grp.members||[]).forEach(function(uid){if(assignees.indexOf(uid)<0)assignees.push(uid);});
      } else if(role.slice(0,5)==='user:') {
        var uid3=role.slice(5); if(assignees.indexOf(uid3)<0) assignees.push(uid3);
      } else if(role==='leaders') {
        (eventTemplate.teams||[]).forEach(function(t){ (t.leaders||[]).forEach(function(id){if(assignees.indexOf(id)<0)assignees.push(id);}); });
      } else if(role==='all') {
        (eventTemplate.users||[]).forEach(function(id){if(assignees.indexOf(id)<0)assignees.push(id);});
      }
    });
    if(assignees.length) {
      tasks.push({
        id: S.nTask++,
        assignees: assignees,
        lead: assignees[0],
        by: S.user.id,
        title: item.title,
        status: 'pending',
        evId: null,
        evDate: eventDate,
        evTemplateId: tid,
        dueDate: due,
        overdueNotified: false
      });
    }
  });
  return tasks;
}

function hexToRgb(hex){
  var r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r?parseInt(r[1],16)+','+parseInt(r[2],16)+','+parseInt(r[3],16):'180,173,196';
}

  {id:'idea',     label:'Ideas',           color:'#2980b9'},
  {id:'review',   label:'Under Review',    color:'#8e44ad'},
  {id:'action',   label:'Action Plan',     color:'#e67e22'},
  {id:'complete', label:'Completed',       color:'#27ae60'}
];
var TASK_SECTIONS = [
  {id:'production', label:'Production', color:'#e8624a'},
  {id:'teamcare',   label:'Team Care',  color:'#2980b9'},
  {id:'merch',      label:'Merch',      color:'#8e44ad'},
  {id:'network',    label:'Network',    color:'#27ae60'},
  {id:'media',      label:'Media',      color:'#e67e22'}
];
var KAIZEN_CATS = ['Equipment','Instruments','Sound Balance','Coordination','Tech','Stream / Capture','Other'];

function kaizenView(){
  var u=S.user, w=D({});
  if(!S.kaizen) S.kaizen=[];
  var hdr=D({cls:'rh'});
  hdr.appendChild(P({style:{fontSize:'14px',fontWeight:'600',color:'#f0ece4'}},'Kaizen Board'));
  hdr.appendChild(BTN({cls:'btn bg bsm',click:safe(function(){S.modal={type:'editKaizen',item:null};render();})},'+ Submit Idea'));
  w.appendChild(hdr);
  w.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'1rem'}},'Continuous improvement. Vote to surface the best ideas. Admins move cards through the pipeline.'));

  var board=D({style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(210px,1fr))',gap:'10px'}});
  KAIZEN_COLS.forEach(function(col){
    var col_el=D({style:{background:'rgba(255,255,255,.03)',border:'1px solid rgba(232,98,74,.15)',borderRadius:'10px',padding:'10px'}});
    var col_hdr=D({style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'10px'}});
    var dot=SP({style:{width:'10px',height:'10px',borderRadius:'50%',background:col.color,display:'inline-block',flexShrink:'0'}});
    col_hdr.appendChild(dot);
    col_hdr.appendChild(SP({style:{fontWeight:'600',fontSize:'13px',color:'#f0ece4'}},col.label));
    var count=(S.kaizen||[]).filter(function(x){return x.stage===col.id;}).length;
    if(count) col_hdr.appendChild(SP({style:{marginLeft:'auto',fontSize:'11px',color:'#b0adc4'}},String(count)));
    col_el.appendChild(col_hdr);

    var items=(S.kaizen||[]).filter(function(x){return x.stage===col.id;}).slice().sort(function(a,b){return (b.votes||0)-(a.votes||0);});
    if(!items.length) col_el.appendChild(P({style:{fontSize:'11px',color:'#5a5a6a',textAlign:'center',padding:'12px 0',fontStyle:'italic'}},'No items'));

    items.forEach(function(item){
      var card=D({style:{background:'rgba(255,255,255,.05)',border:'1px solid rgba(232,98,74,.2)',borderRadius:'8px',padding:'9px 10px',marginBottom:'7px'}});
      var catTag=SP({style:{fontSize:'10px',background:'rgba(232,98,74,.15)',color:'#e8624a',borderRadius:'4px',padding:'1px 6px',marginBottom:'5px',display:'inline-block'}},item.category||'Other');
      card.appendChild(catTag);
      card.appendChild(P({style:{fontSize:'13px',fontWeight:'500',color:'#f0ece4',marginBottom:'4px',lineHeight:'1.4'}},item.title));
      if(item.description){
        var descFull=item.description;
        var descShort=descFull.slice(0,80);
        var needsTrunc=descFull.length>80;
        var descEl=P({style:{fontSize:'11px',color:'#b0adc4',marginBottom:'4px',lineHeight:'1.5'}},descShort+(needsTrunc?'...':''));
        card.appendChild(descEl);
        if(needsTrunc){
          var expanded=false;
          var toggleBtn=SP({style:{fontSize:'10px',color:'#e8624a',cursor:'pointer',display:'block',marginTop:'-2px',marginBottom:'4px'}},'Show more');
          (function(el,full,short,btn){
            btn.addEventListener('click',safe(function(e){
              e.stopPropagation();
              expanded=!expanded;
              el.textContent=expanded?full:short+'...';
              btn.textContent=expanded?'Show less':'Show more';
            }));
          })(descEl,descFull,descShort,toggleBtn);
          card.appendChild(toggleBtn);
        }
      }
      if(item.linkedIssueId){
        var lnk=S.issues&&S.issues.find(function(x){return x.id===item.linkedIssueId;});
        if(lnk) card.appendChild(P({style:{fontSize:'10px',color:'#b0adc4',marginBottom:'4px'}},'\u2197 From: '+lnk.title.slice(0,30)));
      }
      // Active action plan summary
      var ap=kaizenActiveAP(item);
      if(ap){
        var apBox=D({style:{background:'rgba(232,152,0,.08)',border:'1px solid rgba(232,152,0,.2)',borderRadius:'6px',padding:'6px 8px',marginBottom:'6px',fontSize:'11px',color:'#f39c12'}});
        apBox.appendChild(P({},'\u2022 Action Plan v'+String((item.actionPlans||[]).length)+': '+(ap.statement||'').slice(0,50)));
        var done=(ap.steps||[]).filter(function(s){return s.done;}).length;
        apBox.appendChild(P({},done+' / '+(ap.steps||[]).length+' steps complete'));
        card.appendChild(apBox);
      }
      // Vote row
      var voteRow=D({style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:'6px'}});
      var votes=item.votes||0;
      var myVote=(item.voters||[]).some(function(v){return sameId(v,u.id);});
      var voteBtn=BTN({cls:'btn bsm'});
      voteBtn.style.cssText='background:'+(myVote?'rgba(41,128,185,.3)':'transparent')+';color:'+(myVote?'#87b7e8':'#b0adc4')+';border:1px solid rgba(41,128,185,.3);font-size:11px;padding:3px 8px';
      voteBtn.textContent='\u25b2 '+votes;
      (function(it){voteBtn.addEventListener('click',safe(function(e){
        e.stopPropagation();
        if(!it.voters) it.voters=[];
        var idx=it.voters.findIndex(function(v){return sameId(v,u.id);});
        if(idx>=0){it.voters.splice(idx,1);it.votes=Math.max(0,(it.votes||0)-1);}
        else{it.voters.push(String(u.id));it.votes=(it.votes||0)+1;}
        save();render();
      }));})(item);
      voteRow.appendChild(voteBtn);
      voteRow.appendChild(SP({style:{fontSize:'10px',color:'#5a5a6a'}},UN(item.submitter)));
      card.appendChild(voteRow);

      if(isAdmin(u)){
        var adminRow=D({style:{display:'flex',gap:'4px',marginTop:'6px',flexWrap:'wrap'}});
        var colIdx=KAIZEN_COLS.findIndex(function(c){return c.id===item.stage;});
        // Back
        if(colIdx>0&&item.stage!=='complete'){
          var backBtn=BTN({cls:'btn bsm'});
          backBtn.style.cssText='background:transparent;color:#b0adc4;border:1px solid rgba(255,255,255,.1);font-size:10px;padding:2px 6px';
          backBtn.textContent='\u2190';
          (function(it){backBtn.addEventListener('click',safe(function(e){
            e.stopPropagation();
            var ci=KAIZEN_COLS.findIndex(function(c){return c.id===it.stage;});
            var hasAP=(it.actionPlans||[]).length>0;
            if(hasAP){
              if(!confirm('Moving this back will archive the current action plan and remove its tasks. The plan history will be preserved. Continue?')) return;
              // Archive the active plan as 'archived' outcome
              var ap=kaizenActiveAP(it);
              if(ap){ap.outcome='archived';ap.outcomeNotes='Moved back before completion';ap.outcomeDate=TODAY();}
              // Remove associated kaizen tasks
              S.tasks=S.tasks.filter(function(t){return t.kaizenId!==it.id;});
            }
            it.stage=KAIZEN_COLS[ci-1].id;
            save();render();
          }));})(item);
          adminRow.appendChild(backBtn);
        }
        // Forward
        if(colIdx<KAIZEN_COLS.length-1){
          var nextCol=KAIZEN_COLS[colIdx+1];
          var fwdBtn=BTN({cls:'btn bsm'});
          fwdBtn.style.cssText='background:rgba(39,174,96,.15);color:#2ecc71;border:1px solid rgba(39,174,96,.3);font-size:10px;padding:2px 6px';
          // Moving to Action Plan opens AP modal; moving to Complete checks outcome
          if(nextCol.id==='action'){
            fwdBtn.textContent='\u2192 Plan';
            (function(it){fwdBtn.addEventListener('click',safe(function(e){e.stopPropagation();S.modal={type:'kaizenActionPlan',item:it,mode:'new'};render();}));})(item);
          } else if(nextCol.id==='complete'){
            fwdBtn.textContent='\u2192 Complete';
            (function(it){fwdBtn.addEventListener('click',safe(function(e){e.stopPropagation();S.modal={type:'kaizenOutcome',item:it,worked:true};render();}));})(item);
          } else {
            fwdBtn.textContent='\u2192 '+nextCol.label;
            (function(it,nc){fwdBtn.addEventListener('click',safe(function(e){e.stopPropagation();it.stage=nc.id;save();render();}));})(item,nextCol);
          }
          adminRow.appendChild(fwdBtn);
        }
        // New action plan if already in action stage
        if(item.stage==='action'){
          var replanBtn=BTN({cls:'btn bsm'});
          replanBtn.style.cssText='background:rgba(232,152,0,.15);color:#f39c12;border:1px solid rgba(232,152,0,.3);font-size:10px;padding:2px 6px';
          replanBtn.textContent='New Plan';
          (function(it){replanBtn.addEventListener('click',safe(function(e){e.stopPropagation();S.modal={type:'kaizenOutcome',item:it,worked:false};render();}));})(item);
          adminRow.appendChild(replanBtn);
        }
        // Edit
        var editBtn=BTN({cls:'btn bsm'});
        editBtn.style.cssText='background:transparent;color:#b0adc4;border:1px solid rgba(255,255,255,.1);font-size:10px;padding:2px 6px';
        editBtn.textContent='Edit';
        (function(it){editBtn.addEventListener('click',safe(function(e){e.stopPropagation();S.modal={type:'editKaizen',item:it};render();}));})(item);
        adminRow.appendChild(editBtn);
        // Delete
        var delBtn=BTN({cls:'btn bsm'});
        delBtn.style.cssText='background:transparent;color:#e74c3c;border:1px solid rgba(231,76,60,.3);font-size:10px;padding:2px 6px';
        delBtn.textContent='Delete';
        (function(it){delBtn.addEventListener('click',safe(function(e){e.stopPropagation();S.modal={type:'kaizenDelete',item:it};render();}));})(item);
        adminRow.appendChild(delBtn);
        card.appendChild(adminRow);
      }

      // Completed: show AP history
      if(item.stage==='complete'&&(item.actionPlans||[]).length){
        var histBtn=BTN({cls:'btn bsm',style:{marginTop:'5px',width:'100%'}});
        histBtn.style.cssText='background:transparent;color:#b0adc4;border:1px solid rgba(255,255,255,.1);font-size:10px;padding:3px 6px;width:100%';
        histBtn.textContent='View History ('+item.actionPlans.length+' plan'+(item.actionPlans.length===1?'':'s')+')';
        (function(it){histBtn.addEventListener('click',safe(function(e){e.stopPropagation();S.modal={type:'kaizenHistory',item:it};render();}));})(item);
        card.appendChild(histBtn);
      }
      col_el.appendChild(card);
    });
    board.appendChild(col_el);
  });
  w.appendChild(board);
  return w;
}

function kaizenActiveAP(item){
  var plans=item.actionPlans||[];
  return plans.length?plans[plans.length-1]:null;
}

// -- ACTION PLAN MODAL -------------------------------------------------------
function mKaizenActionPlan(mo, item, mode){
  var ap={statement:item.description||'',successCriteria:'',reviewDate:'',steps:[]};
  mo.appendChild(P({cls:'modal-title'},'Action Plan'));
  mo.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'.75rem'}},'For: '+item.title));
  var err=P({cls:'err'}), ct=D({});
  mo.appendChild(ct); mo.appendChild(err);
  mo.appendChild(D({cls:'mfooter'},[
    BTN({cls:'btn bo',click:closeM},'Cancel'),
    BTN({cls:'btn bg',click:safe(function(){
      if(!ap.statement.trim()){err.textContent='Statement required.';return;}
      if(!ap.steps.length){err.textContent='Add at least one action step.';return;}
      // Save AP with timestamp
      ap.ts=Date.now(); ap.version=(item.actionPlans||[]).length+1;
      if(!item.actionPlans) item.actionPlans=[];
      item.actionPlans.push(ap);
      item.stage='action';
      // Generate tasks for each step that has an assignee
      ap.steps.forEach(function(step){
        if(!step.assignee) return;
        S.tasks.push({
          id:S.nTask++, assignees:[String(step.assignee)], lead:String(step.assignee),
          by:S.user.id, title:step.title, status:'pending',
          evId:null, evDate:null, dueDate:step.dueDate||null,
          evTemplateId:null, kaizenId:item.id, kaizenTitle:item.title,
          overdueNotified:false, sourceGroupIds:[]
        });
        addNotif(step.assignee,'New Kaizen task: "'+step.title+'" for "'+item.title+'"');
      });
      audit('Kaizen Action Plan v'+ap.version, item.title);
      save(); closeM();
    })},'Save & Activate Plan')
  ]));

  function rebuild(){
    ct.innerHTML='';
    ct.appendChild(FLD('Opportunity / Problem Statement',TA({value:ap.statement,rows:3,input:function(e){ap.statement=e.target.value;}})));
    ct.appendChild(FLD('Success Criteria',TA({value:ap.successCriteria,rows:2,placeholder:'How will we know this worked?',input:function(e){ap.successCriteria=e.target.value;}})));
    ct.appendChild(FLD('Review Date',INP({type:'date',value:ap.reviewDate,input:function(e){ap.reviewDate=e.target.value;}})));
    ct.appendChild(HR());
    ct.appendChild(P({style:{fontSize:'13px',fontWeight:'600',color:'#e8624a',marginBottom:'6px'}},'Action Steps'));
    ap.steps.forEach(function(step,i){
      var row=D({style:{background:'rgba(255,255,255,.03)',border:'1px solid rgba(232,98,74,.15)',borderRadius:'8px',padding:'10px',marginBottom:'8px'}});
      row.appendChild(FLD('Step '+(i+1)+' Description',INP({type:'text',value:step.title||'',input:function(e){ap.steps[i].title=e.target.value;}})));
      var assigneeOpts=[{value:'',label:'Unassigned'}].concat(USERS.filter(function(u){return u.name&&u.name!=='?';}).sort(function(a,b){return (a.name||'').localeCompare(b.name||'');}).map(function(u){return {value:u.id,label:u.name};}));
      row.appendChild(FLD('Assignee',D({},[ComboBox('Assign to...',assigneeOpts,(function(ii){return function(val){ap.steps[ii].assignee=val||null;rebuild();};})(i))])));
      if(step.assignee){var u2=USERS.find(function(u){return sameId(u.id,step.assignee);});if(u2){var t2=SP({cls:'tag tagp',style:{marginTop:'-6px',marginBottom:'6px',display:'inline-block',cursor:'pointer'}},u2.name+' \u00d7');(function(ii){t2.addEventListener('click',function(){ap.steps[ii].assignee=null;rebuild();});})(i);row.appendChild(t2);}}
      row.appendChild(FLD('Due Date',INP({type:'date',value:step.dueDate||'',input:function(e){ap.steps[i].dueDate=e.target.value||null;}})));
      var rmBtn=BTN({cls:'btn br bsm',style:{marginTop:'4px'}},'Remove Step');
      (function(ii){rmBtn.addEventListener('click',function(){ap.steps.splice(ii,1);rebuild();});})(i);
      row.appendChild(rmBtn);
      ct.appendChild(row);
    });
    var addStepBtn=BTN({cls:'btn bg bsm',style:{marginBottom:'1rem'}},'+ Add Step');
    addStepBtn.addEventListener('click',function(){ap.steps.push({title:'',assignee:null,dueDate:null,done:false});rebuild();});
    ct.appendChild(addStepBtn);
  }
  rebuild();
}

// -- OUTCOME MODAL -----------------------------------------------------------
function mKaizenOutcome(mo, item, worked){
  var title=worked?'Mark as Completed':'Initiate New Action Plan';
  mo.appendChild(P({cls:'modal-title'},title));
  var ap=kaizenActiveAP(item);
  var notes='';
  var ct=D({});
  mo.appendChild(ct);
  mo.appendChild(D({cls:'mfooter'},[
    BTN({cls:'btn bo',click:closeM},'Cancel'),
    BTN({cls:'btn bg',click:safe(function(){
      if(ap){ap.outcome=worked?'worked':'failed';ap.outcomeNotes=notes;ap.outcomeDate=TODAY();}
      // Remove kaizen tasks for this item
      S.tasks=S.tasks.filter(function(t){return t.kaizenId!==item.id;});
      if(worked){
        item.stage='complete';
        item.completedDate=TODAY();
        audit('Kaizen Completed',item.title);
        save();closeM();
      } else {
        // New action plan
        save();closeM();
        S.modal={type:'kaizenActionPlan',item:item,mode:'new'};render();
      }
    })},worked?'Mark Completed':'Start New Plan')
  ]));
  if(ap){
    ct.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'.5rem'}},'Current plan: v'+ap.version+(ap.statement?' -- '+ap.statement.slice(0,60):'')));
    ct.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'.5rem'}},'Steps: '+(ap.steps||[]).filter(function(s){return s.done;}).length+' / '+(ap.steps||[]).length+' complete'));
  }
  ct.appendChild(FLD(worked?'What worked? (outcome notes)':'What failed? Why?',TA({value:'',rows:4,input:function(e){notes=e.target.value;}})));
}

// -- HISTORY MODAL -----------------------------------------------------------
function mKaizenHistory(mo, item){
  mo.appendChild(P({cls:'modal-title'},item.title+' -- History'));
  var plans=item.actionPlans||[];
  if(!plans.length){mo.appendChild(P({cls:'empty'},'No action plans logged.'));return;}
  plans.forEach(function(ap){
    var box=D({cls:'card',style:{marginBottom:'.65rem'}});
    var outColor=ap.outcome==='worked'?'#27ae60':ap.outcome==='failed'?'#e74c3c':'#b0adc4';
    var outLabel=ap.outcome==='worked'?'Worked':'failed'?'Did Not Work':'Pending';
    box.appendChild(D({cls:'rh'},[
      P({style:{fontWeight:'600',fontSize:'13px',color:'#f0ece4'}},'Plan v'+ap.version),
      SP({style:{fontSize:'11px',color:outColor}},outLabel)
    ]));
    if(ap.statement) box.appendChild(P({cls:'cs',style:{marginBottom:'6px'}},ap.statement));
    if(ap.successCriteria) box.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'4px'}},'Success criteria: '+ap.successCriteria));
    if((ap.steps||[]).length){
      box.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'4px'}},'Steps:'));
      (ap.steps||[]).forEach(function(s){
        box.appendChild(P({style:{fontSize:'12px',color:s.done?'#27ae60':'#f0ece4',marginLeft:'8px'}},
          (s.done?'\u2714 ':'\u25cb ')+s.title+(s.assignee?' ('+UN(s.assignee)+')':'')+(s.dueDate?' -- due '+FD(s.dueDate):'')));
      });
    }
    if(ap.outcomeNotes) box.appendChild(P({style:{fontSize:'12px',color:outColor,marginTop:'6px',fontStyle:'italic'}},'"'+ap.outcomeNotes+'"'));
    if(ap.outcomeDate) box.appendChild(P({cls:'cs'},FD(ap.outcomeDate)));
    mo.appendChild(box);
  });
  mo.appendChild(D({cls:'mfooter'},[BTN({cls:'btn bo',click:closeM},'Close')]));
}

// -- DELETE MODAL ------------------------------------------------------------
function mKaizenDelete(mo, item){
  mo.appendChild(P({cls:'modal-title'},'Delete Idea'));
  mo.appendChild(P({style:{fontSize:'13px',color:'#b0adc4',marginBottom:'.75rem'}},'Deleting "'+item.title+'". The submitter will be notified.'));
  var reason='';
  mo.appendChild(FLD('Reason for deletion (required)',TA({value:'',rows:3,placeholder:'Explain why this idea is being removed...',input:function(e){reason=e.target.value.trim();}})));
  var err=P({cls:'err'});
  mo.appendChild(err);
  mo.appendChild(D({cls:'mfooter'},[
    BTN({cls:'btn bo',click:closeM},'Cancel'),
    BTN({cls:'btn br',click:safe(function(){
      if(!reason){err.textContent='Please provide a reason.';return;}
      // Send message to submitter via Messages
      var room=kaizenGetOrCreateDMRoom(item.submitter);
      if(room){
        var msg={uid:S.user.id,text:'Your idea "'+item.title+'" was removed by '+S.user.name+': '+reason,ts:Date.now()};
        if(!room.msgs) room.msgs=[];
        room.msgs.push(msg);
      }
      addNotif(item.submitter,'Your Kaizen idea "'+item.title+'" was removed: '+reason);
      // Remove associated tasks
      S.tasks=S.tasks.filter(function(t){return t.kaizenId!==item.id;});

function kaizenGetOrCreateDMRoom(submitterId){
  // Find or create a DM room between admin and submitter
  var adminId=String(S.user.id);
  var subId=String(submitterId);
  if(adminId===subId) return null;
  var room=S.rooms.find(function(r){
    return r.members&&r.members.length===2&&
      r.members.some(function(x){return sameId(x,adminId);})&&
      r.members.some(function(x){return sameId(x,subId);});
  });
  if(!room){
    room={id:S.nRoom++,name:'Kaizen: '+UN(submitterId),members:[adminId,subId],msgs:[],call:false};
    S.rooms.push(room);
  }
  return room;
}

function generateExcalidrawRoom(){
  // Generate a random room ID and encryption key for Excalidraw collaboration
  var chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  function rand(len){ var s=''; for(var i=0;i<len;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }
  return {roomId:rand(20), roomKey:rand(22)};
}

    if(!roles||!roles.length) return 'Unassigned (required)';

      if(r.slice(0,5)==='user:'){var u=USERS.find(function(x){return String(x.id)===r.slice(5)||String(x.uid||'')===r.slice(5);});return u?u.name:'?';}
      if(r==='leaders') return 'All Leaders';

// -- EVENT HEALTH DASHBOARD --------------------------------------------------
function eventHealthView(){
  var w=D({});
  w.appendChild(D({cls:'rh'},[P({style:{fontSize:'14px',fontWeight:'600',color:'#f0ece4'}},'Event Health')]));
  w.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'1rem'}},'Task progress for upcoming events with task templates. Based on due dates vs today.'));

  var td=TODAY();
  // Find upcoming events with task templates
  var eventsWithTasks=S.templates.filter(function(tmpl){
    return tmpl.taskTemplateId && tmpl.date && tmpl.date>=td;
  }).slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});

  if(!eventsWithTasks.length){
    w.appendChild(D({cls:'empty'},'No upcoming events with task templates.'));
    return w;
  }

  eventsWithTasks.forEach(function(tmpl){
    // Get all tasks for this event
    var evTasks=S.tasks.filter(function(t){return t.evTemplateId===tmpl.id;});
    if(!evTasks.length) return;

    // Calculate overall health
    var anyBehind=false;
    var sectionHealth=TASK_SECTIONS.map(function(sec){
      var secTasks=evTasks.filter(function(t){
        // Match by section via task template item
        var tpl=S.taskTemplates.find(function(tt){return String(tt.id)===String(tmpl.taskTemplateId);});
        if(!tpl) return false;
        var item=(tpl.items||[]).find(function(i){return i.title===t.title&&i.section===sec.id;});
        return !!item;
      });
      if(!secTasks.length) return null;

      var total=secTasks.length;
      var done=secTasks.filter(function(t){return t.status==='done';}).length;
      var overdue=secTasks.filter(function(t){return isOverdue(t);}).length;
      var behind=secTasks.filter(function(t){return t.status==='behind';}).length;

      // Expected progress: % of tasks whose due date has passed
      var expectedDone=secTasks.filter(function(t){return t.dueDate&&t.dueDate<td;}).length;
      var expectedPct=total?Math.round(expectedDone/total*100):0;
      var actualPct=total?Math.round(done/total*100):0;
      var isLagging=actualPct<expectedPct||overdue>0;
      if(isLagging) anyBehind=true;

      return {sec:sec,total:total,done:done,overdue:overdue,behind:behind,expectedPct:expectedPct,actualPct:actualPct,isLagging:isLagging,tasks:secTasks};
    }).filter(Boolean);

    var card=D({cls:'card',style:{marginBottom:'.75rem',cursor:'pointer',borderColor:anyBehind?'rgba(192,57,43,.4)':'rgba(39,174,96,.3)'}});

    // Card header
    var hdr=D({style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'10px'}});
    var left=D({});
    left.appendChild(P({style:{fontWeight:'600',fontSize:'14px',color:'#f0ece4',marginBottom:'2px'}},tmpl.title));
    left.appendChild(P({cls:'cs'},FD(tmpl.date)+(tmpl.location?' \u00b7 '+tmpl.location:'')));
    hdr.appendChild(left);
    var badge=D({style:{background:anyBehind?'rgba(192,57,43,.15)':'rgba(39,174,96,.15)',border:'1px solid '+(anyBehind?'#e74c3c':'#27ae60'),borderRadius:'20px',padding:'3px 12px',flexShrink:'0'}});
    badge.appendChild(SP({style:{fontSize:'12px',fontWeight:'600',color:anyBehind?'#e74c3c':'#27ae60'}},anyBehind?'\u26A0 Behind Schedule':'\u2713 On Track'));
    hdr.appendChild(badge);
    card.appendChild(hdr);

    // Section health bars
    sectionHealth.forEach(function(sh){
      var row=D({style:{marginBottom:'8px'}});
      var labelRow=D({style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'3px'}});
      labelRow.appendChild(SP({style:{fontSize:'11px',fontWeight:'600',color:sh.sec.color}},sh.sec.label));
      var pctLabel=D({style:{display:'flex',gap:'8px',alignItems:'center'}});
      pctLabel.appendChild(SP({style:{fontSize:'10px',color:'#b0adc4'}},sh.done+'/'+sh.total+' done'));
      if(sh.overdue>0) pctLabel.appendChild(SP({style:{fontSize:'10px',color:'#e74c3c'}},sh.overdue+' overdue'));
      if(sh.behind>0) pctLabel.appendChild(SP({style:{fontSize:'10px',color:'#e67e22'}},sh.behind+' behind'));
      labelRow.appendChild(pctLabel);
      row.appendChild(labelRow);

      // Health bar track
      var track=D({style:{height:'8px',background:'rgba(255,255,255,.08)',borderRadius:'4px',position:'relative',overflow:'visible'}});
      // Expected progress marker
      if(sh.expectedPct>0&&sh.expectedPct<100){
        var marker=D({style:{position:'absolute',left:sh.expectedPct+'%',top:'-3px',width:'2px',height:'14px',background:'rgba(255,255,255,.3)',borderRadius:'1px',zIndex:'1'}});
        var markerTip=D({style:{position:'absolute',left:sh.expectedPct+'%',top:'-18px',fontSize:'9px',color:'#b0adc4',transform:'translateX(-50%)',whiteSpace:'nowrap'}});
        markerTip.textContent='exp '+sh.expectedPct+'%';
        track.appendChild(marker); track.appendChild(markerTip);
      }
      // Actual progress fill
      var fill=D({style:{height:'100%',width:sh.actualPct+'%',background:sh.isLagging?'#e74c3c':sh.sec.color,borderRadius:'4px',minWidth:sh.actualPct>0?'4px':'0',transition:'width .3s'}});
      track.appendChild(fill);
      row.appendChild(track);
      card.appendChild(row);
    });

    // Click opens kanban
    (function(t,sh){card.addEventListener('click',safe(function(){S.modal={type:'eventHealthKanban',tmpl:t,sectionHealth:sh};render();}));})(tmpl,sectionHealth);
    w.appendChild(card);
  });
  return w;
}

// Event health kanban modal
function mEventHealthKanban(mo, tmpl, sectionHealth){
  mo.style.maxWidth='none'; mo.style.width='95vw'; mo.style.maxHeight='92vh';
  mo.appendChild(D({cls:'rh'},[
    D({style:{flex:'1'}},[

    ]),
    BTN({cls:'btn bo bsm',click:closeM},'Close')
  ]));

  var KANBAN_COLS=[
    {id:'pending',   label:'Not Started', color:'#b0adc4'},
    {id:'in_progress',label:'In Progress', color:'#2980b9'},
    {id:'done',      label:'Completed',   color:'#27ae60'}
  ];

  var board=D({style:{display:'flex',gap:'12px',overflowX:'auto',paddingBottom:'8px',marginTop:'1rem'}});

  KANBAN_COLS.forEach(function(col){
    var colEl=D({style:{background:'rgba(255,255,255,.03)',border:'1px solid rgba(232,98,74,.15)',borderRadius:'10px',padding:'10px',minWidth:'240px',maxWidth:'300px',flexShrink:'0'}});
    var colHdr=D({style:{display:'flex',alignItems:'center',gap:'7px',marginBottom:'10px'}});

    colHdr.appendChild(dot);
    colHdr.appendChild(SP({style:{fontWeight:'600',fontSize:'13px',color:'#f0ece4'}},col.label));
    colEl.appendChild(colHdr);

    sectionHealth.forEach(function(sh){
      // Get tasks for this col (excluding 'behind' which gets special treatment)
      var colTasks;
      if(col.id==='in_progress'){
        colTasks=sh.tasks.filter(function(t){return t.status==='in_progress'&&t.status!=='behind';});
        var behindTasks=sh.tasks.filter(function(t){return t.status==='behind';});
        if(!colTasks.length&&!behindTasks.length) return;
      } else {
        colTasks=sh.tasks.filter(function(t){return t.status===col.id;});
        if(!colTasks.length) return;
      }

      // Section label
      var secLbl=D({style:{fontSize:'10px',fontWeight:'700',color:sh.sec.color,textTransform:'uppercase',letterSpacing:'.05em',marginBottom:'5px',marginTop:'6px'}});
      secLbl.textContent=sh.sec.label;
      colEl.appendChild(secLbl);

      function renderTaskCard(t, isBehind){
        var tc=D({style:{background:isBehind?'rgba(230,126,34,.08)':'rgba(255,255,255,.05)',border:'1px solid '+(isBehind?'rgba(230,126,34,.3)':'rgba(232,98,74,.15)'),borderRadius:'7px',padding:'8px 10px',marginBottom:'6px'}});
        var tRow=D({style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'6px'}});
        var tLeft=D({});
        tLeft.appendChild(P({style:{fontSize:'12px',fontWeight:'500',color:'#f0ece4',marginBottom:'2px'}},t.title));
        if(t.dueDate) tLeft.appendChild(P({style:{fontSize:'10px',color:isOverdue(t)?'#e74c3c':'#b0adc4'}},'Due: '+FD(t.dueDate)));
        if(t.projectedDate) tLeft.appendChild(P({style:{fontSize:'10px',color:'#e67e22'}},'Proj: '+FD(t.projectedDate)));
        tRow.appendChild(tLeft);
        // Assignees
        var asgns=D({style:{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:'2px',flexShrink:'0'}});
        (t.assignees||[]).forEach(function(uid){
          asgns.appendChild(SP({style:{fontSize:'10px',color:'#b0adc4'}},UN(uid)));
        });
        tRow.appendChild(asgns);
        tc.appendChild(tRow);
        if(isBehind){
          var behindBadge=SP({style:{fontSize:'10px',color:'#e67e22',display:'block',marginTop:'3px'}},'\uD83D\uDD52 Running Behind');
          tc.appendChild(behindBadge);
        }
        return tc;
      }

      colTasks.forEach(function(t){colEl.appendChild(renderTaskCard(t,false));});

      if(col.id==='in_progress'){
        var behindTasks=sh.tasks.filter(function(t){return t.status==='behind';});
        if(behindTasks.length){
          var behindSep=D({style:{borderTop:'1px dashed rgba(230,126,34,.4)',margin:'6px 0 5px',paddingTop:'5px'}});
          behindSep.appendChild(SP({style:{fontSize:'10px',color:'#e67e22',fontWeight:'600'}},'Running Behind'));
          colEl.appendChild(behindSep);
          behindTasks.forEach(function(t){colEl.appendChild(renderTaskCard(t,true));});
        }
      }
    });

    board.appendChild(colEl);
  });
  mo.appendChild(board);
}

  if(isAdm&&adminMode){

        var info=D({style:{flex:'1',minWidth:'0'}});

        titleP.appendChild(SP({style:{fontSize:'10px',background:'rgba(232,98,74,.15)',color:'#e8624a',borderRadius:'4px',padding:'1px 5px',marginLeft:'5px'}},song.type==='podcast'?'PODCAST':'MUSIC'));
        if(song.isNew&&song.newUntil&&new Date()<new Date(song.newUntil)){titleP.appendChild(SP({style:{fontSize:'10px',background:'#e8624a',color:'#fff',borderRadius:'4px',padding:'1px 5px',marginLeft:'5px'}},'NEW'));}
        info.appendChild(titleP);
        if(song.album) info.appendChild(P({cls:'cs',style:{fontSize:'11px'}},song.album+(song.year?' \u00b7 '+song.year:'')));
        card.appendChild(info);
        var acts=D({style:{display:'flex',gap:'4px',flexShrink:'0'}});
        (function(s,i){
          acts.appendChild(BTN({cls:'btn bo bsm',click:safe(function(){S.modal={type:'editSong',song:s,idx:i};render();})},'\u270E'));
          acts.appendChild(BTN({cls:'btn br bsm',click:safe(function(){if(confirm('Delete this song?')){S.musicDb.splice(i,1);save();render();}})},'x'));
        })(song,idx);
        card.appendChild(acts);
        w.appendChild(card);
      });
    }
    return w;
  }

  // View mode: search + featured + new
  w.appendChild(P({style:{fontSize:'22px',fontWeight:'700',color:'#e8624a',marginBottom:'4px',textAlign:'center'}},'Music & Pods'));
  w.appendChild(P({style:{fontSize:'13px',color:'#b0adc4',marginBottom:'1.2rem',textAlign:'center'}},'Music and podcasts from The Well of Iowa'));

  // Search bar
  var q='';
  var resultsWrap=D({});
  var searchInp=document.createElement('input');
  searchInp.type='text'; searchInp.placeholder='Search songs, albums...';
  searchInp.className='task-search';
  searchInp.style.cssText='width:100%;margin-bottom:16px;';
  searchInp.addEventListener('input',function(){
    q=searchInp.value.toLowerCase().trim();
    renderMusicResults();
  });
  w.appendChild(searchInp);
  w.appendChild(resultsWrap);

  function renderMusicResults(){
    resultsWrap.innerHTML='';
    var now=new Date();
    var db=S.musicDb||[];
    function renderGrid(items,label,mb){
      if(!items.length) return;
      resultsWrap.appendChild(P({style:{fontSize:'14px',fontWeight:'600',color:'#e8624a',marginBottom:'8px',marginTop:mb?'1.25rem':'0'}},label));
      var g=D({style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))',gap:'10px',marginBottom:'1rem'}});
      items.forEach(function(s){g.appendChild(buildSongCard(s));});
      resultsWrap.appendChild(g);
    }
    if(q){
      var filtered=db.filter(function(s){
        return (s.title||'').toLowerCase().includes(q)||(s.album||'').toLowerCase().includes(q);
      });
      if(!filtered.length){resultsWrap.appendChild(D({cls:'empty'},'No results found.'));return;}
      var music=filtered.filter(function(s){return s.type!=='podcast';});
      var pods=filtered.filter(function(s){return s.type==='podcast';});
      renderGrid(music,'Music',false);
      renderGrid(pods,'Podcasts',music.length>0);
      return;
    }
    // New items
    var newItems=db.filter(function(s){return s.isNew&&s.newUntil&&new Date(s.newUntil)>=now;});
    renderGrid(newItems,'\uD83D\uDD25 New',false);
    // Featured
    var featured=db.filter(function(s){return s.featured;});
    renderGrid(featured,'Featured',newItems.length>0);
    // Music section
    var allMusic=db.filter(function(s){return s.type!=='podcast';});
    renderGrid(allMusic,'Music',newItems.length>0||featured.length>0);
    // Podcasts section
    var allPods=db.filter(function(s){return s.type==='podcast';});
    renderGrid(allPods,'Podcasts',true);
    if(!db.length){
      resultsWrap.appendChild(D({cls:'empty'},'Nothing in the database yet.'));
    }
  }

  function buildSongCard(song){
    var card=D({cls:'card',style:{cursor:'pointer',padding:'8px',position:'relative'}});
    var now2=new Date();
    var isNew2=song.isNew&&song.newUntil&&new Date(song.newUntil)>=now2;
    if(isNew2){
      var newBadge=D({style:{position:'absolute',top:'6px',right:'6px',background:'#e8624a',color:'#fff',fontSize:'9px',fontWeight:'700',padding:'2px 5px',borderRadius:'3px',letterSpacing:'.5px'}});
      newBadge.textContent='\uD83D\uDD25 NEW';
      card.appendChild(newBadge);
    }
    if(song.thumbnail){
      card.appendChild(D({style:{backgroundImage:'url('+song.thumbnail+')',backgroundSize:'cover',backgroundPosition:'center',height:'100px',borderRadius:'6px',marginBottom:'6px'}}));
    } else {
      card.appendChild(D({style:{height:'100px',borderRadius:'6px',marginBottom:'6px',background:'rgba(232,98,74,.1)',display:'flex',alignItems:'center',justifyContent:'center'}},[SP({style:{fontSize:'28px'}},'\uD83C\uDFB5')]));
    }
    card.appendChild(P({style:{fontSize:'12px',fontWeight:'600',marginBottom:'2px',lineHeight:'1.3'}},song.title));
    if(song.album) card.appendChild(P({cls:'cs',style:{fontSize:'10px'}},song.album));
    (function(s){card.addEventListener('click',safe(function(){S.modal={type:'playMusic',song:s};render();}));})(song);
    return card;
  }

  renderMusicResults();
  return w;
}
