  // Audience picker
  var audWrap=D({style:{marginBottom:'1rem'}});
  audWrap.appendChild(P({style:{fontSize:'11px',color:'#b0adc4',textTransform:'uppercase',letterSpacing:'.4px',marginBottom:'6px'}},'Send To'));
  var audNote=P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'6px'}},'No one selected = broadcast to ALL users');
  audWrap.appendChild(audNote);
  var audList=D({style:{display:'flex',flexWrap:'wrap',gap:'4px',marginBottom:'8px'}});
  var audSel=SEL({change:function(e){
    var v=e.target.value; if(!v)return;
    if(v.startsWith('g:')){
      var g=S.groups.find(function(g){return g.id===parseInt(v.slice(2));});
      if(g) g.members.forEach(function(id){if(!fd.audience.some(function(x){return sameId(x,id);}))fd.audience.push(String(id));});
    } else {
      var id=String(v); if(!fd.audience.some(function(x){return sameId(x,id);})) fd.audience.push(id);
    }
    e.target.value='';
    rebuildAud();
  }});
  audSel.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none;margin-bottom:6px';
  audSel.appendChild(OPT({value:''},'Add person or group...'));
  USERS.forEach(function(u){audSel.appendChild(OPT({value:u.id},u.name));});
  audSel.appendChild(OPT({disabled:true},'-- Groups --'));
  S.groups.forEach(function(g){audSel.appendChild(OPT({value:'g:'+g.id},'Group: '+g.name));});
  function rebuildAud(){
    audList.innerHTML='';
    fd.audience.forEach(function(id){
      var t=SP({cls:'tag tagp',style:{cursor:'pointer'}},UN(id)+' x');
      (function(uid){t.addEventListener('click',function(){fd.audience=fd.audience.filter(function(x){return x!==uid;});rebuildAud();});})(id);
      audList.appendChild(t);
    });
    audNote.textContent=fd.audience.length?'Sending to '+fd.audience.length+' people':'No one selected = broadcast to ALL users';
  }
  audWrap.appendChild(audSel); audWrap.appendChild(audList);
  mo.appendChild(audWrap);

  // Attachment
  var attRow=D({style:{display:'flex',gap:'8px',alignItems:'center',marginBottom:'1rem'}});
  attRow.appendChild(filePickerBtn('Attach Image/File',function(f){
    fd.attachment=f;
    attPreview.innerHTML='';
    var prev=renderAttachment(f);
    if(prev) attPreview.appendChild(prev);
    attPreview.appendChild(SP({style:{fontSize:'11px',color:'#b0adc4',display:'block',marginTop:'3px'}},f.name));
  }));

// -- GROUP MEMBERSHIP SYNC --------------------------------------------------
// Single source of truth for syncing group membership changes across events,
// tasks, and message rooms. Call this whenever group members change.
function syncGroupMembership(g, added, removed){
  // Sync events: add/remove from template user lists and teams
  S.templates.forEach(function(tmpl){
    added.forEach(function(uid){
      if(!tmpl.users.some(function(x){return sameId(x,uid);})){
        tmpl.users.push(String(uid));
        addNotif(uid,'You have been added to: '+tmpl.title);
      }
    });
    removed.forEach(function(uid){
      tmpl.users=tmpl.users.filter(function(x){return !sameId(x,uid);});
      (tmpl.teams||[]).forEach(function(t){
        t.members=t.members.filter(function(x){return !sameId(x,uid);});
        t.leaders=t.leaders.filter(function(x){return !sameId(x,uid);});
      });
    });
  });

  // Sync group-sourced free tasks
  added.forEach(function(uid){
    S.tasks.forEach(function(t){
      if(!(t.sourceGroupIds||[]).some(function(gid){return String(gid)===String(g.id);})) return;
      if(!(t.assignees||[]).some(function(x){return sameId(x,uid);})){
        t.assignees.push(String(uid));
        addNotif(uid,'You have been added to task: "'+t.title+'"');
      }
    });
  });
  removed.forEach(function(uid){
    S.tasks.forEach(function(t){
      if(!(t.sourceGroupIds||[]).some(function(gid){return String(gid)===String(g.id);})) return;
      t.assignees=t.assignees.filter(function(x){return !sameId(x,uid);});
      if(sameId(t.lead,uid)) t.lead=t.assignees[0]||null;
    });
    S.tasks=S.tasks.filter(function(t){return (t.assignees||[]).length>0;});
  });

  // Sync event-template tasks for added members
  added.forEach(function(uid){
    S.templates.forEach(function(tmpl){
      if(!tmpl.taskTemplateId) return;
      if(!tmpl.users.some(function(x){return sameId(x,uid);})) return;
      var tpl=S.taskTemplates.find(function(t){return String(t.id)===String(tmpl.taskTemplateId);});
      if(!tpl) return;
      (tpl.items||[]).forEach(function(item){
        var roles=item.assignToRoles||(item.assignToRole?[item.assignToRole]:[]);
        var shouldAssign=roles.some(function(r){
          if(r==='all') return true;
          if(r==='leaders') return (tmpl.teams||[]).some(function(t){return (t.leaders||[]).some(function(x){return sameId(x,uid);});});
          if(r.slice(0,5)==='user:') return sameId(r.slice(5),uid);
          return false;
        });
        if(!shouldAssign) return;
        var alreadyHas=S.tasks.some(function(t){return t.evTemplateId===tmpl.id&&t.title===item.title&&(t.assignees||[]).some(function(x){return sameId(x,uid);});});
        if(alreadyHas) return;
        var due=null;
        if(tmpl.date&&item.daysBefore){var d=new Date(tmpl.date+'T12:00:00');d.setDate(d.getDate()-(item.daysBefore||0));due=d.toISOString().split('T')[0];}
        S.tasks.push({id:S.nTask++,assignees:[String(uid)],lead:String(uid),by:S.user.id,title:item.title,status:'pending',evId:null,evDate:tmpl.date,evTemplateId:tmpl.id,dueDate:due,overdueNotified:false,sourceGroupIds:[]});
      });
    });
  });
  removed.forEach(function(uid){
    S.tasks.forEach(function(t){
      if(t.assignees) t.assignees=t.assignees.filter(function(x){return !sameId(x,uid);});
    });
    S.tasks=S.tasks.filter(function(t){return (t.assignees||[]).length>0;});
  });

  // Sync message rooms
  S.rooms.forEach(function(room){
    var hasGroup=g.members.some(function(m){return (room.members||[]).some(function(rm){return sameId(rm,m);});});
    if(!hasGroup) return;
    added.forEach(function(uid){
      if(!(room.members||[]).some(function(x){return sameId(x,uid);})) room.members.push(String(uid));
    });
    removed.forEach(function(uid){
      room.members=room.members.filter(function(x){return !sameId(x,uid);});
    });
  });
}

  mo.appendChild(D({cls:'mfooter'},[BTN({cls:'btn bo',click:closeM},'Cancel'),BTN({cls:'btn bg',click:function(){

        var added=newMembers.filter(function(x){return !oldMembers.some(function(y){return sameId(x,y);});});

              t.leaders=t.leaders.filter(function(x){return !sameId(x,uid);});

          });
        });

          });

            // Generate only tasks for this user specifically
            (tpl.items||[]).forEach(function(item){
              var roles=item.assignToRoles||(item.assignToRole?[item.assignToRole]:[]);
              var shouldAssign=roles.some(function(r){
                if(r==='all') return true;
                if(r==='leaders') return (tmpl.teams||[]).some(function(t){return (t.leaders||[]).some(function(x){return sameId(x,uid);});});
                if(r.slice(0,5)==='user:') return sameId(r.slice(5),uid);
                return false;
              });
              if(!shouldAssign) return;
              // Don't duplicate
              var alreadyHas=S.tasks.some(function(t){return t.evTemplateId===tmpl.id&&t.title===item.title&&(t.assignees||[]).some(function(x){return sameId(x,uid);});});
              if(alreadyHas) return;
              var due=null;
              if(tmpl.date&&item.daysBefore){var d=new Date(tmpl.date+'T12:00:00');d.setDate(d.getDate()-(item.daysBefore||0));due=d.toISOString().split('T')[0];}
              S.tasks.push({id:S.nTask++,assignees:[String(uid)],lead:String(uid),by:S.user.id,title:item.title,status:'pending',evId:null,evDate:tmpl.date,evTemplateId:tmpl.id,dueDate:due,overdueNotified:false});
            });
          });
        });
        removed.forEach(function(uid){
          S.tasks.forEach(function(t){
            if(t.assignees) t.assignees=t.assignees.filter(function(x){return !sameId(x,uid);});
          });
          S.tasks=S.tasks.filter(function(t){return (t.assignees||[]).length>0;});
        });
        // Sync messages -- add to rooms that have this group's members
        S.rooms.forEach(function(room){
          var hasGroup=g.members.some(function(m){return (room.members||[]).some(function(rm){return sameId(rm,m);});});
          if(!hasGroup) return;
          added.forEach(function(uid){
            if(!(room.members||[]).some(function(x){return sameId(x,uid);})){
              room.members.push(String(uid));
            }
          });
          removed.forEach(function(uid){
            room.members=room.members.filter(function(x){return !sameId(x,uid);});
          });
        });
        save();closeM();
      }},'Save')]));
}

// -- FILE ATTACHMENT HELPER (Firebase Storage) ------------------------------
// Uploads file to Firebase Storage and returns {name, type, url} via callback.
// Falls back to base64 for sandbox/offline use.
function filePickerBtn(label, onFile){
  var btn=BTN({cls:'btn bo bsm'},label+' \uD83D\uDCCE');
  btn.addEventListener('click',function(){
    var inp=document.createElement('input');
    inp.type='file';
    inp.accept='image/*,application/pdf,.doc,.docx,.txt';
    inp.addEventListener('change',function(){
      var file=inp.files[0]; if(!file) return;
      if(file.size>10*1024*1024){alert('File is larger than 10MB. Please choose a smaller file.');return;}
      // Show uploading state
      btn.textContent='Uploading...';
      btn.disabled=true;
      // Upload to Firebase Storage
      var authUid=(auth.currentUser&&auth.currentUser.uid)||'anon';
      var path='attachments/'+authUid+'/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      var ref=storage.ref(path);
      var task=ref.put(file);
      task.on('state_changed',
        function(snap){
          var pct=Math.round(snap.bytesTransferred/snap.totalBytes*100);
          btn.textContent='Uploading '+pct+'%...';
        },
        function(err){
          btn.textContent=(label||'Attach')+' \uD83D\uDCCE';
          btn.disabled=false;
          alert('Upload failed: '+err.message);
        },
        function(){
          ref.getDownloadURL().then(function(url){
            btn.textContent=(label||'Attach')+' \uD83D\uDCCE';
            btn.disabled=false;
            onFile({name:file.name, type:file.type, url:url});
          });
        }
      );
    });
    inp.click();
  });
  return btn;
}

function renderAttachment(att){
  if(!att) return null;
  // Support both old base64 (att.data) and new Storage URL (att.url)
  var src=att.url||att.data;
  if(!src) return null;
  var wrap=D({style:{marginTop:'6px',display:'inline-block'}});
  if(att.type&&att.type.startsWith('image/')){
    var img=document.createElement('img');
    img.src=src; img.alt=att.name;
    img.style.cssText='max-width:100%;max-height:200px;border-radius:8px;border:1px solid rgba(232,98,74,.2);display:block;';
    wrap.appendChild(img);
  } else {
    var link=document.createElement('a');
    link.href=src; link.target='_blank'; link.rel='noopener';
    link.style.cssText='font-size:12px;color:#87b7e8;text-decoration:none;display:flex;align-items:center;gap:5px;';
    link.textContent='\uD83D\uDCC4 '+att.name;
    wrap.appendChild(link);
  }
  return wrap;
}

function renderSetlistCal(container, data, dateInp, onPick){
  container.innerHTML='';
  var now=new Date();
  var calY=data._calY||now.getFullYear();
  var calM=data._calM!==undefined?data._calM:now.getMonth();
  var monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  // Get all event instances for this month (including recurring)
  var monthStart=calY+'-'+(calM+1<10?'0':'')+(calM+1)+'-01';
  var monthEnd=calY+'-'+(calM+1<10?'0':'')+(calM+1)+'-'+(new Date(calY,calM+1,0).getDate());
  var monthEvs=allInstances(monthStart,monthEnd);
  // Header
  var hdr=D({style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}});
  var prevBtn=BTN({cls:'btn bo bsm'});prevBtn.textContent='\u2190';
  prevBtn.addEventListener('click',function(){
    calM--;if(calM<0){calM=11;calY--;}
    data._calY=calY;data._calM=calM;renderSetlistCal(container,data,dateInp,onPick);
  });
  var nextBtn=BTN({cls:'btn bo bsm'});nextBtn.textContent='\u2192';
  nextBtn.addEventListener('click',function(){
    calM++;if(calM>11){calM=0;calY++;}
    data._calY=calY;data._calM=calM;renderSetlistCal(container,data,dateInp,onPick);
  });
  hdr.appendChild(prevBtn);
  hdr.appendChild(SP({style:{fontWeight:'600',fontSize:'13px',color:'#f0ece4'}},monthNames[calM]+' '+calY));
  hdr.appendChild(nextBtn);
  container.appendChild(hdr);
  // Day headers
  var grid=D({style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'2px',textAlign:'center'}});
  ['S','M','T','W','T','F','S'].forEach(function(d){
    grid.appendChild(SP({style:{fontSize:'10px',color:'#5a5a6a',padding:'2px 0'}},d));
  });
  var firstDay=new Date(calY,calM,1).getDay();
  for(var p=0;p<firstDay;p++) grid.appendChild(D({}));
  var daysInMonth=new Date(calY,calM+1,0).getDate();
  for(var d=1;d<=daysInMonth;d++){
    var ds=calY+'-'+(calM+1<10?'0':'')+(calM+1)+'-'+(d<10?'0':'')+d;
    var dayEvs=monthEvs.filter(function(ev){return ev.date===ds;});
    var isSelected=data.date===ds;
    var cell=D({style:{padding:'3px',borderRadius:'4px',cursor:dayEvs.length?'pointer':'default',background:dayEvs.length?'rgba(232,98,74,.15)':'transparent',border:isSelected?'1px solid #e8624a':'1px solid transparent'}});
    cell.appendChild(SP({style:{fontSize:'12px',color:dayEvs.length?'#e8624a':'#b0adc4',display:'block',textAlign:'center'}},String(d)));
    if(dayEvs.length){
      cell.appendChild(SP({style:{fontSize:'9px',color:'#b0adc4',display:'block',textAlign:'center',lineHeight:'1.2',marginTop:'1px'}},dayEvs[0].title.slice(0,10)+(dayEvs[0].title.length>10?'...':'')));
      // If multiple events on same day show count
      if(dayEvs.length>1) cell.appendChild(SP({style:{fontSize:'9px',color:'#e8624a',display:'block',textAlign:'center'}},'+'+( dayEvs.length-1)+' more'));
      (function(evs,dstr){cell.addEventListener('click',function(){
        if(evs.length===1){
          // Single event - pick it directly
          var ev=evs[0];
          data.eventId=ev.templateId||ev.id;
          data.date=dstr;
          if(dateInp) dateInp.value=dstr;
          if(onPick) onPick();
          renderSetlistCal(container,data,dateInp,onPick);
        } else {
          // Multiple events - show a small picker
          var picker=D({style:{position:'absolute',background:'#1f1f2e',border:'1px solid rgba(232,98,74,.4)',borderRadius:'8px',padding:'6px',zIndex:'99',marginTop:'2px',minWidth:'160px',boxShadow:'0 4px 16px rgba(0,0,0,.5)'}});
          evs.forEach(function(ev){
            var opt=D({style:{padding:'5px 8px',cursor:'pointer',fontSize:'12px',color:'#f0ece4',borderRadius:'4px'}});
            opt.textContent=ev.title;
            opt.addEventListener('mouseover',function(){opt.style.background='rgba(232,98,74,.15)';});
            opt.addEventListener('mouseout',function(){opt.style.background='transparent';});
            opt.addEventListener('click',function(e){
              e.stopPropagation();
              data.eventId=ev.templateId||ev.id;
              data.date=dstr;
              if(dateInp) dateInp.value=dstr;
              if(onPick) onPick();
              picker.remove();
              renderSetlistCal(container,data,dateInp,onPick);
            });
            picker.appendChild(opt);
          });
          cell.style.position='relative';
          cell.appendChild(picker);
          // Close on outside click
          setTimeout(function(){
            document.addEventListener('click',function removePicker(){picker.remove();document.removeEventListener('click',removePicker);},{once:true});
          },0);
        }
      });})(dayEvs,ds);
    }
    grid.appendChild(cell);
  }
  container.appendChild(grid);
  if(!monthEvs.length){
    container.appendChild(P({style:{fontSize:'11px',color:'#5a5a6a',textAlign:'center',marginTop:'6px'}},'No events this month'));
  }
}

function notifyWorshipUsers(setlist){
  // If linked to an event, only notify worship users assigned to that event
  var targetUids=null;
  if(setlist.eventId){
    var ev=S.templates.find(function(t){return t.id===setlist.eventId;});
    if(ev){
      targetUids=(ev.users||[]).map(function(x){return String(x);});
    }
  }
  USERS.filter(function(u){
    var roles=u.roles||[u.role||'regular'];
    var isWorship=roles.indexOf('worship')>=0||roles.indexOf('admin')>=0;
    if(!isWorship) return false;
    if(sameId(u.id,S.user.id)) return false;
    // If event-linked, only notify assigned users
    if(targetUids) return targetUids.some(function(x){return sameId(x,u.id);});
    return true;
  }).forEach(function(u){
    addNotif(u.id,'Setlist published for '+FD(setlist.date)+(setlist.songs&&setlist.songs.length?' \u00b7 '+setlist.songs.length+' song'+(setlist.songs.length===1?'':'s'):''));
  });
}

          data.songs.splice(i,1); renderSongs();
        }},'Remove Song'));
      })(idx);
      songsWrap.appendChild(row);
    });
  }
  renderSongs();

  mo.appendChild(BTN({cls:'btn bo bsm',style:{marginTop:'4px',marginBottom:'8px'},click:function(){
    data.songs.push({song:'',link:'',notes:''}); renderSongs();
  }},'+ Add Song / Podcast'));

  var pubLabel=D({style:{display:'flex',alignItems:'center',gap:'8px',marginTop:'12px',marginBottom:'4px'}});
  var pubCb=document.createElement('input');
  pubCb.type='checkbox'; pubCb.checked=!!data.published;
  pubCb.addEventListener('change',function(){data.published=pubCb.checked;});
  pubLabel.appendChild(pubCb);
  pubLabel.appendChild(SP({style:{fontSize:'13px',color:'#b0adc4'}},'Published automatically on save'));
  mo.appendChild(pubLabel);
  mo.appendChild(err);

  mo.appendChild(D({cls:'mfooter'},[
    BTN({cls:'btn bo',click:closeM},'Cancel'),
    BTN({cls:'btn bg',click:function(){
      if(!data.date){err.textContent='Date is required.';return;}
      var td=TODAY();
      if(data.date<td){err.textContent='Date cannot be in the past.';return;}
      // Auto-publish on save
      data.published=true;
      // Filter out empty songs
      data.songs=data.songs.filter(function(sg){return (sg.song||'').trim();});
      if(!S.setlists) S.setlists=[];
      if(isNew){
        S.setlists.push(data);
        audit('Setlist Created','for '+FD(data.date));
        if(data.published) notifyWorshipUsers(data);
      } else {
        var idx=S.setlists.findIndex(function(x){return x.id===data.id;});
        var wasPublished=idx>=0&&S.setlists[idx].published;
        if(idx>=0) S.setlists[idx]=data;
        audit('Setlist Updated','for '+FD(data.date));
        if(data.published&&!wasPublished) notifyWorshipUsers(data);
      }
      save(); closeM();
    }},'Save')
  ]));
}

function inputTable(listKey, rowCount){
  // Ensure list has the right number of rows
  var list=S.inputLists[listKey];
  if(!Array.isArray(list)) list=[];
  while(list.length<rowCount) list.push({input:'',output:''});
  if(list.length>rowCount) list.length=rowCount;
  S.inputLists[listKey]=list;

  var wrap=D({style:{overflow:'auto',maxWidth:'100%'}});

  // Debounced save
  var saveTimer=null;
  function queueSave(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){save();},500);
  }

  var tbl=document.createElement('table');
  tbl.style.cssText='width:100%;border-collapse:collapse;font-size:12px;color:#f0ece4;table-layout:fixed';

  var thead=document.createElement('thead');
  var hrow=document.createElement('tr');
  hrow.style.background='rgba(0,0,0,.15)';
  function hth(text, width){
    var th=document.createElement('th');
    th.style.cssText='text-align:left;padding:4px 6px;font-size:10px;font-weight:500;color:#b0adc4;text-transform:uppercase;letter-spacing:.4px;border:1px solid rgba(232,98,74,.25);'+(width?'width:'+width+';':'');
    th.textContent=text;
    return th;
  }
  hrow.appendChild(hth('#','42px'));
  hrow.appendChild(hth('Input'));
  hrow.appendChild(hth('Output'));
  thead.appendChild(hrow);
  tbl.appendChild(thead);

  var tbody=document.createElement('tbody');
  list.forEach(function(row, i){
    var tr=document.createElement('tr');

    var numTd=document.createElement('td');
    numTd.style.cssText='padding:3px 6px;color:#b0adc4;font-size:11px;text-align:center;border:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.1);font-weight:500';
    numTd.textContent=String(i+1);
    tr.appendChild(numTd);

    function cell(field){
      var td=document.createElement('td');
      td.style.cssText='padding:0;border:1px solid rgba(255,255,255,.06);vertical-align:top';
      var ta=document.createElement('textarea');
      ta.value=row[field]||'';
      ta.rows=1;
      ta.style.cssText='width:100%;box-sizing:border-box;background:transparent;border:none;color:#f0ece4;padding:4px 6px;font-size:12px;font-family:inherit;resize:none;outline:none;overflow:hidden;min-height:22px;line-height:1.3';
      function autosize(){
        ta.style.height='auto';
        ta.style.height=Math.max(22, ta.scrollHeight)+'px';
      }
      ta.addEventListener('input',function(e){
        row[field]=e.target.value;
        autosize();
        queueSave();
      });
      ta.addEventListener('focus',function(){ta.style.background='rgba(232,98,74,.08)';});
      ta.addEventListener('blur',function(){ta.style.background='transparent'; save();});
      td.appendChild(ta);
      // autosize after append
      setTimeout(autosize,0);
      return td;
    }
    tr.appendChild(cell('input'));
    tr.appendChild(cell('output'));

    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);
  return wrap;
}

function productionList(){
  var w=D({});
  if(!S.productionItems) S.productionItems=[];

  var topRow=D({style:{display:'flex',gap:'8px',alignItems:'center',marginBottom:'10px',flexWrap:'wrap'}});
  topRow.appendChild(BTN({cls:'btn bg bsm',click:function(){
    S.productionItems.push({id:Date.now()+Math.floor(Math.random()*1000),item:'',type:'',length:'',location:'',qty:0,unitPrice:0});
    audit('Production Row Added','');
    save(); renderTable();
  }},'+ Add Row'));
  var countLbl=SP({style:{fontSize:'11px',color:'#b0adc4'}},'');
  topRow.appendChild(countLbl);
  w.appendChild(topRow);

  var filterRow=D({style:{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:'6px',marginBottom:'8px'}});
  function filterInp(key, placeholder){
    var inp=INP({type:'text',placeholder:'Filter '+placeholder+'...',input:function(e){
      filters[key]=e.target.value.toLowerCase(); renderTable();
    }});
    inp.style.cssText='background:#fff;border:1px solid #ccc;border-radius:6px;padding:6px 10px;color:#1a1a1a;font-size:12px;font-family:sans-serif;outline:none;width:100%;box-sizing:border-box';
    return inp;
  }
  filterRow.appendChild(filterInp('item','Item'));
  filterRow.appendChild(filterInp('type','Type'));
  filterRow.appendChild(filterInp('length','Length'));
  var locSel=SEL({change:function(e){filters.location=e.target.value.toLowerCase(); renderTable();}},
    [OPT({value:''},'All Locations')].concat(PRODUCTION_LOCATIONS.map(function(l){return OPT({value:l},l);})));
  locSel.style.cssText='background:#fff;border:1px solid #ccc;border-radius:6px;padding:6px 10px;color:#1a1a1a;font-size:12px;font-family:sans-serif;outline:none;width:100%;box-sizing:border-box';
  filterRow.appendChild(locSel);
  w.appendChild(filterRow);

  var tblWrap=D({style:{overflow:'auto',maxWidth:'100%'}});
  w.appendChild(tblWrap);

  function filtered(){
    return S.productionItems.filter(function(r){
      if(filters.item && (r.item||'').toLowerCase().indexOf(filters.item)<0) return false;
      if(filters.type && (r.type||'').toLowerCase().indexOf(filters.type)<0) return false;
      if(filters.length && String(r.length||'').toLowerCase().indexOf(filters.length)<0) return false;
      if(filters.location && (r.location||'').toLowerCase()!==filters.location) return false;
      return true;
    });
  }

  function renderTable(){
    tblWrap.innerHTML='';
    var rows=filtered();
    countLbl.textContent=rows.length+' of '+S.productionItems.length+' rows';
    if(!S.productionItems.length){
      tblWrap.appendChild(D({cls:'empty'},'No items yet. Click "+ Add Row" to start.'));
      return;
    }

    var tbl=document.createElement('table');
    tbl.style.cssText='width:100%;border-collapse:collapse;font-size:12px;color:#f0ece4;min-width:720px';

    var thead=document.createElement('thead');
    var hrow=document.createElement('tr');
    hrow.style.background='rgba(0,0,0,.2)';
    ['Item','Qty','Type','Length (ft)','Location','Unit Price','Total Value',''].forEach(function(h){
      var th=document.createElement('th');
      th.style.cssText='text-align:left;padding:6px 8px;font-size:10px;font-weight:500;color:#b0adc4;text-transform:uppercase;letter-spacing:.4px;border:1px solid rgba(232,98,74,.25);white-space:nowrap';
      th.textContent=h;
      hrow.appendChild(th);
    });
    thead.appendChild(hrow);
    tbl.appendChild(thead);

    var tbody=document.createElement('tbody');
    var subQty=0, subTotal=0;

    rows.forEach(function(row){
      var tr=document.createElement('tr');

      function cellInput(field, type){
        var td=document.createElement('td');
        td.style.cssText='padding:0;border:1px solid rgba(255,255,255,.08);vertical-align:middle';
        var inp=document.createElement('input');
        inp.type=type||'text';
        inp.value=(row[field]===null||row[field]===undefined)?'':String(row[field]);
        if(type==='number'){ inp.step='any'; inp.min='0'; }
        inp.style.cssText='width:100%;box-sizing:border-box;background:transparent;border:none;color:#f0ece4;padding:5px 8px;font-size:12px;font-family:inherit;outline:none';
        inp.addEventListener('focus',function(){inp.style.background='rgba(232,98,74,.08)';});
        inp.addEventListener('blur',function(){inp.style.background='transparent'; save();});
        inp.addEventListener('input',function(e){
          var v=e.target.value;
          if(type==='number'){ row[field]=v===''?0:parseFloat(v)||0; }
          else { row[field]=v; }
          if(field==='qty'||field==='unitPrice'){
            var t=(row.qty||0)*(row.unitPrice||0);
            var totalCell=tr.querySelector('[data-total]');
            if(totalCell) totalCell.textContent='$'+t.toFixed(2);
          }
        });
        td.appendChild(inp);
        return td;
      }

      function cellSelect(field, opts){
        var td=document.createElement('td');
        td.style.cssText='padding:0;border:1px solid rgba(255,255,255,.08);vertical-align:middle';
        var sel=document.createElement('select');
        sel.style.cssText='width:100%;box-sizing:border-box;background:transparent;border:none;color:#f0ece4;padding:5px 8px;font-size:12px;font-family:inherit;outline:none';
        var blank=document.createElement('option'); blank.value=''; blank.textContent='--'; sel.appendChild(blank);
        opts.forEach(function(o){
          var op=document.createElement('option'); op.value=o; op.textContent=o;
          if(row[field]===o) op.selected=true;
          op.style.color='#1a1a1a'; op.style.background='#fff';
          sel.appendChild(op);
        });
        sel.addEventListener('change',function(e){ row[field]=e.target.value; save(); renderTable(); });
        td.appendChild(sel);
        return td;
      }

      tr.appendChild(cellInput('item','text'));
      tr.appendChild(cellInput('qty','number'));
      tr.appendChild(cellInput('type','text'));
      tr.appendChild(cellInput('length','text'));
      tr.appendChild(cellSelect('location',PRODUCTION_LOCATIONS));
      tr.appendChild(cellInput('unitPrice','number'));

      var totalVal=(row.qty||0)*(row.unitPrice||0);
      subQty+=(row.qty||0);
      subTotal+=totalVal;

      var totalTd=document.createElement('td');
      totalTd.setAttribute('data-total','1');
      totalTd.style.cssText='padding:5px 8px;border:1px solid rgba(255,255,255,.08);vertical-align:middle;font-weight:500;color:#2ecc71';
      totalTd.textContent='$'+totalVal.toFixed(2);
      tr.appendChild(totalTd);

      var delTd=document.createElement('td');
      delTd.style.cssText='padding:2px 4px;border:1px solid rgba(255,255,255,.08);vertical-align:middle;text-align:center';
      (function(r){
        var delBtn=BTN({cls:'btn br bsm',click:function(){
          if(!confirm('Delete this row?')) return;
          S.productionItems=S.productionItems.filter(function(x){return x.id!==r.id;});
          audit('Production Row Deleted',r.item||'(unnamed)');
          save(); renderTable();
        }},'x');
        delTd.appendChild(delBtn);
      })(row);
      tr.appendChild(delTd);

      tbody.appendChild(tr);
    });

    var subRow=document.createElement('tr');
    subRow.style.background='rgba(232,98,74,.12)';
    subRow.style.fontWeight='600';
    var subTd1=document.createElement('td');
    subTd1.style.cssText='padding:8px;border:1px solid rgba(232,98,74,.4);color:#f0ece4;font-size:11px;text-transform:uppercase;letter-spacing:.5px';
    subTd1.textContent='Subtotal';
    subRow.appendChild(subTd1);
    var subQtyTd=document.createElement('td');
    subQtyTd.style.cssText='padding:8px;border:1px solid rgba(232,98,74,.4);color:#f0ece4';
    subQtyTd.textContent=subQty.toLocaleString(undefined,{maximumFractionDigits:2});
    subRow.appendChild(subQtyTd);
    for(var i=0;i<4;i++){
      var spacer=document.createElement('td');
      spacer.style.cssText='padding:8px;border:1px solid rgba(232,98,74,.4)';
      subRow.appendChild(spacer);
    }
    var subTotalTd=document.createElement('td');
    subTotalTd.style.cssText='padding:8px;border:1px solid rgba(232,98,74,.4);color:#2ecc71;font-weight:700';
    subTotalTd.textContent='$'+subTotal.toFixed(2);
    subRow.appendChild(subTotalTd);
    var emptySub=document.createElement('td');
    emptySub.style.cssText='padding:8px;border:1px solid rgba(232,98,74,.4)';
    subRow.appendChild(emptySub);
    tbody.appendChild(subRow);

    tbl.appendChild(tbody);
    tblWrap.appendChild(tbl);
  }

  renderTable();
  return w;
}

function productionAnalysis(){
  var w=D({});
  var items=S.productionItems||[];
  if(!items.length){ w.appendChild(D({cls:'empty'},'No production inventory to analyze.')); return w; }

  function entityKey(r){ return (r.item||'--')+(r.length?(' ('+r.length+'ft)'):''); }

  var types={};
  items.forEach(function(r){
    var type=(r.type||'').trim()||'(untyped)';
    if(!types[type]) types[type]=[];
    types[type].push(r);
  });

  var typeOptions=['__all__'].concat(Object.keys(types).sort());
  if(!S.productionAnalysisType) S.productionAnalysisType='__all__';
  if(typeOptions.indexOf(S.productionAnalysisType)<0) S.productionAnalysisType='__all__';

  var selWrap=D({style:{marginBottom:'12px'}});
  selWrap.appendChild(LBL({},'View by Type'));
  var sel=SEL({change:function(e){ S.productionAnalysisType=e.target.value; redraw(); }},
    typeOptions.map(function(t){return OPT({value:t,selected:t===S.productionAnalysisType}, t==='__all__'?'Aggregate (All Types)':t);}));
  sel.style.cssText='width:100%;max-width:320px;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
  selWrap.appendChild(sel);
  w.appendChild(selWrap);

  var chartsWrap=D({});
  w.appendChild(chartsWrap);

  function barChartInline(data, prefix, decimals){
    var wrap=D({style:{background:'rgba(0,0,0,.15)',borderRadius:'8px',padding:'10px',overflow:'auto'}});
    if(!data.length){ wrap.appendChild(P({style:{fontSize:'12px',color:'#b0adc4'}},'No data.')); return wrap; }
    var max=Math.max.apply(null, data.map(function(d){return d.value;}));
    if(max<=0) max=1;
    data.forEach(function(d){
      var row=D({style:{marginBottom:'5px',display:'flex',alignItems:'center',gap:'8px'}});
      var lbl=SP({style:{fontSize:'11px',color:'#f0ece4',minWidth:'140px',maxWidth:'200px',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},d.label);
      row.appendChild(lbl);
      var barWrap=D({style:{flex:'1',background:'rgba(255,255,255,.05)',borderRadius:'3px',height:'18px',position:'relative',minWidth:'80px'}});
      var pct=Math.max(1,(d.value/max)*100);
      var bar=D({style:{width:pct+'%',height:'100%',background:'#e8624a',borderRadius:'3px'}});
      barWrap.appendChild(bar);
      row.appendChild(barWrap);
      var val=SP({style:{fontSize:'11px',color:'#b0adc4',minWidth:'70px',textAlign:'right'}},
        prefix+d.value.toFixed(decimals||0));
      row.appendChild(val);
      wrap.appendChild(row);
    });
    return wrap;
  }

  function redraw(){
    chartsWrap.innerHTML='';
    var t=S.productionAnalysisType;
    var dataRows=(t==='__all__')?items:(types[t]||[]);

    var entities={};
    dataRows.forEach(function(r){
      var k=entityKey(r);
      if(!entities[k]) entities[k]={qty:0, value:0, label:k};
      entities[k].qty+=(r.qty||0);
      entities[k].value+=(r.qty||0)*(r.unitPrice||0);
    });

    var entityList=Object.keys(entities).map(function(k){return entities[k];});
    if(!entityList.length){
      chartsWrap.appendChild(D({cls:'empty'},'No data for this type.'));
      return;
    }

    var byValue=entityList.slice().sort(function(a,b){return b.value-a.value;});
    var byQty=entityList.slice().sort(function(a,b){return b.qty-a.qty;});

    chartsWrap.appendChild(P({style:{fontSize:'13px',fontWeight:'600',color:'#f0ece4',marginBottom:'6px',marginTop:'4px'}},'Total Value by Item'));
    chartsWrap.appendChild(barChartInline(byValue.slice(0,20).map(function(e){return {label:e.label, value:e.value};}), '$', 2));

    chartsWrap.appendChild(P({style:{fontSize:'13px',fontWeight:'600',color:'#f0ece4',marginBottom:'6px',marginTop:'20px'}},'Quantity by Item'));
    chartsWrap.appendChild(barChartInline(byQty.slice(0,20).map(function(e){return {label:e.label, value:e.qty};}), '', 0));

    var totalQty=entityList.reduce(function(s,e){return s+e.qty;},0);
    var totalValue=entityList.reduce(function(s,e){return s+e.value;},0);
    var summary=D({style:{marginTop:'20px',padding:'12px',background:'rgba(255,255,255,.04)',borderRadius:'8px'}});
    summary.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'4px'}},'Total Quantity: '+totalQty.toLocaleString()));
    summary.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'4px'}},'Total Value: $'+totalValue.toFixed(2)));
    summary.appendChild(P({style:{fontSize:'12px',color:'#b0adc4'}},'Unique Items: '+entityList.length));
    chartsWrap.appendChild(summary);
  }

  redraw();
  return w;
}

  if(!items.length){ w.appendChild(D({cls:'empty'},'No items yet.')); return w; }

  CATEGORIES.forEach(function(cat){
    var catItems=items.filter(function(it){return it.category===cat;});

    w.appendChild(P({style:{fontSize:'14px',color:'#e8624a',fontWeight:'500',marginBottom:'8px',marginTop:'8px',textTransform:'capitalize'}},cat));

      CLOTHING_SUBS.forEach(function(sub){

        subItems.forEach(function(it){ w.appendChild(merchItemCard(it)); });
      });
    } else {
      catItems.forEach(function(it){ w.appendChild(merchItemCard(it)); });
    }
  });
  return w;
}

function merchTransactions(){
  var w=D({});
  var allTxs=S.merch.transactions.slice().reverse();
  if(!allTxs.length){ w.appendChild(D({cls:'empty'},'No transactions yet.')); return w; }

  var searchVal='', filterEvent='';
  var listContainer=D({});
  var eventNames=[];
  allTxs.forEach(function(tx){
    if(tx.kind==='sale'&&tx.eventName&&eventNames.indexOf(tx.eventName)<0) eventNames.push(tx.eventName);
  });

  var controls=D({style:{display:'flex',gap:'8px',marginBottom:'1rem',flexWrap:'wrap'}});
  var searchInp=INP({type:'text',placeholder:'Search by item, event, notes...'});
  searchInp.style.cssText='flex:1;min-width:160px;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
  searchInp.addEventListener('input',function(e){searchVal=e.target.value.toLowerCase();renderList();});

  var evFilter=SEL({change:function(e){filterEvent=e.target.value;renderList();}});
  evFilter.style.cssText='background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 10px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
  evFilter.appendChild(OPT({value:''},'All events'));
  evFilter.appendChild(OPT({value:'__direct__'},'Direct sales only'));

  w.appendChild(controls);

  var countLabel=P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'8px'}});

  var kinds={cycle:'Cycle Count',produce:'Production',sale:'Sale'};
  var kindColors={cycle:'#87b7e8',produce:'#2ecc71',sale:'#e8624a'};

  function renderList(){
    listContainer.innerHTML='';
    var filtered=allTxs.filter(function(tx){
      if(filterEvent==='__direct__'&&tx.kind==='sale'&&tx.eventName) return false;

      }
      return true;
    });
    countLabel.textContent=filtered.length+' transaction'+(filtered.length!==1?'s':'')+(searchVal||filterEvent?' (filtered)':'');
    if(!filtered.length){
      listContainer.appendChild(D({cls:'empty',style:{padding:'1.5rem'}},'No transactions match your search.'));
      return;
    }
    filtered.forEach(function(tx){
      var c=D({cls:'card'});
      c.appendChild(D({cls:'ch'},[
        SP({cls:'ct'},tx.itemName),
        SP({style:{fontSize:'12px',color:kindColors[tx.kind]||'#b0adc4',fontWeight:'500',background:'rgba(255,255,255,.06)',padding:'2px 8px',borderRadius:'10px'}},kinds[tx.kind]||tx.kind)
      ]));
      var sizeStr=tx.size&&tx.size!=='one'?'Size: '+tx.size+'  |  ':'';
      var qtyStr='Qty: '+(tx.kind==='sale'?'-':'+')+(tx.qty||0);
      var revStr=(tx.kind==='sale'&&tx.price)?'  |  $'+(tx.price*(tx.qty||1)).toFixed(2):'';
      c.appendChild(P({style:{fontSize:'13px',color:'#f0ece4',marginTop:'4px'}},sizeStr+qtyStr+revStr));
      if(tx.kind==='sale'){
        if(tx.eventName){
          var evLine=D({style:{display:'flex',alignItems:'center',gap:'8px',marginTop:'5px',flexWrap:'wrap'}});
          evLine.appendChild(SP({style:{fontSize:'12px',background:'rgba(232,98,74,.15)',border:'1px solid rgba(232,98,74,.3)',borderRadius:'6px',padding:'2px 8px',color:'#e8624a',fontWeight:'500'}},tx.eventName));
          if(tx.eventDate) evLine.appendChild(SP({style:{fontSize:'12px',color:'#b0adc4'}},FD(tx.eventDate)));
          if(tx.eventLocation) evLine.appendChild(SP({style:{fontSize:'11px',color:'#9090a8',fontStyle:'italic'}},tx.eventLocation));
          c.appendChild(evLine);
        } else {
          c.appendChild(SP({style:{fontSize:'11px',color:'#9090a8',display:'block',marginTop:'4px',fontStyle:'italic'}},'Direct sale'));
        }
      }
      c.appendChild(P({style:{fontSize:'11px',color:'#9090a8',marginTop:'4px'}},

      ));
      if(tx.notes) c.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginTop:'3px',fontStyle:'italic'}},tx.notes));
      listContainer.appendChild(c);
    });
  }
  renderList();
  return w;
}
function merchAnalysis(){
  var w=D({style:{background:'#14141e',padding:'4px',borderRadius:'8px',minHeight:'100px'}});
  w.appendChild(P({style:{fontSize:'14px',fontWeight:'500',color:'#f0ece4',marginBottom:'1rem'}},'Sales Analysis & Intelligence'));
  var txs=S.merch.transactions.filter(function(t){return t.kind==='sale';});
  if(txs.length<1){ w.appendChild(D({cls:'empty'},'Record at least one sale to see analysis.')); return w; }

  // -- helpers ---------------------------------------------------------------
  function getSeason(ts){
    var m=new Date(ts).getMonth();
    if(m>=2&&m<=4) return 'Spring';
    if(m>=5&&m<=7) return 'Summer';
    if(m>=8&&m<=10) return 'Fall';
    return 'Winter';
  }
  function getMonth(ts){ return new Date(ts).getMonth(); }
  function getMonthName(m){ return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m]; }
  function linReg(xVals,yVals){
    var n=xVals.length; if(n<2) return {m:0,b:yVals[0]||0,r2:0};
    var xm=xVals.reduce(function(s,v){return s+v;},0)/n;
    var ym=yVals.reduce(function(s,v){return s+v;},0)/n;
    var num=0,den=0,ssRes=0,ssTot=0;
    for(var i=0;i<n;i++){num+=(xVals[i]-xm)*(yVals[i]-ym);den+=(xVals[i]-xm)*(xVals[i]-xm);}
    var m=den>0?num/den:0, b=ym-m*xm;
    yVals.forEach(function(y,i){ssRes+=Math.pow(y-(m*xVals[i]+b),2);ssTot+=Math.pow(y-ym,2);});
    var r2=ssTot>0?Math.max(0,1-ssRes/ssTot):0;
    return {m:m,b:b,r2:r2};
  }
  function barChart(container,entries,colorFn){
    var maxVal=entries.reduce(function(mx,e){return Math.max(mx,e.val);},0)||1;
    entries.forEach(function(e){
      var row=D({style:{marginBottom:'9px'}});
      row.appendChild(D({style:{display:'flex',justifyContent:'space-between',fontSize:'12px',marginBottom:'3px'}},[
        SP({style:{color:'#f0ece4',fontWeight:'500',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'60%'}},e.label),
        SP({style:{color:'#c8c5d8',flexShrink:'0'}},e.detail)
      ]));
      var track=D({style:{height:'8px',background:'rgba(255,255,255,.15)',borderRadius:'4px',overflow:'hidden'}});
      var fill=D({style:{height:'100%',width:Math.round(e.val/maxVal*100)+'%',background:colorFn?colorFn(e):'#e8624a',borderRadius:'4px'}});
      track.appendChild(fill); row.appendChild(track); container.appendChild(row);
    });
  }
  function sectionHead(txt){ return P({style:{fontSize:'14px',color:'#e8624a',fontWeight:'500',marginBottom:'12px',marginTop:'1.5rem',letterSpacing:'.3px'}},txt); }
  function insightBox(txt,color){
    var ins=D({style:{background:'rgba(232,98,74,.12)',border:'1px solid rgba(232,98,74,.35)',borderRadius:'8px',padding:'10px 14px',marginBottom:'8px',fontSize:'13px',lineHeight:'1.65',display:'flex',gap:'8px',alignItems:'flex-start'}});
    ins.appendChild(SP({style:{color:color||'#e8624a',flexShrink:'0',fontWeight:'700'}},'->'));
    ins.appendChild(SP({style:{color:'#f0ece4',lineHeight:'1.65'}},txt));
    return ins;
  }

  // -- aggregate base data ---------------------------------------------------
  var revenueByItem={}, unitsByItem={}, txsByItem={};
  var revBySeason={Spring:0,Summer:0,Fall:0,Winter:0};
  var unitsBySeason={Spring:0,Summer:0,Fall:0,Winter:0};
  var revByMonth=Array(12).fill(0), unitsByMonth=Array(12).fill(0);
  var revByLocation={}, unitsByLocation={}, txCountByLocation={};
  var revByEventName={}, unitsByEventName={}, txCountByEvent={};
  var clothingBySeason={Spring:{},Summer:{},Fall:{},Winter:{}};
  var clothingByMonth={}; for(var ci=0;ci<12;ci++) clothingByMonth[ci]={};

  txs.forEach(function(tx){
    var rev=(tx.price||0)*(tx.qty||1), qty=tx.qty||1;
    var seas=getSeason(tx.ts), mon=getMonth(tx.ts);
    var loc=tx.eventLocation||'No Location', evName=tx.eventName||'Direct Sale';
    var it=S.merch.items.find(function(i){return i.name===tx.itemName;});

    if(!revenueByItem[tx.itemName]) revenueByItem[tx.itemName]=0;
    if(!unitsByItem[tx.itemName]) unitsByItem[tx.itemName]=0;
    if(!txsByItem[tx.itemName]) txsByItem[tx.itemName]=[];
    revenueByItem[tx.itemName]+=rev; unitsByItem[tx.itemName]+=qty;
    txsByItem[tx.itemName].push(tx);

    revBySeason[seas]+=rev; unitsBySeason[seas]+=qty;
    revByMonth[mon]+=rev; unitsByMonth[mon]+=qty;

    if(!revByLocation[loc]) revByLocation[loc]=0;
    if(!unitsByLocation[loc]) unitsByLocation[loc]=0;
    if(!txCountByLocation[loc]) txCountByLocation[loc]=0;
    revByLocation[loc]+=rev; unitsByLocation[loc]+=qty; txCountByLocation[loc]++;

    if(!revByEventName[evName]) revByEventName[evName]=0;
    if(!unitsByEventName[evName]) unitsByEventName[evName]=0;
    if(!txCountByEvent[evName]) txCountByEvent[evName]=0;
    revByEventName[evName]+=rev; unitsByEventName[evName]+=qty; txCountByEvent[evName]++;

    if(it&&it.category==='clothing'&&tx.size&&tx.size!=='one'){
      if(!clothingBySeason[seas][tx.size]) clothingBySeason[seas][tx.size]=0;
      clothingBySeason[seas][tx.size]+=qty;
      if(!clothingByMonth[mon][tx.size]) clothingByMonth[mon][tx.size]=0;
      clothingByMonth[mon][tx.size]+=qty;
    }
  });

  var totalRev=txs.reduce(function(s,t){return s+(t.price||0)*(t.qty||1);},0);
  var totalUnits=txs.reduce(function(s,t){return s+(t.qty||1);},0);
  var itemNames=Object.keys(revenueByItem).sort(function(a,b){return revenueByItem[b]-revenueByItem[a];});
  var allInsights=[];

  // -- SUMMARY ---------------------------------------------------------------
  var sg=D({style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:'10px',marginBottom:'1.2rem'}});
  function statCard(lbl,val){
    var c=D({style:{background:'rgba(232,98,74,.08)',border:'1px solid rgba(232,98,74,0.25)',borderRadius:'10px',padding:'12px',textAlign:'center'}});
    c.appendChild(P({style:{fontSize:'12px',color:'#c8c5d8',marginBottom:'4px',textTransform:'uppercase',letterSpacing:'.5px'}},lbl));
    c.appendChild(P({style:{fontSize:'20px',fontWeight:'500',color:'#e8624a'}},val));
    return c;
  }
  sg.appendChild(statCard('Total Revenue','$'+totalRev.toFixed(2)));
  sg.appendChild(statCard('Units Sold',String(totalUnits)));
  sg.appendChild(statCard('Transactions',String(txs.length)));
  sg.appendChild(statCard('Products',String(itemNames.length)));
  var avgTx=txs.length>0?totalRev/txs.length:0;
  sg.appendChild(statCard('Avg Sale','$'+avgTx.toFixed(2)));
  w.appendChild(sg);

  // -- TOP SELLERS ------------------------------------------------------------
  if(itemNames.length>0){
    w.appendChild(sectionHead('Top Sellers by Revenue'));
    var topChart=D({});
    barChart(topChart, itemNames.slice(0,7).map(function(n){
      return {label:n,val:revenueByItem[n],detail:'$'+revenueByItem[n].toFixed(2)+' ('+unitsByItem[n]+' units)'};
    }), null);
    w.appendChild(topChart);
    allInsights.push({text:itemNames[0]+' leads all products -- ensure consistent stock levels.',color:'#e8624a'});
    if(itemNames.length>1){
      var top=revenueByItem[itemNames[0]], second=revenueByItem[itemNames[1]];
      if(top>second*2) allInsights.push({text:itemNames[0]+' outsells #2 by more than 2x. Consider creating variants or a bundle featuring it.',color:'#e8624a'});
    }
    // Low performers
    var lowSellers=itemNames.filter(function(n){return unitsByItem[n]<=1;});
    if(lowSellers.length>0) allInsights.push({text:lowSellers.join(', ')+(lowSellers.length===1?' has':' have')+' sold only 1 unit. Consider a price drop, bundle promotion, or discontinuation.',color:'#e67e22'});
  }

  // -- SEASONAL ANALYSIS ------------------------------------------------------
  var seasons=['Spring','Summer','Fall','Winter'];
  var seasonColors={Spring:'#2ecc71',Summer:'#f39c12',Fall:'#e67e22',Winter:'#87b7e8'};
  var hasSeasonData=seasons.some(function(s){return revBySeason[s]>0;});
  if(hasSeasonData){
    w.appendChild(sectionHead('Seasonal Performance'));
    var seasGrid=D({style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px',marginBottom:'1rem'}});
    seasons.forEach(function(s){
      var c=D({style:{textAlign:'center',background:'rgba(255,255,255,.04)',borderRadius:'8px',padding:'10px 4px',borderTop:'3px solid '+seasonColors[s]}});
      c.appendChild(P({style:{fontSize:'12px',color:seasonColors[s],marginBottom:'3px',fontWeight:'600'}},s));
      c.appendChild(P({style:{fontSize:'16px',fontWeight:'600',color:'#ffffff'}},'$'+revBySeason[s].toFixed(0)));
      c.appendChild(P({style:{fontSize:'12px',color:'#c8c5d8'}},unitsBySeason[s]+' units'));
      seasGrid.appendChild(c);
    });
    w.appendChild(seasGrid);

    var topSeason=seasons.reduce(function(best,s){return revBySeason[s]>revBySeason[best]?s:best;},'Spring');
    var lowSeason=seasons.filter(function(s){return revBySeason[s]>0;}).reduce(function(low,s){return revBySeason[s]<revBySeason[low]?s:low;},topSeason);
    allInsights.push({text:topSeason+' is your strongest season ($'+revBySeason[topSeason].toFixed(2)+' revenue). Plan inventory replenishment before '+topSeason+' events.',color:seasonColors[topSeason]});
    if(lowSeason!==topSeason&&revBySeason[lowSeason]>0) allInsights.push({text:lowSeason+' is your slowest season. Consider targeted promotions or limited '+lowSeason.toLowerCase()+'-themed items.',color:seasonColors[lowSeason]});

    // Seasonal clothing breakdown
    var hasSeasonClothing=seasons.some(function(s){return Object.keys(clothingBySeason[s]).length>0;});
    if(hasSeasonClothing){
      w.appendChild(sectionHead('Clothing by Season'));
      var warmItems=['hoodies','sweaters','crewnecks','jean jackets'];
      var warmSizes=['L','XL','2XL','3XL'];
      seasons.forEach(function(seas){
        var sd=clothingBySeason[seas];
        var sizes=Object.keys(sd);
        if(!sizes.length) return;
        var total=sizes.reduce(function(s,k){return s+sd[k];},0);
        var block=D({style:{marginBottom:'10px',padding:'8px 12px',background:'rgba(255,255,255,.03)',borderRadius:'8px',borderLeft:'3px solid '+seasonColors[seas]}});
        block.appendChild(P({style:{fontSize:'12px',color:seasonColors[seas],fontWeight:'500',marginBottom:'6px'}},seas+' -- '+total+' clothing units'));
        var szRow=D({style:{display:'flex',flexWrap:'wrap',gap:'6px'}});
        SIZES.forEach(function(sz){
          if(!sd[sz]) return;
          var pct=Math.round(sd[sz]/total*100);
          szRow.appendChild(D({style:{fontSize:'11px',color:'#c8c5d8',background:'rgba(255,255,255,.06)',borderRadius:'4px',padding:'2px 7px'}},sz+': '+sd[sz]+' ('+pct+'%)'));
        });
        block.appendChild(szRow);
        w.appendChild(block);
        // Winter/fall = heavy clothing insight
        if((seas==='Winter'||seas==='Fall')&&total>0){
          var heavyTotal=warmSizes.reduce(function(s,sz){return s+(sd[sz]||0);},0);
          if(heavyTotal/total>0.5) allInsights.push({text:'In '+seas+', larger sizes (L+) make up '+Math.round(heavyTotal/total*100)+'% of clothing sales. Stock heavier and larger cuts for cold-weather events.',color:seasonColors[seas]});
        }
      });
      // Seasonal hoodie/sweater pattern
      var winterHeavy=(clothingBySeason['Winter']['L']||0)+(clothingBySeason['Winter']['XL']||0)+(clothingBySeason['Fall']['L']||0)+(clothingBySeason['Fall']['XL']||0);
      var summerHeavy=(clothingBySeason['Summer']['L']||0)+(clothingBySeason['Summer']['XL']||0);
      if(winterHeavy>summerHeavy*1.5) allInsights.push({text:'Heavier clothing (hoodies, sweaters, crewnecks) peaks in Fall/Winter -- align production runs to arrive by September.',color:'#87b7e8'});
    }
  }

  // -- MONTHLY TREND ----------------------------------------------------------
  var activeMonths=[]; for(var mi=0;mi<12;mi++){if(revByMonth[mi]>0)activeMonths.push(mi);}
  if(activeMonths.length>=2){
    w.appendChild(sectionHead('Monthly Revenue Trend'));
    var monthChart=D({});
    barChart(monthChart, activeMonths.map(function(mi){
      return {label:getMonthName(mi),val:revByMonth[mi],detail:'$'+revByMonth[mi].toFixed(0)+' / '+unitsByMonth[mi]+' units'};
    }), function(e){ return '#e8624a'; });
    w.appendChild(monthChart);
    // Linear regression on months
    var regX=activeMonths, regY=activeMonths.map(function(mi){return revByMonth[mi];});
    var reg=linReg(regX,regY);
    if(reg.m>5) allInsights.push({text:'Monthly revenue shows an upward trend (R\u00B2='+reg.r2.toFixed(2)+'). Growth momentum is building -- keep stock levels ahead of demand.',color:'#2ecc71'});
    else if(reg.m<-5) allInsights.push({text:'Monthly revenue is declining. Look at which months underperform and investigate event attendance or item appeal for those periods.',color:'#e74c3c'});
    var peakMonth=activeMonths.reduce(function(best,mi){return revByMonth[mi]>revByMonth[best]?mi:best;},activeMonths[0]);
    allInsights.push({text:getMonthName(peakMonth)+' is your peak sales month. Ensure maximum inventory before this period each year.',color:'#e8624a'});
  }

  // -- EVENT NAME ANALYSIS ----------------------------------------------------
  var evNames=Object.keys(revByEventName).sort(function(a,b){return revByEventName[b]-revByEventName[a];});
  var recurringEvents=evNames.filter(function(n){return txCountByEvent[n]>=2&&n!=='Direct Sale';});
  if(evNames.length>1){
    w.appendChild(sectionHead('Revenue by Event'));
    var evChart=D({});
    barChart(evChart, evNames.slice(0,8).map(function(n){
      return {label:n,val:revByEventName[n],detail:'$'+revByEventName[n].toFixed(0)+' ('+txCountByEvent[n]+' txns)'};
    }),null);
    w.appendChild(evChart);
    var topEv=evNames[0];
    if(topEv!=='Direct Sale') allInsights.push({text:'"'+topEv+'" drives the most sales. Prioritize merch availability and table setup for this event type.',color:'#e8624a'});
    if(revByEventName['Direct Sale']>0){
      var directPct=Math.round(revByEventName['Direct Sale']/totalRev*100);
      allInsights.push({text:directPct+'% of revenue comes from direct (non-event) sales. '+(directPct>30?'Consider an online shop or dedicated sales hours.':'Growing your event presence could significantly boost revenue.'),color:'#87b7e8'});
    }
  }

  // -- RECURRING EVENT TRENDS -------------------------------------------------
  if(recurringEvents.length>0){
    w.appendChild(sectionHead('Recurring Event Trends'));
    recurringEvents.slice(0,4).forEach(function(evName){
      var evTxs=txs.filter(function(t){return (t.eventName||'Direct Sale')===evName;});
      // Group by event date
      var byDate={};
      evTxs.forEach(function(t){
        var d=t.eventDate||new Date(t.ts).toISOString().split('T')[0];
        if(!byDate[d]) byDate[d]={rev:0,units:0};
        byDate[d].rev+=(t.price||0)*(t.qty||1);
        byDate[d].units+=(t.qty||1);
      });
      var dates=Object.keys(byDate).sort();
      var block=D({style:{background:'rgba(255,255,255,.03)',border:'1px solid rgba(232,98,74,0.25)',borderRadius:'8px',padding:'10px 12px',marginBottom:'10px'}});
      block.appendChild(P({style:{fontWeight:'500',color:'#f0ece4',marginBottom:'6px',fontSize:'13px'}},evName+' ('+dates.length+' instances)'));
      if(dates.length>=2){
        var revVals=dates.map(function(d){return byDate[d].rev;});
        var reg=linReg(dates.map(function(_,i){return i;}),revVals);
        var trendLabel=reg.m>1?'growing':'declining or flat';
        var trendColor=reg.m>1?'#2ecc71':'#e67e22';
        block.appendChild(P({style:{fontSize:'12px',color:trendColor,marginBottom:'6px'}},'Revenue per instance is '+trendLabel+' (slope: $'+reg.m.toFixed(2)+'/event, R\u00B2='+reg.r2.toFixed(2)+')'));
        // Mini chart
        var mini=D({});
        barChart(mini, dates.map(function(d){return {label:FD(d),val:byDate[d].rev,detail:'$'+byDate[d].rev.toFixed(0)};}), function(){return trendColor;});
        block.appendChild(mini);
        if(reg.m>1) allInsights.push({text:'"'+evName+'" shows growing sales each time it recurs. Increase merch table inventory with each occurrence.',color:'#2ecc71'});
        else if(reg.m<-1) allInsights.push({text:'"'+evName+'" shows declining sales per instance. Try new items or a discounted bundle at this event type.',color:'#e67e22'});
      } else {
        block.appendChild(P({style:{fontSize:'12px',color:'#c8c5d8'}},'Only 1 instance recorded -- need more data for trend.'));
        var rev=byDate[dates[0]]?byDate[dates[0]].rev:0;
        block.appendChild(P({style:{fontSize:'13px',color:'#e8624a'}},'Revenue: $'+rev.toFixed(2)));
      }
      w.appendChild(block);
    });
  }

  // -- LOCATION ANALYSIS ------------------------------------------------------
  var locations=Object.keys(revByLocation).filter(function(l){return l!=='No Location';});
  if(locations.length>1){
    w.appendChild(sectionHead('Revenue by Location'));
    locations.sort(function(a,b){return revByLocation[b]-revByLocation[a];});
    var locChart=D({});
    barChart(locChart, locations.slice(0,6).map(function(l){
      return {label:l,val:revByLocation[l],detail:'$'+revByLocation[l].toFixed(0)+' ('+txCountByLocation[l]+' txns)'};
    }),null);
    w.appendChild(locChart);
    var topLoc=locations[0];
    allInsights.push({text:'"'+topLoc+'" is your highest-revenue venue. Prioritize a well-stocked merch table at this location.',color:'#e8624a'});
    if(locations.length>=2){
      var lowLoc=locations[locations.length-1];
      allInsights.push({text:'"'+lowLoc+'" sees the lowest sales. Consider a targeted promotion or reduced merch selection at this venue.',color:'#e67e22'});
    }
  }

  // -- CLOTHING SIZE DISTRIBUTION ---------------------------------------------
  var clothingTxs=txs.filter(function(t){var it=S.merch.items.find(function(i){return i.name===t.itemName;});return it&&it.category==='clothing'&&t.size&&t.size!=='one';});
  if(clothingTxs.length>0){
    var clothingSales={};
    clothingTxs.forEach(function(t){if(!clothingSales[t.size])clothingSales[t.size]=0;clothingSales[t.size]+=(t.qty||1);});
    var totalClothing=Object.values(clothingSales).reduce(function(s,v){return s+v;},0);
    w.appendChild(sectionHead('Overall Clothing Size Distribution'));
    var szGrid=D({style:{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:'6px',marginBottom:'10px'}});
    SIZES.forEach(function(sz){
      var qty=clothingSales[sz]||0, pct=totalClothing>0?Math.round(qty/totalClothing*100):0;
      var c=D({style:{textAlign:'center',background:'rgba(255,255,255,.04)',borderRadius:'8px',padding:'8px 4px',borderBottom:'2px solid '+(pct>20?'#e8624a':'rgba(255,255,255,.15)')}});
      c.appendChild(P({style:{fontSize:'11px',color:'#c8c5d8',marginBottom:'3px'}},sz));
      c.appendChild(P({style:{fontSize:'16px',fontWeight:'500',color:'#f0ece4'}},String(qty)));
      c.appendChild(P({style:{fontSize:'12px',color:'#c8c5d8'}},pct+'%'));
      szGrid.appendChild(c);
    });
    w.appendChild(szGrid);
    var topSize=SIZES.reduce(function(best,s){return (clothingSales[s]||0)>(clothingSales[best]||0)?s:best;},SIZES[0]);
    var lowSize=SIZES.filter(function(s){return clothingSales[s]>0;}).reduce(function(low,s){return clothingSales[s]<clothingSales[low]?s:low;},topSize);
    allInsights.push({text:'Size '+topSize+' is your top clothing size ('+Math.round((clothingSales[topSize]||0)/totalClothing*100)+'% of units). Maintain the highest stock for this size.',color:'#e8624a'});
    var zeroSizes=SIZES.filter(function(s){return !clothingSales[s];});
    if(zeroSizes.length>0) allInsights.push({text:'Sizes '+zeroSizes.join(', ')+' have zero recorded sales. Consider reducing stock or removing from future production runs.',color:'#e67e22'});
  }

  // -- PER-ITEM DETAIL --------------------------------------------------------
  if(itemNames.length>0){
    w.appendChild(sectionHead('Per-Item Intelligence'));
    itemNames.slice(0,6).forEach(function(name){
      var itTxs=txsByItem[name]||[];
      var it=S.merch.items.find(function(i){return i.name===name;});
      var block=D({style:{background:'rgba(255,255,255,.03)',border:'1px solid rgba(232,98,74,0.25)',borderRadius:'8px',padding:'10px 12px',marginBottom:'8px'}});
      var rev=revenueByItem[name], units=unitsByItem[name];
      block.appendChild(D({style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'6px'}}),[
        SP({style:{fontWeight:'500',color:'#f0ece4',fontSize:'13px'}},name),
        SP({style:{color:'#e8624a',fontSize:'13px'}},'$'+rev.toFixed(2)+' / '+units+' units')
      ]);
      // Season breakdown for this item
      var itemSeasons={Spring:0,Summer:0,Fall:0,Winter:0};
      itTxs.forEach(function(t){itemSeasons[getSeason(t.ts)]+=(t.qty||1);});
      var hasItemSeasons=Object.values(itemSeasons).some(function(v){return v>0;});
      if(hasItemSeasons){
        var seasRow=D({style:{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'5px'}});
        seasons.forEach(function(s){
          if(itemSeasons[s]>0) seasRow.appendChild(SP({style:{fontSize:'12px',background:'rgba(255,255,255,.1)',borderRadius:'4px',padding:'3px 8px',color:seasonColors[s],fontWeight:'500'}},s+': '+itemSeasons[s]));
        });
        block.appendChild(seasRow);
      }
      // Event breakdown for this item
      var itemByEvent={};
      itTxs.forEach(function(t){var en=t.eventName||'Direct Sale';if(!itemByEvent[en])itemByEvent[en]=0;itemByEvent[en]+=(t.qty||1);});
      var evList=Object.keys(itemByEvent).sort(function(a,b){return itemByEvent[b]-itemByEvent[a];});
      if(evList.length>1){
        var evRow=D({style:{fontSize:'11px',color:'#c8c5d8',marginBottom:'3px'}});
        evRow.textContent='Best event: "'+evList[0]+'" ('+itemByEvent[evList[0]]+' units)';
        block.appendChild(evRow);
      }
      // Trend for this item over time (by transaction index)
      if(itTxs.length>=3){
        var itemRevByTx=itTxs.map(function(t){return (t.price||0)*(t.qty||1);});
        var reg=linReg(itemRevByTx.map(function(_,i){return i;}),itemRevByTx);
        var arrow=reg.m>0?'\u2191 Growing':'\u2193 Declining';
        var tColor=reg.m>0?'#2ecc71':'#e74c3c';
        block.appendChild(P({style:{fontSize:'11px',color:tColor}},arrow+' over time'));
      }
      w.appendChild(block);
    });
  }

  // -- ALL INSIGHTS -----------------------------------------------------------
  if(allInsights.length>0){
    w.appendChild(sectionHead('All Insights & Recommendations'));
    allInsights.forEach(function(ins){ w.appendChild(insightBox(ins.text,ins.color)); });
  }

  return w;
}

function mMerchAdj(mo,item,kind){

  var notes='', eventName='', eventLocation='', eventDate='';

  if(isClothing){
    mo.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'8px'}},'Current stock in parentheses'));
    var szGrid=D({style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:'1rem'}});

      var grp=D({});
      grp.appendChild(LBL({style:{fontSize:'11px',color:'#b0adc4',display:'block',marginBottom:'3px'}},sz+' ('+((item.sizes[sz])||0)+')'));
      var inp=INP({type:'number',placeholder:'0'});
      inp.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:6px;padding:6px 8px;color:#1a1a1a;font-size:14px;font-family:sans-serif;outline:none';
      (function(s){inp.addEventListener('input',function(e){vals[s]=e.target.value;});})(sz);
      grp.appendChild(inp); szGrid.appendChild(grp);
    });
    mo.appendChild(szGrid);
  } else {
    var cur=(item.sizes['one']||0);
    mo.appendChild(FLD('Quantity (current: '+cur+')',INP({type:'number',placeholder:'0',input:function(e){vals['one']=e.target.value;}})));
  }
  // For sales, capture event context for analysis
  if(kind==='sale'){
    mo.appendChild(HR());
    mo.appendChild(P({style:{fontSize:'12px',color:'#b0adc4',marginBottom:'8px'}},'Event context (optional -- used for analysis)'));
    // Quick-pick from existing events
    var td=TODAY(); var toFar=new Date(); toFar.setDate(toFar.getDate()+30);
    var recentEvs=allInstances(new Date(Date.now()-90*86400000).toISOString().split('T')[0],toFar.toISOString().split('T')[0]);
    if(recentEvs.length>0){
      var evPick=SEL({change:function(e){
        var v=e.target.value;
        if(!v) return;
        var parts=v.split('||');
        eventName=parts[0]||''; eventLocation=parts[1]||''; eventDate=parts[2]||'';
        // update manual fields visually
        document.querySelectorAll('.merch-ev-name').forEach(function(el){el.value=eventName;});
        document.querySelectorAll('.merch-ev-loc').forEach(function(el){el.value=eventLocation;});
        document.querySelectorAll('.merch-ev-date').forEach(function(el){el.value=eventDate;});
      }});
      evPick.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none;margin-bottom:8px';
      evPick.appendChild(OPT({value:''},'Quick-pick from recent events...'));
      recentEvs.forEach(function(ev){
        evPick.appendChild(OPT({value:ev.title+'||'+ev.location+'||'+ev.date},ev.title+' -- '+FD(ev.date)));
      });
      mo.appendChild(evPick);
    }
    var evNameInp=INP({type:'text',placeholder:'e.g. Sunday Service'});
    evNameInp.className='merch-ev-name';
    evNameInp.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
    evNameInp.addEventListener('input',function(e){eventName=e.target.value;});
    mo.appendChild(D({cls:'f'},[LBL({},'Event Name'),evNameInp]));
    var evLocInp=INP({type:'text',placeholder:'e.g. The Midnight Gem'});
    evLocInp.className='merch-ev-loc';
    evLocInp.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
    evLocInp.addEventListener('input',function(e){eventLocation=e.target.value;});
    mo.appendChild(D({cls:'f'},[LBL({},'Event Location'),evLocInp]));
    var evDateInp=INP({type:'date'});
    evDateInp.className='merch-ev-date';
    evDateInp.style.cssText='width:100%;background:#fff;border:1px solid #ccc;border-radius:7px;padding:8px 12px;color:#1a1a1a;font-size:13px;font-family:sans-serif;outline:none';
    evDateInp.addEventListener('input',function(e){eventDate=e.target.value;});
    mo.appendChild(D({cls:'f'},[LBL({},'Event Date'),evDateInp]));
    mo.appendChild(HR());
  }
  mo.appendChild(FLD('Notes (optional)',INP({type:'text',input:function(e){notes=e.target.value;}})));
  mo.appendChild(err);
  mo.appendChild(D({cls:'mfooter'},[
    BTN({cls:'btn bo',click:closeM},'Cancel'),
    BTN({cls:'btn bg',click:function(){
      var hasSomething=sizes.some(function(s){return vals[s]!==''&&!isNaN(parseInt(vals[s]));});
      if(!hasSomething){err.textContent='Enter at least one quantity.';return;}
      sizes.forEach(function(sz){
        var v=parseInt(vals[sz]);
        if(isNaN(v)||vals[sz]==='') return;
        var prev=item.sizes[sz]||0;
        if(kind==='cycle') item.sizes[sz]=Math.max(0,v);
        else if(kind==='produce') item.sizes[sz]=prev+Math.abs(v);
        else if(kind==='sale') item.sizes[sz]=Math.max(0,prev-Math.abs(v));
        if(v>0){
          var tx={id:S.merch.nTx++,itemId:item.id,itemName:item.name,kind:kind,size:sz,qty:Math.abs(v),price:item.price,notes:notes,ts:Date.now()};
          if(kind==='sale'){tx.eventName=eventName||null;tx.eventLocation=eventLocation||null;tx.eventDate=eventDate||null;}
          S.merch.transactions.push(tx);
        }
      });
      save(); closeM();
    }},'Save')
  ]));
}

auth.onAuthStateChanged(function(firebaseUser){
  if(firebaseUser){
    loadState(function(){
      // Find profile by uid OR email -- never overwrite existing data
      var profile = USERS.find(function(u){
        return sameId(u.uid,firebaseUser.uid)||u.email===firebaseUser.email;
      });
      if(!profile){
        // New user logging in for the first time -- add to existing list, don't replace it
        profile = {
          id: String(firebaseUser.uid),
          uid: String(firebaseUser.uid),
          name: firebaseUser.displayName || firebaseUser.email.split('@')[0],
          email: firebaseUser.email,
          roles: USERS.length===0?['admin']:(firebaseUser.emailVerified?['public']:['unverified']),
          rec: firebaseUser.email
        };
        USERS.push(profile);
        saveUsers(); // append only -- existing users untouched
      } else {
        // Existing user -- update uid if it changed (e.g. Netlify -> GitHub Pages migration)
        var oldUid = String(profile.uid||profile.id||'');
        var newUid = String(firebaseUser.uid);
        profile.uid = newUid;
        profile.id  = newUid;
        profile.lastLogin = Date.now();
        // Upgrade unverified public account once email is verified
        if(firebaseUser.emailVerified&&(profile.roles||[]).indexOf('unverified')>=0){
          profile.roles=['public'];
          saveUsers();
        }
        // Block unverified public accounts
        if((profile.roles||[]).indexOf('unverified')>=0&&!firebaseUser.emailVerified){
          auth.signOut();
          render();
          return;
        }
        profile.lastLogin = Date.now();
        if(oldUid !== newUid) {
          // UID changed -- update all event/group/room references from old to new
          function swapUid(x){ return String(x)===oldUid ? newUid : x; }
          (S.templates||[]).forEach(function(t){
            t.users=(t.users||[]).map(swapUid);
            (t.teams||[]).forEach(function(tm){
              tm.members=(tm.members||[]).map(swapUid);
              tm.leaders=(tm.leaders||[]).map(swapUid);
            });
          });
          (S.groups||[]).forEach(function(g){ g.members=(g.members||[]).filter(function(x){return x!=null&&x!==''&&x!=='null';}).map(swapUid); });
          (S.rooms||[]).forEach(function(r){ r.members=(r.members||[]).map(swapUid); });
          saveUsers(); // persist corrected UID
          // save() will be called later after full migration, persisting event fixes
        }
      }
      S.user = profile;
      // Always set correct default tab based on role on each login
      var r2=(S.user.roles||[S.user.role||'regular']);
      if(isAdmin(S.user)){
        if(!S.tab||S.tab==='events'||S.tab==='home') S.tab='dashboard';
      } else if(r2.indexOf('security')>=0){
        S.tab='security';
      } else if(r2.indexOf('public')>=0){
        S.tab='pubhome';
      } else {
        S.tab='home';
      }
      S.availExpanded = false;
      S.availStepIdx = 0;
      S.availFocusKey = null;
      S.coordAdminTab = S.coordAdminTab||'matrix';
      S.improveTab = S.improveTab||'issues';
      S.planningBoardId = S.planningBoardId||null;
      S.issueTab = S.issueTab||'open';
      // Normalize all stored IDs to strings for consistent comparisons
      USERS.forEach(function(u){ u.id=String(u.uid||u.id); });
      // (group cleanup moved to after STATE_LOADED)
      (S.groups||[]).forEach(function(g){
        g.members=(g.members||[]).map(function(x){return x==null?x:String(x);});
      });
      (S.rooms||[]).forEach(function(r){
        r.members=(r.members||[]).map(function(x){return x==null?x:String(x);});
      });
      // -- MIGRATE OLD NUMERIC IDs TO FIREBASE STRING UIDs ------------------
      // Old data stored users as numeric IDs (1,2,3...).
      // New data uses Firebase string UIDs. Map them using email as the bridge.
      function migrateId(oldId){
        var sid = String(oldId);
        // Already a Firebase UID (long string, not just a small number)
        if(sid.length > 6) return sid;
        // Small number -- look up the user by their old numeric id
        var match = USERS.find(function(u){
          return String(u.id)===sid || String(u.uid)===sid;
        });
        return match ? String(match.uid||match.id) : sid;
      }
      // Migrate group members
      (S.groups||[]).forEach(function(g){
        g.members=(g.members||[]).map(function(x){return x==null?x:migrateId(x);});
      });
      // Migrate room members
      (S.rooms||[]).forEach(function(r){
        r.members=(r.members||[]).map(function(x){return x==null?x:migrateId(x);});
      });
      // Migrate event users and team members
      (S.templates||[]).forEach(function(t){
        t.users=(t.users||[]).map(function(x){return x==null?x:migrateId(x);});
        (t.teams||[]).forEach(function(tm){
          tm.members=(tm.members||[]).map(function(x){return x==null?x:migrateId(x);});
          tm.leaders=(tm.leaders||[]).map(function(x){return x==null?x:migrateId(x);});
        });
      });
      // Migrate task assignees and leads
      (S.tasks||[]).forEach(function(t){
        if(t.assignees) t.assignees=t.assignees.map(function(x){return x==null?x:migrateId(x);});
        if(t.lead) t.lead=migrateId(t.lead);
        if(t.by) t.by=migrateId(t.by);
        if(t.to) t.to=migrateId(t.to);
      });
      // Migrate notifications keys
      var newNotifs={};
      Object.keys(S.notifs||{}).forEach(function(k){
        var newKey=migrateId(k);
        newNotifs[newKey]=(S.notifs[k]||[]);
      });
      S.notifs=newNotifs;
      // Save migrated data back so future loads are already correct
      // Clean null/invalid members from all groups before saving
      var groupsCleaned=false;
      (S.groups||[]).forEach(function(g){
        var before=(g.members||[]).length;
        g.members=(g.members||[]).filter(function(x){return x!=null&&x!==''&&String(x)!=='null'&&String(x)!=='undefined'&&UN(x)!=='?';});
        if(g.members.length!==before) groupsCleaned=true;
      });
      STATE_LOADED = true; // data is now fully loaded -- safe to save
      save(); // persist the migrated IDs + group cleanup
      // Check for pending availability reminders
      checkAvailReminders();
      startRealtimeListener();
      requestPushPermission();
      render();
      // Show onboarding if user hasn't dismissed it
      checkAndShowOnboarding(null);
    });
  } else {
    S.user = null;
    STATE_LOADED = false;
    if(unsubscribe){ unsubscribe(); unsubscribe=null; }
    render();
  }
});
</script>
</body>
</html>
