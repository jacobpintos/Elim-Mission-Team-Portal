name: Deploy Web App

on:
  push:
    branches: [main]
    paths:
      - 'mission-portal-app/app/**'
      - 'mission-portal-app/src/**'
      - 'mission-portal-app/assets/**'
      - 'mission-portal-app/app.config.ts'
      - 'mission-portal-app/tamagui.config.ts'
      - 'mission-portal-app/package.json'
      - 'firebase.json'
      - '.firebaserc'
      - 'mission-portal-app/storage.rules'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    name: Build & Deploy Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mission-portal-app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: mission-portal-app

      - name: Build web app
        run: npx expo export --platform web
        working-directory: mission-portal-app
        env:
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_MAPBOX_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_TOKEN }}
          # Published contact details rendered by the Privacy Policy and Terms of
          # Use. Deliberately literal rather than secrets — App Store Review
          # Guideline 1.2 requires this information to be public. Keep in sync
          # with the same keys in mission-portal-app/eas.json, which covers the
          # native builds.
          EXPO_PUBLIC_SUPPORT_EMAIL: sunny.singh@thewellia.com
          EXPO_PUBLIC_ORG_ADDRESS: 'PO Box 552 North Liberty, IA 52317'


      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Create hosting site if not exists
        run: npx firebase-tools hosting:sites:create ${{ secrets.FIREBASE_PROJECT_ID }} --project ${{ secrets.FIREBASE_PROJECT_ID }} 2>&1 || true

      - name: Deploy to Firebase Hosting and Storage Rules
        working-directory: mission-portal-app
        run: |
          for attempt in 1 2 3; do
            npx firebase-tools deploy --only hosting,storage --project ${{ secrets.FIREBASE_PROJECT_ID }} && break
            if [ $attempt -lt 3 ]; then
              echo "Attempt $attempt failed — retrying in 30s..."
              sleep 30
            else
              echo "All attempts failed."
              exit 1
            fi
          done
