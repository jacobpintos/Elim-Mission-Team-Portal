name: Deploy Web App

on:
  push:
    branches: [main]
    paths:
      - 'mission-portal-app/app/**'
      - 'mission-portal-app/src/**'
      - 'mission-portal-app/assets/**'
      - 'mission-portal-app/app.config.ts'
      - 'mission-portal-app/tamagui.config.ts'
      - 'mission-portal-app/package.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    name: Build & Deploy Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mission-portal-app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: mission-portal-app

      - name: Build web app
        run: npx expo export --platform web
        working-directory: mission-portal-app
        env:
          EXPO_PUBLIC_ENV: production

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Create hosting site if not exists
        run: npx firebase-tools hosting:sites:create ${{ secrets.FIREBASE_PROJECT_ID }} --project ${{ secrets.FIREBASE_PROJECT_ID }} 2>&1 || true

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }}
        working-directory: mission-portal-app
