name: EAS Build

# Native builds are started from here rather than a workstation because the
# install alone is ~1.6 GB — more than Cloud Shell's 5 GB home can hold
# alongside npm's cache. The build itself runs on EAS; this job only installs
# enough to evaluate app.config.ts and hand the project over.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        options: [ios, android, all]
        default: ios
      profile:
        description: 'eas.json build profile'
        type: choice
        options: [production, staging, preview]
        default: production
      submit:
        description: 'Submit to the store when the build finishes'
        type: boolean
        default: false

jobs:
  build:
    name: EAS Build (${{ inputs.platform }} / ${{ inputs.profile }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mission-portal-app/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Matches deploy-web.yml — this project needs the legacy resolver.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: mission-portal-app

      # --no-wait returns as soon as the build is queued. The job would
      # otherwise sit for the 20-40 minutes EAS takes, burning Actions minutes
      # to watch a progress bar; the run URL is printed either way.
      - name: Build
        run: |
          eas build \
            --profile ${{ inputs.profile }} \
            --platform ${{ inputs.platform }} \
            --non-interactive \
            ${{ inputs.submit && '--auto-submit' || '--no-wait' }}
        working-directory: mission-portal-app
