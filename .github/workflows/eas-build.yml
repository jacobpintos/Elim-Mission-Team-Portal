name: EAS Build

# Native builds are started from here rather than a workstation because the
# install alone is ~1.6 GB — more than Cloud Shell's 5 GB home can hold
# alongside npm's cache. The build itself runs on EAS; this job only installs
# enough to evaluate app.config.ts and hand the project over.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        options: [ios, android, all]
        default: ios
      profile:
        description: 'eas.json build profile'
        type: choice
        options: [production, staging, preview]
        default: production
      submit:
        description: 'Submit to the store when the build finishes'
        type: boolean
        default: false
  # The same build, started by Ship to iPhones (./ship-ios.yml) when something
  # native changed or TestFlight's 90 days are nearly up.
  workflow_call:
    inputs:
      platform:
        type: string
        default: ios
      profile:
        type: string
        default: production
      submit:
        type: boolean
        default: false

jobs:
  build:
    name: EAS Build (${{ inputs.platform }} / ${{ inputs.profile }})
    runs-on: ubuntu-latest

    steps:
      # What this run was asked for, as GitHub passed it on from the Run
      # workflow form (or the API). A build that should have gone to
      # TestFlight and didn't shows here whether Submit arrived ticked.
      - name: Options received
        run: |
          echo "platform: ${{ inputs.platform }}"
          echo "profile:  ${{ inputs.profile }}"
          echo "submit:   ${{ inputs.submit }}"

      - name: Checkout
        uses: actions/checkout@v5

      # eas-cli pulls @oclif/plugin-autocomplete, which requires Node >= 22.
      # The action installs it with yarn, and yarn treats an unmet `engines`
      # as a hard error rather than a warning, so Node 20 fails the install
      # before the build is ever queued.
      #
      # This is only the machine that evaluates app.config.ts and hands the
      # project to EAS — it is unrelated to the Node the functions run on,
      # which is 24 (functions/package.json), as the deployed Cloud Functions
      # runtime is.
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mission-portal-app/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Matches deploy-web.yml — this project needs the legacy resolver.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: mission-portal-app

      # --no-wait returns as soon as the build is queued. The job would
      # otherwise sit for the 20-40 minutes EAS takes, burning Actions minutes
      # to watch a progress bar; the run URL is printed either way.
      - name: Build
        run: |
          set -o pipefail
          eas build \
            --profile ${{ inputs.profile }} \
            --platform ${{ inputs.platform }} \
            --non-interactive \
            ${{ inputs.submit && '--auto-submit' || '--no-wait' }} \
            2>&1 | tee "$RUNNER_TEMP/eas-build.log"
        working-directory: mission-portal-app

      # A failed build says little here ("Unknown error. See logs of the …
      # build phase"): the detail is in EAS's own log, on expo.dev. This
      # fetches that log and prints the expo-updates steps (with the
      # fingerprint diff when runtime versions disagree) and every error, so
      # it can be read from here.
      - name: On failure, what EAS said
        if: failure()
        run: |
          id=$(grep -o 'builds/[0-9a-f-]\{36\}' "$RUNNER_TEMP/eas-build.log" | tail -1 | cut -d/ -f2)
          if [ -z "$id" ]; then echo "No EAS build was started."; exit 0; fi
          eas build:view "$id" --json > "$RUNNER_TEMP/build.json" || exit 0
          node -e '
            const b = require(process.argv[1])
            for (const u of b.logFiles || []) console.log(u)
          ' "$RUNNER_TEMP/build.json" | while read -r url; do curl -fsSL "$url"; echo; done > "$RUNNER_TEMP/eas.log"
          node -e '
            const lines = require("fs").readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean)
            const out = []
            for (const line of lines) {
              let j
              try { j = JSON.parse(line) } catch { out.push(line); continue }
              const phase = j.phase || ""
              if (/EXPO_UPDATES|FINGERPRINT/.test(phase) || (j.level ?? 0) >= 50) out.push(`[${phase}] ${j.msg ?? ""}`)
            }
            console.log(out.slice(-300).join("\n") || "(nothing from the expo-updates steps, and no errors)")
          ' "$RUNNER_TEMP/eas.log"
        working-directory: mission-portal-app
