name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck, Lint & Bundle Budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mission-portal-app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The Node the Cloud Functions run on (functions/package.json), whose code
      # the unit tests cover too.
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mission-portal-app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The Firestore and Storage emulators the rules tests run against are
      # Java processes.
      - name: Set up Java for the Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Security rules tests
        run: npm run test:rules

      - name: Export web build
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: placeholder
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: placeholder
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: placeholder
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: placeholder
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: placeholder
          EXPO_PUBLIC_FIREBASE_APP_ID: placeholder
          EXPO_PUBLIC_SENTRY_DSN: placeholder
        run: npx expo export -p web --output-dir dist

      - name: Build service worker
        run: node scripts/build-service-worker.mjs dist

      # What the web build sends, gzipped, against a budget a little above its
      # size today, so it catches growth (scripts/check-bundle-size.mjs).
      - name: Bundle size budget check
        run: node scripts/check-bundle-size.mjs dist
