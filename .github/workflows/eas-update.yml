name: EAS Update

# Sends the app's JavaScript to installed apps over the air: no store build,
# no TestFlight. Phones download it the next time the app opens and start on
# it when they come back to the app after a while (src/lib/appUpdates.ts).
#
# Only builds whose native side matches take it (app.config.ts:
# runtimeVersion is a fingerprint of everything native). A change that needs
# native code (a new native module, an Expo upgrade) waits for the next
# EAS Build, and the update shows a different runtime version from the
# builds on the channel.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Which builds get it: the eas.json build profile they were built with'
        type: choice
        options: [production, staging]
        default: production
      platform:
        description: 'Platform'
        type: choice
        options: [ios, android, all]
        default: ios
      message:
        description: 'What changed (shown with the update on expo.dev). Blank: the latest commit.'
        type: string
        required: false

jobs:
  update:
    name: EAS Update (${{ inputs.platform }} / ${{ inputs.channel }})
    runs-on: ubuntu-latest

    steps:
      - name: Options received
        run: |
          echo "channel:  ${{ inputs.channel }}"
          echo "platform: ${{ inputs.platform }}"

      - name: Checkout
        uses: actions/checkout@v5

      # As for EAS Build: eas-cli needs Node >= 22.
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mission-portal-app/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: mission-portal-app

      # The app's settings (Firebase and the rest) are the build profile's env
      # in eas.json. A build is made with them; an update has to be too, or
      # the app it reaches can't sign in.
      - name: Build profile settings
        run: |
          node -e '
            const env = require("./eas.json").build[process.argv[1]].env || {}
            for (const [k, v] of Object.entries(env)) console.log(`${k}=${v}`)
          ' "${{ inputs.channel }}" >> "$GITHUB_ENV"
        working-directory: mission-portal-app

      - name: Update
        env:
          MESSAGE: ${{ inputs.message }}
          PLATFORM: ${{ inputs.platform }}
          CHANNEL: ${{ inputs.channel }}
          # The EAS environment for this channel (none of its variables are set
          # today; the build profile's, above, are what the app uses).
          EAS_ENVIRONMENT: ${{ inputs.channel == 'production' && 'production' || 'preview' }}
        run: |
          eas update \
            --channel "$CHANNEL" \
            --platform "$PLATFORM" \
            --environment "$EAS_ENVIRONMENT" \
            --message "${MESSAGE:-$(git log -1 --format=%s)}" \
            --non-interactive
        working-directory: mission-portal-app
