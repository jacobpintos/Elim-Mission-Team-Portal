name: Deploy Firebase

on:
  # Manual trigger from the GitHub Actions UI — checkboxes let you
  # deploy functions, rules, or both independently.
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy Cloud Functions'
        type: boolean
        default: true
      deploy_rules:
        description: 'Deploy Firestore Rules'
        type: boolean
        default: false
      deploy_storage_rules:
        description: 'Deploy Storage Rules'
        type: boolean
        default: false

  # Auto-deploy when the relevant source files land on main.
  push:
    branches: [main]
    paths:
      - 'mission-portal-app/functions/**'
      - 'mission-portal-app/firestore.rules'
      - 'mission-portal-app/storage.rules'
      - '.github/workflows/deploy-firebase.yml'

jobs:
  deploy:
    name: Firebase Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history. The diff below spans every commit in the push, and a
          # shallow clone does not contain the commit the push started from.
          fetch-depth: 0

      # Determine which files changed so we can deploy selectively on push.
      #
      # Across the WHOLE push, not just its last commit. `git diff HEAD~1 HEAD`
      # asked whether the final commit touched functions/ — so a push of six
      # commits whose last one happened to touch only the app skipped the
      # functions deploy, reported success in twelve seconds, and left the
      # functions live on old code with nothing to say so.
      - name: Detect changed paths
        id: changed
        if: github.event_name == 'push'
        run: |
          BEFORE='${{ github.event.before }}'
          # A new branch, a force push, or a commit that has since been
          # garbage-collected leaves nothing to compare against. Deploy in that
          # case rather than skip: a needless deploy costs a few minutes, a
          # silent skip costs however long it takes somebody to notice.
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Cannot resolve ${BEFORE:-<empty>} — deploying everything."
            echo "functions=1" >> "$GITHUB_OUTPUT"
            echo "rules=1" >> "$GITHUB_OUTPUT"
            echo "storage=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BEFORE" '${{ github.sha }}' > /tmp/changed.txt
          # A change to this workflow deploys everything once, so a step added
          # here runs straight away instead of waiting for its files to change.
          if grep -q '.github/workflows/deploy-firebase.yml' /tmp/changed.txt; then
            echo "Workflow changed — deploying everything."
            echo "functions=1" >> "$GITHUB_OUTPUT"
            echo "rules=1" >> "$GITHUB_OUTPUT"
            echo "storage=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "functions=$(grep -c 'mission-portal-app/functions/' /tmp/changed.txt || true)" >> "$GITHUB_OUTPUT"
          echo "rules=$(grep -c 'mission-portal-app/firestore.rules' /tmp/changed.txt || true)" >> "$GITHUB_OUTPUT"
          echo "storage=$(grep -c 'mission-portal-app/storage.rules' /tmp/changed.txt || true)" >> "$GITHUB_OUTPUT"

      # Authenticate with Firebase using the service account JSON stored
      # as a GitHub secret. Sets GOOGLE_APPLICATION_CREDENTIALS automatically.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # The functions' runtime is the one in functions/package.json's
      # "engines" (Node 24); the CLI loads them on this one to read what to
      # deploy, so the two are kept the same.
      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Install the functions' npm deps so the predeploy TypeScript build works.
      # Only needed when functions are being deployed.
      - name: Install Functions dependencies
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.deploy_functions == true) ||
          (github.event_name == 'push' && steps.changed.outputs.functions != '0')
        run: npm ci
        working-directory: mission-portal-app/functions

      # Miriam's model (functions/models/minilm, about 25 MB) is left out of the
      # functions' source (firebase.json: functions.ignore). Before, a copy went
      # into every function, about 1.2 GB for each deploy. Now it is kept in Cloud
      # Storage, in the default bucket, and askMiriam, miriamOwnAdmin and
      # readChurchSite fetch it from there (functions/src/miriam/model). It is
      # uploaded before the deploy so the new functions find it. Files already
      # there unchanged aren't uploaded again. If this step fails, the functions
      # aren't deployed: without the model, Miriam can't read requests.
      - name: Upload Miriam's model
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.deploy_functions == true) ||
          (github.event_name == 'push' && steps.changed.outputs.functions != '0')
        run: |
          npm run build
          node lib/scripts/uploadModel.js "$(node -p "require('../../firebase.json').storage[0].bucket")"
        working-directory: mission-portal-app/functions

      # Functions taken out of the source are deleted from the project here,
      # by name. The deploy below stops, changing nothing, when it finds a
      # function in the project that the source no longer has: it won't delete
      # one unasked. So each one retired is named here, with why, and deleted
      # before it. Once they are gone this step does nothing, and the names
      # can stay.
      #
      # - The app's own email (Resend): never switched on, and removed.
      #   sendContactForm, weeklyDigest, monthlyDigest, sendDigestManual,
      #   resendWebhook, unsubscribe.
      - name: Delete retired functions
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.deploy_functions == true) ||
          (github.event_name == 'push' && steps.changed.outputs.functions != '0')
        env:
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          RETIRED: sendContactForm weeklyDigest monthlyDigest sendDigestManual resendWebhook unsubscribe
        run: |
          deployed=$(npx firebase-tools functions:list --json --project "$PROJECT" | jq -r '.result[]?.id' || true)
          gone=""
          for name in $RETIRED; do
            if printf '%s\n' "$deployed" | grep -qx "$name"; then gone="$gone $name"; fi
          done
          if [ -z "$gone" ]; then
            echo "None of the retired functions is deployed."
            exit 0
          fi
          echo "Deleting:$gone"
          npx firebase-tools functions:delete $gone --force --project "$PROJECT"

      # Deploy Cloud Functions only when functions source changed (or manually requested).
      - name: Deploy Cloud Functions
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.deploy_functions == true) ||
          (github.event_name == 'push' && steps.changed.outputs.functions != '0')
        run: npx firebase-tools deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }}

      # Who may see each event, written on it and on its availability records
      # (functions/src/scripts/settleAll), before the rules below read it: a
      # non-public event is read only by those on it. Uses the build the
      # functions deploy just made. The half-hourly settleEventRecords does the
      # same for events, as a safety net.
      - name: Settle events
        id: settle
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.deploy_functions == true) ||
          (github.event_name == 'push' && steps.changed.outputs.functions != '0')
        run: node lib/scripts/settleAll.js
        working-directory: mission-portal-app/functions

      # Deploy Firestore security rules only when the rules file changed (or manually requested).
      # Even when the functions step failed: the two are independent, and a
      # transient Cloud Run error on one function once left a new rule
      # undeployed — and the feature it was for unable to save anything.
      # Not when settling events failed, though: the rules read what it writes,
      # and without it members would be shown no events at all.
      - name: Deploy Firestore Rules
        if: |
          !cancelled() && steps.settle.outcome != 'failure' && (
            (github.event_name == 'workflow_dispatch' && inputs.deploy_rules == true) ||
            (github.event_name == 'push' && steps.changed.outputs.rules != '0')
          )
        run: npx firebase-tools deploy --only firestore:rules --project ${{ secrets.FIREBASE_PROJECT_ID }}

      # The Storage rules read each person's roles from Firestore
      # (storage.rules). That works only while the project's Storage service
      # agent holds the role "Firebase Rules Firestore Service Agent". Without
      # it, every rule that reads a role refuses everyone: no photo, cover or
      # track could be put up or taken down, anywhere in the app. The Firebase
      # CLI offers to grant it when someone deploys by hand, and says nothing
      # here. So it is looked for first, granted if this deploy's account is
      # allowed to, and the rules are held back, with why, if it isn't there:
      # the rules already deployed stay, and the app goes on working.
      #
      # If this deploy's account can't read the project's access list at all,
      # the check can't see a grant made by hand either: then set the
      # repository variable STORAGE_RULES_READ_FIRESTORE to "granted" once it
      # is (README: Deploying).
      - name: Let Storage rules read roles from Firestore
        id: storage_reads_firestore
        if: |
          !cancelled() && (
            (github.event_name == 'workflow_dispatch' && inputs.deploy_storage_rules == true) ||
            (github.event_name == 'push' && steps.changed.outputs.storage != '0')
          )
        env:
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          CONFIRMED: ${{ vars.STORAGE_RULES_READ_FIRESTORE }}
        run: |
          if [ "$CONFIRMED" = granted ]; then
            echo "Confirmed by hand (STORAGE_RULES_READ_FIRESTORE)."
            exit 0
          fi
          ROLE=roles/firebaserules.firestoreServiceAgent
          # The project's number: asked for, or as the app's own settings have it.
          NUMBER=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)' 2>/dev/null || true)
          if [ -z "$NUMBER" ]; then
            NUMBER=$(node -p "require('./mission-portal-app/eas.json').build.production.env.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID")
          fi
          MEMBER="serviceAccount:service-${NUMBER}@gcp-sa-firebasestorage.iam.gserviceaccount.com"
          granted() {
            gcloud projects get-iam-policy "$PROJECT" --format=json 2>/dev/null \
              | jq -e --arg role "$ROLE" --arg member "$MEMBER" \
                  'any(.bindings[]?; .role == $role and (.members | index($member) != null))' \
                  >/dev/null 2>&1
          }
          if granted; then
            echo "The Storage service agent may read Firestore for the rules."
            exit 0
          fi
          echo "Not granted yet: trying to grant it."
          gcloud projects add-iam-policy-binding "$PROJECT" \
            --member="$MEMBER" --role="$ROLE" --condition=None --quiet >/dev/null 2>&1 || true
          if granted; then
            echo "Granted."
            exit 0
          fi
          echo "::error::The Storage rules were NOT deployed. They read roles from Firestore, which needs a one-time grant this deploy could not see or make. The rules from before are still in place. See README: Deploying, 'Storage rules and Firestore'."
          exit 1

      # Storage rules, on the same terms as the Firestore rules above. Without
      # this step a new upload folder (eventFlights/, eventLodging/) stayed
      # denied until someone remembered to deploy the rules by hand. Only once
      # the step above has found that they will be able to read Firestore.
      - name: Deploy Storage Rules
        if: |
          !cancelled() && steps.storage_reads_firestore.outcome == 'success' && (
            (github.event_name == 'workflow_dispatch' && inputs.deploy_storage_rules == true) ||
            (github.event_name == 'push' && steps.changed.outputs.storage != '0')
          )
        run: npx firebase-tools deploy --only storage --project ${{ secrets.FIREBASE_PROJECT_ID }}
