name: Deploy Firebase

on:
  # Manual trigger from the GitHub Actions UI — checkboxes let you
  # deploy functions, rules, or both independently.
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy Cloud Functions'
        type: boolean
        default: true
      deploy_rules:
        description: 'Deploy Firestore Rules'
        type: boolean
        default: false

  # Auto-deploy when the relevant source files land on main.
  push:
    branches: [main]
    paths:
      - 'mission-portal-app/functions/**'
      - 'mission-portal-app/firestore.rules'

jobs:
  deploy:
    name: Firebase Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Determine which files changed so we can deploy selectively on push.
      - name: Detect changed paths
        id: changed
        if: github.event_name == 'push'
        run: |
          git diff --name-only HEAD~1 HEAD > /tmp/changed.txt
          echo "functions=$(grep -c 'mission-portal-app/functions/' /tmp/changed.txt || true)" >> "$GITHUB_OUTPUT"
          echo "rules=$(grep -c 'mission-portal-app/firestore.rules' /tmp/changed.txt || true)" >> "$GITHUB_OUTPUT"

      # Authenticate with Firebase using the service account JSON stored
      # as a GitHub secret. Sets GOOGLE_APPLICATION_CREDENTIALS automatically.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install the functions' npm deps so the predeploy TypeScript build works.
      # Only needed when functions are being deployed.
      - name: Install Functions dependencies
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.deploy_functions == true) ||
          (github.event_name == 'push' && steps.changed.outputs.functions != '0')
        run: npm ci
        working-directory: mission-portal-app/functions

      # Deploy Cloud Functions only when functions source changed (or manually requested).
      - name: Deploy Cloud Functions
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.deploy_functions == true) ||
          (github.event_name == 'push' && steps.changed.outputs.functions != '0')
        run: npx firebase-tools deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }}

      # Deploy Firestore security rules only when the rules file changed (or manually requested).
      - name: Deploy Firestore Rules
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.deploy_rules == true) ||
          (github.event_name == 'push' && steps.changed.outputs.rules != '0')
        run: npx firebase-tools deploy --only firestore:rules --project ${{ secrets.FIREBASE_PROJECT_ID }}
